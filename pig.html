<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桥巴的歌单 🎧</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; padding: 40px 0 20px; }
        
        .header-title-wrapper {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; flex-wrap: wrap; margin-bottom: 15px;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff7e5f, #feb47b, #86a8e7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px; margin-bottom: 0;
        }

        .douyin-link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px;
            background: linear-gradient(135deg, #25F4EE 0%, #FE2C55 100%);
            color: #fff; text-decoration: none; border-radius: 20px;
            font-size: 0.9rem; font-weight: bold; transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3); white-space: nowrap;
        }
        .douyin-link:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(254, 44, 85, 0.5); }
        .douyin-icon { font-size: 1.1rem; }

        .stats {
            display: inline-block; background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px; border-radius: 20px; font-size: 0.9rem;
            color: #ddd; backdrop-filter: blur(5px);
        }
        .stats span { color: #ff7e5f; font-weight: bold; font-size: 1.1rem; }

        .controls {
            max-width: 900px; margin: 30px auto;
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
            justify-content: center;
        }
        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box input {
            width: 100%; padding: 15px 20px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05); color: #fff;
            font-size: 1rem; outline: none; transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: #ff7e5f; background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 126, 95, 0.3);
        }
        .search-box input::placeholder { color: #888; }

        .action-btn {
            padding: 15px 25px; border-radius: 30px; border: none;
            color: #fff; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s; white-space: nowrap;
        }
        .random-btn {
            background: linear-gradient(135deg, #86a8e7, #7b9cf0);
            box-shadow: 0 5px 15px rgba(134, 168, 231, 0.4);
        }
        .random-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(134, 168, 231, 0.6); }
        
        .reset-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            box-shadow: 0 5px 15px rgba(253, 160, 133, 0.4);
        }
        .reset-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(253, 160, 133, 0.6); }
        
        .list-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3);
        }
        .list-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(56, 239, 125, 0.5); }
        .list-btn .badge {
            background: #fff; color: #11998e; padding: 2px 8px;
            border-radius: 10px; font-size: 0.8rem; margin-left: 5px;
        }

        .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .tab-btn {
            padding: 8px 20px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05); color: #ccc;
            cursor: pointer; transition: all 0.3s; font-size: 0.95rem;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; transform: translateY(-2px); }
        .tab-btn.active {
            background: linear-gradient(135deg, #ff7e5f, #feb47b); color: #fff;
            border-color: transparent; box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4); font-weight: bold;
        }

        .category-section { margin-bottom: 40px; animation: fadeIn 0.5s ease; }
        .category-title {
            font-size: 1.5rem; margin-bottom: 20px; padding-left: 15px;
            border-left: 4px solid #ff7e5f; color: #fff;
            display: flex; align-items: center; gap: 10px;
        }
        .category-title .count { font-size: 0.9rem; color: #888; font-weight: normal; }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .song-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 12px 15px;
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .song-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 126, 95, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .song-name {
            font-size: 0.95rem; color: #eee; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-right: 10px;
        }

        .add-to-list-btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(56, 239, 125, 0.15); border: 1px solid rgba(56, 239, 125, 0.3);
            color: #38ef7d; font-size: 1.2rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.2s; line-height: 1;
        }
        .song-card:hover .add-to-list-btn { background: rgba(56, 239, 125, 0.3); }
        .add-to-list-btn:hover { transform: scale(1.1); background: #38ef7d; color: #0f0c29; }
        .add-to-list-btn.added {
            background: #38ef7d; color: #0f0c29; border-color: #38ef7d;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: #666; font-size: 1.2rem; }

        .modal {
            display: none; position: fixed; z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; animation: fadeIn 0.3s;
        }
        .modal-content {
            background: linear-gradient(135deg, #1f1c2c 0%, #302b63 100%);
            padding: 30px; border-radius: 20px; text-align: center;
            width: 90%; max-width: 500px; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 80vh; display: flex; flex-direction: column;
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px;
            color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer;
        }
        .close-btn:hover { color: #fff; }

        .random-song-name {
            font-size: 2rem; font-weight: bold; color: #ff7e5f;
            margin: 20px 0 10px; min-height: 50px;
            text-shadow: 0 0 10px rgba(255, 126, 95, 0.5);
        }
        .random-song-category { font-size: 1rem; color: #ccc; margin-bottom: 30px; transition: all 0.3s; }
        .play-again-btn {
            padding: 12px 30px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
        }

        .list-modal-content { text-align: left; }
        .list-modal-content h2 { text-align: center; color: #38ef7d; margin-bottom: 20px; }
        .list-items {
            flex: 1; overflow-y: auto; margin-bottom: 20px;
            padding-right: 10px;
        }
        .list-items::-webkit-scrollbar { width: 6px; }
        .list-items::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 12px 15px;
            border-radius: 10px; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .list-item-info { flex: 1; overflow: hidden; }
        .list-item-name { color: #fff; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-item-cat { color: #888; font-size: 0.8rem; margin-top: 2px; }
        .remove-btn {
            background: rgba(255, 75, 75, 0.15); border: 1px solid rgba(255, 75, 75, 0.3);
            color: #ff4b4b; width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0; margin-left: 10px;
        }
        .remove-btn:hover { background: #ff4b4b; color: #fff; }
        
        .list-actions { display: flex; gap: 10px; justify-content: center; }
        .clear-list-btn {
            padding: 10px 25px; border-radius: 20px; border: 1px solid #ff4b4b;
            background: transparent; color: #ff4b4b; cursor: pointer; transition: all 0.3s;
        }
        .clear-list-btn:hover { background: #ff4b4b; color: #fff; }
        .empty-list { text-align: center; color: #666; padding: 40px 0; }

        .site-footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px 0 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .footer-link {
            color: #888; text-decoration: none; transition: all 0.3s;
            font-size: 0.9rem; letter-spacing: 1px;
        }
        .footer-link:hover {
            color: #86a8e7; text-shadow: 0 0 8px rgba(134, 168, 231, 0.5);
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 99;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-to-top:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.6);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        .shake { animation: shake 0.5s; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .header-title-wrapper { gap: 10px; }
            .douyin-link { font-size: 0.8rem; padding: 6px 14px; }
            .controls { flex-direction: column; }
            .action-btn { width: 100%; }
            .songs-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .song-card { padding: 10px 12px; }
            .song-name { font-size: 0.85rem; }
            .random-song-name { font-size: 1.5rem; }
            .site-footer { margin-top: 40px; }
            .back-to-top {
                width: 45px; height: 45px;
                bottom: 20px; right: 20px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title-wrapper">
            <h1>🎧 桥巴的歌单</h1>
            <a href="https://v.douyin.com/OJHvhGS2YKc/" target="_blank" rel="noopener noreferrer" class="douyin-link">
                <span class="douyin-icon">🎵</span> 前往桥巴的抖音
            </a>
        </div>
        <div class="stats">共收录 <span id="totalCount">0</span> 首心动旋律</div>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索歌曲名称...">
        </div>
        <button class="action-btn list-btn" id="openListBtn">🎤 待唱清单 <span class="badge" id="listCountBadge">0</span></button>
        <button class="action-btn random-btn" id="randomBtn">🎲 随机抽一首</button>
        <button class="action-btn reset-btn" id="resetBtn">🔄 重新整理</button>
    </div>

    <nav class="tabs" id="tabs"></nav>
    <main class="content" id="content"></main>

    <footer class="site-footer">
        <a href="https://www.douyin.com/user/MS4wLjABAAAAamj38l-UDbYbUGcPhEdJI-rM8-Y_tAMFLy7kZAWMpJw" target="_blank" rel="noopener noreferrer" class="footer-link">
            新竹奇奇制作
        </a>
    </footer>
</div>

<button class="back-to-top" id="backToTopBtn" title="回到顶部">⬆️</button>

<div id="randomModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" data-close="randomModal">&times;</span>
        <h2>🎉 命运之轮转动！</h2>
        <div class="random-song-name" id="randomSongName">准备中...</div>
        <div class="random-song-category" id="randomSongCategory"></div>
        <button class="play-again-btn" id="playAgainBtn">🎲 再抽一次</button>
    </div>
</div>

<div id="listModal" class="modal">
    <div class="modal-content list-modal-content">
        <span class="close-btn" data-close="listModal">&times;</span>
        <h2>🎤 我的待唱清单</h2>
        <div class="list-items" id="listItems"></div>
        <div class="list-actions">
            <button class="clear-list-btn" id="clearListBtn">🗑️ 清空清单</button>
        </div>
    </div>
</div>

<script>
    const playlistData = {
        "华语经典": ["恶作剧", "爱丫爱丫", "我知道", "有你在", "那么骄傲", "爱的双重魅力", "你在不在", "亲爱的那不是爱情", "下雨天", "最后一页", "夏天的风", "达尔文", "Letting Go", "忘记时间", "是否", "一直很安静", "此生不换", "天若有情", "命运", "虚拟", "走马", "奇妙能力歌", "演员", "天外来物", "爱情讯息", "烟火里的尘埃", "特别的人", "下一个天亮", "雨爱", "若是月亮还没来", "大山", "不要怕", "爱我还是她", "那些你不知道的事", "爱错", "匿名的好友", "带我走", "太阳", "夏夜最后的烟火", "慢慢", "慢慢喜欢你", "这世间那么多人", "我们的爱", "想你的365天", "这条小鱼在乎", "去有风的地方", "路过人间", "秋风", "追梦赤子心", "爱人错过", "喜欢你", "指纹", "我是一只鱼", "霓虹甜心", "跳楼机", "杀死那个石家庄人", "百年孤寂"],
        "五月天": ["知足", "温柔", "你不是真正的快乐", "倔强", "无与伦比的美丽", "小情歌"],
        "邓紫棋": ["多远都要在一起", "唯一", "泡沫", "喜欢你", "句号", "倒数", "光年之外", "红蔷薇白玫瑰", "Where Did U Go", "再见", "后会无期", "我的秘密", "桃花诺", "Ainy", "天空没有极限", "受难曲", "画", "你把我灌醉", "来自天堂的魔鬼", "你不是真正的快乐", "差不多姑娘", "突然之间", "很久以后", "冰河时代", "情人", "存在", "老人与海", "另一个童话", "岩石里的花", "寂寞星球的玫瑰", "偶尔"],
        "孙燕姿": ["我怀恋的", "开始懂了", "遇见", "绿光", "我不难过", "第一天", "天黑黑", "青花", "泪桥"],
        "周杰伦": ["晴天", "搁浅", "稻香", "七里香", "花海", "龙卷风", "给我一首歌的时间", "明明就", "枫", "一路向北", "告白气球", "爱的飞行日记", "最长的电影", "不能说的秘密"],
        "民谣": ["王昭君", "安和桥", "我记得", "程艾影", "理想", "我要你"],
        "林俊杰": ["Always Online", "江南", "可惜没有如果", "愿与愁", "美人鱼", "修炼爱情", "背对背拥抱", "当你", "不潮不用花钱", "那些你很冒险的梦", "曹操", "她说", "交换余生", "飞云之下"],
        "戏腔": ["赤伶", "须尽欢", "身骑白马", "壁上观", "牵丝戏", "鸳鸯戏", "光亮", "探故知"],
        "emo": ["在加纳", "晚婚", "谁", "国王与乞丐", "我走后", "水星记", "唯一", "多远都要在一起", "瞬", "我知道", "如果可以", "冬眠", "体面", "嘉宾", "一个人想着一个人", "想自由", "记得", "背对背拥抱", "给我一个理由忘记", "慢冷", "关键词", "坠落", "幸福了然后呢", "在夜里跳舞", "我只能离开"],
        "新歌": ["仗着", "房间", "推开世界的门", "虚拟", "这条小鱼在乎", "在夜里跳舞", "路过人间", "喜欢你", "王昭君", "给我一首歌的时间", "梦一场", "走马", "冻结", "慢冷", "奇妙能力歌", "从前说", "千千万万", "旅行的意义", "我会等", "暮色回响", "兜圈", "微风起"]
    };

    let currentCategory = "全部";
    let searchQuery = "";
    let allSongsFlat = [];
    // 保持原有的 key 不变，防止用户更新代码后丢失待唱清单数据
    let singList = JSON.parse(localStorage.getItem('qiaoba_sing_list')) || [];

    for (const [category, songs] of Object.entries(playlistData)) {
        songs.forEach(song => allSongsFlat.push({ name: song, category: category }));
    }

    function init() {
        renderTabs();
        renderContent();
        updateTotalCount();
        updateListCount();
        setupRandomizer();
        setupSingList();
        setupResetBtn();
        setupBackToTop();
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderContent();
        });
    }

    function setupResetBtn() {
        document.getElementById('resetBtn').addEventListener('click', () => {
            location.reload();
        });
    }

    function setupBackToTop() {
        const backToTopBtn = document.getElementById('backToTopBtn');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    function setupSingList() {
        const openListBtn = document.getElementById('openListBtn');
        const listModal = document.getElementById('listModal');
        const clearListBtn = document.getElementById('clearListBtn');

        openListBtn.addEventListener('click', () => {
            renderSingListModal();
            listModal.style.display = 'flex';
        });

        clearListBtn.addEventListener('click', () => {
            if(confirm('确定要清空所有待唱歌曲吗？')) {
                singList = [];
                saveSingList();
                renderSingListModal();
                renderContent();
            }
        });
    }

    function toggleSingList(songName, category) {
        const index = singList.findIndex(item => item.name === songName);
        if (index > -1) {
            singList.splice(index, 1);
        } else {
            singList.push({ name: songName, category: category });
        }
        saveSingList();
        updateListCount();
        renderContent();
    }

    function addToList(songName, category) {
        const isAlreadyInList = singList.some(item => item.name === songName);
        if (!isAlreadyInList) {
            singList.push({ name: songName, category: category });
            saveSingList();
            updateListCount();
            renderContent();
            return true;
        }
        return false;
    }

    function removeFromSingList(songName) {
        singList = singList.filter(item => item.name !== songName);
        saveSingList();
        updateListCount();
        renderSingListModal();
        renderContent();
    }

    function saveSingList() {
        localStorage.setItem('qiaoba_sing_list', JSON.stringify(singList));
    }

    function updateListCount() {
        document.getElementById('listCountBadge').textContent = singList.length;
    }

    function renderSingListModal() {
        const listItems = document.getElementById('listItems');
        if (singList.length === 0) {
            listItems.innerHTML = '<div class="empty-list">🎵 清单空空如也，快去挑选想唱的歌吧！</div>';
            return;
        }

        listItems.innerHTML = singList.map((item, index) => `
            <div class="list-item">
                <div class="list-item-info">
                    <div class="list-item-name">${index + 1}. ${item.name}</div>
                    <div class="list-item-cat">来自：${item.category}</div>
                </div>
                <button class="remove-btn" onclick="removeFromSingList('${item.name}')" title="移除">×</button>
            </div>
        `).join('');
    }

    function setupRandomizer() {
        const randomBtn = document.getElementById('randomBtn');
        const randomModal = document.getElementById('randomModal');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const randomSongName = document.getElementById('randomSongName');
        const randomSongCategory = document.getElementById('randomSongCategory');

        function openModal() {
            randomModal.style.display = 'flex';
            randomSongName.classList.remove('shake');
            randomSongCategory.textContent = '命运选择中...';
            
            let count = 0;
            const maxCount = 15; 
            const interval = setInterval(() => {
                const rIndex = Math.floor(Math.random() * allSongsFlat.length);
                randomSongName.textContent = allSongsFlat[rIndex].name;
                count++;
                
                if (count >= maxCount) {
                    clearInterval(interval);
                    const fIndex = Math.floor(Math.random() * allSongsFlat.length);
                    const finalSong = allSongsFlat[fIndex];
                    
                    randomSongName.textContent = finalSong.name;
                    randomSongName.classList.add('shake');
                    
                    const addedSuccessfully = addToList(finalSong.name, finalSong.category);
                    
                    if (addedSuccessfully) {
                        randomSongCategory.innerHTML = `来自分类：${finalSong.category} <br><span style="color: #38ef7d; font-weight: bold; font-size: 0.9rem;">🎉 已自动加入待唱清单！</span>`;
                    } else {
                        randomSongCategory.innerHTML = `来自分类：${finalSong.category} <br><span style="color: #888; font-size: 0.9rem;">(这首歌已经在待唱清单里啦)</span>`;
                    }
                }
            }, 80);
        }

        randomBtn.addEventListener('click', openModal);
        playAgainBtn.addEventListener('click', openModal);
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('tabs');
        const categories = ["全部", ...Object.keys(playlistData)];
        tabsContainer.innerHTML = categories.map(cat => `
            <button class="tab-btn ${cat === currentCategory ? 'active' : ''}" data-category="${cat}">${cat}</button>
        `).join('');

        tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.dataset.category;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderContent();
            });
        });
    }

    function renderContent() {
        const contentContainer = document.getElementById('content');
        let html = '';
        let hasResults = false;
        const categoriesToRender = currentCategory === "全部" ? Object.keys(playlistData) : [currentCategory];

        categoriesToRender.forEach(category => {
            const songs = playlistData[category];
            const filteredSongs = songs.filter(song => song.toLowerCase().includes(searchQuery));

            if (filteredSongs.length > 0) {
                hasResults = true;
                html += `
                    <section class="category-section">
                        <h2 class="category-title">${category} <span class="count">(${filteredSongs.length}首)</span></h2>
                        <div class="songs-grid">
                            ${filteredSongs.map(song => {
                                const isInList = singList.some(item => item.name === song);
                                return `
                                <div class="song-card" title="${song}">
                                    <div class="song-name">${highlightText(song, searchQuery)}</div>
                                    <div class="add-to-list-btn ${isInList ? 'added' : ''}" 
                                         onclick="toggleSingList('${song}', '${category}')" 
                                         title="${isInList ? '移出待唱' : '加入待唱'}">
                                        ${isInList ? '✓' : '+'}
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    </section>
                `;
            }
        });

        if (!hasResults) html = `<div class="empty-state">🎵 没有找到相关的歌曲，换个关键词试试吧~</div>`;
        contentContainer.innerHTML = html;
    }

    function highlightText(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<span style="color: #ff7e5f; font-weight: bold;">$1</span>');
    }

    function updateTotalCount() {
        const allSongs = new Set();
        Object.values(playlistData).forEach(songs => songs.forEach(song => allSongs.add(song)));
        document.getElementById('totalCount').textContent = allSongs.size;
    }

    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('close-btn') || e.target.classList.contains('modal')) {
            const modalId = e.target.dataset.close || e.target.id;
            if(modalId) document.getElementById(modalId).style.display = 'none';
        }
    });

    init();
</script>
</body>
</html>
