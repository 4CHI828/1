<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>是芹菜菜菜🥬</title>
  <style>
    :root {
      --primary-green: #228b22;
      --light-green: #a8d5a2;
      --bg-color: #f0fff0;
      --accent-green: #c8e6c9;
      --text-dark: #064420;
      --water-blue: #00bfff;
    }

    body {
      background-color: var(--bg-color);
      background-image: url('celery-leaf.png'); 
      background-repeat: repeat;
      background-size: 120px 120px;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 主容器：將原本 body 的邊框移到這裡 */
    .main-container {
      background-color: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(5px);
      max-width: 800px;
      width: 90%;
      padding: 40px 20px;
      border: 15px solid var(--light-green);
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(34, 139, 34, 0.2), inset 0 0 20px rgba(34, 139, 34, 0.1);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h1 {
      color: var(--primary-green);
      font-size: clamp(24px, 5vw, 36px);
      margin-bottom: 30px;
      text-shadow: 2px 2px var(--light-green);
      position: relative;
      display: inline-block;
    }

    /* 水滴動畫優化 */
    .drop {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: var(--water-blue);
      border-radius: 50%;
      animation: drip 2s infinite ease-in;
      opacity: 0;
    }

    @keyframes drip {
      0% { top: 0; opacity: 0; }
      30% { opacity: 1; }
      100% { top: 30px; opacity: 0; }
    }

    /* 按鈕區域佈局 */
    .link-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .btn {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background-color: var(--light-green);
      border: 3px solid var(--primary-green);
      border-radius: 50px; /* 更圓潤的設計 */
      font-size: 18px;
      font-weight: bold;
      color: var(--text-dark);
      text-decoration: none;
      box-shadow: 0 4px 0 var(--primary-green);
      transition: all 0.2s ease;
      min-width: 200px;
      justify-content: center;
    }

    .btn:hover {
      background-color: var(--accent-green);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--primary-green);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 var(--primary-green);
    }

    .celery-icon {
      font-size: 20px;
      margin-right: 10px;
    }

    /* 影片區域優化 */
    .video-section {
      margin-top: 40px;
    }

    h2 {
      color: var(--primary-green);
      font-size: 24px;
      margin-bottom: 20px;
    }

    .video-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
    }

    video {
      width: 100%;
      border: 6px solid var(--primary-green);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    #videoTimeInfo {
      font-size: 14px;
      color: var(--text-dark);
      margin-top: 12px;
      font-family: monospace;
      background: rgba(168, 213, 162, 0.4);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 15px;
    }

    /* 飄落葉子動畫優化：增加隨機擺動 */
    .falling-leaf {
      position: fixed; /* 改用 fixed 避免影響佈局 */
      border-radius: 50% 0 50% 0;
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
      animation: fallLeaf linear forwards;
      background: linear-gradient(135deg, var(--primary-green), var(--light-green));
    }

    @keyframes fallLeaf {
      0% { 
        transform: translateY(-50px) rotate(0deg) translateX(0); 
        opacity: 0; 
      }
      10% { opacity: 0.8; }
      100% { 
        transform: translateY(110vh) rotate(360deg) translateX(50px); 
        opacity: 0; 
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>是芹菜菜菜🥬
      <div class="drop"></div>
    </h1>

    <div class="link-group">
      <a class="btn" href="https://www.youtube.com/playlist?list=PL3LHSN24syoNzhSqnLj6qZSlrPNxpJTMq" target="_blank">
        <span class="celery-icon">🥬</span> 芹菜菜菜YT
      </a>

      <a class="btn" href="https://v.douyin.com/Uxfr40iw1Pw/" target="_blank">
        <span class="celery-icon">🥬</span> 抖音-是芹菜菜菜
      </a>

      <a class="btn" href="https://www.instagram.com/shiqincaicaicai/" target="_blank">
        <span class="celery-icon">🥬</span> 是芹菜菜菜IG
      </a>

      <a class="btn" href="https://www.twitch.tv/shiqincaicaicai" target="_blank">
        <span class="celery-icon">🥬</span> 是芹菜菜菜圖奇
      </a>

      <a class="btn" href="https://discord.com/channels/865334403864461373/1434212358288314438" target="_blank">
        <span class="celery-icon">🥬</span> 芹菜幫DC
      </a>
    </div>

    <div class="video-section">
      <h2>🎬 我是你的菜</h2>
      <div class="video-wrapper">
        <video id="celeryVideo" controls>
          <!-- 這裡已更新為您的 GitHub 影片連結 -->
          <source src="http://4chi828.github.io/1/celery.mp4" type="video/mp4">
          您的瀏覽器不支援影片播放。
        </video>
        <br>
        <div id="videoTimeInfo">
          已播放：0:00　剩餘：0:00　總長度：0:00
        </div>
      </div>
    </div>
  </div>

  <script>
    // 影片時間顯示邏輯
    const video = document.getElementById('celeryVideo');
    const videoTimeInfo = document.getElementById('videoTimeInfo');

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }

    video.addEventListener('timeupdate', () => {
      const current = video.currentTime;
      const remaining = video.duration - current;
      const total = video.duration;
      videoTimeInfo.textContent = `已播放：${formatTime(current)}　剩餘：${formatTime(remaining)}　總長度：${formatTime(total)}`;
    });

    // 葉子生成邏輯
    function createLeaf() {
      const leaf = document.createElement('div');
      leaf.className = 'falling-leaf';
      
      const size = 15 + Math.random() * 25; 
      leaf.style.width = size + 'px';
      leaf.style.height = size + 'px';
      
      leaf.style.left = Math.random() * 100 + 'vw';
      leaf.style.animationDuration = (5 + Math.random() * 5) + 's';
      
      // 隨機一點點透明度差異
      leaf.style.opacity = 0.5 + Math.random() * 0.5;

      document.body.appendChild(leaf);

      leaf.addEventListener('animationend', () => {
        leaf.remove();
      });
    }

    setInterval(createLeaf, 800); // 增加生成頻率讓畫面更豐富
  </script>
</body>
</html>
