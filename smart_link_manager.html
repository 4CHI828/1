<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能連結管理器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* 預留空間給下方的 Debug Log */
            padding-bottom: 25vh; 
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        /* 讀取動畫 */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Debug Log 樣式 */
        #debug-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            z-index: 9999;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            border-top: 2px solid #333;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #debug-panel .log-error { color: #ff5555; }
        #debug-panel .log-warn { color: #ffaa00; }
        #debug-panel .log-info { color: #55ffff; }
        
        /* 隱藏捲軸但保留功能 */
        #debug-panel::-webkit-scrollbar { width: 8px; }
        #debug-panel::-webkit-scrollbar-track { background: #111; }
        #debug-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 backdrop-blur-sm transition-opacity duration-300" style="bottom: 25vh;">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                    <i class="fa-solid fa-link text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">智能連結</h2>
                <p class="text-gray-500 text-sm">自動解析與整理您的收藏連結</p>
            </div>
            
            <div class="space-y-3">
                <!-- 按鈕 1: Google 登入 -->
                <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-200 hover:border-indigo-100 hover:bg-indigo-50 text-gray-700 rounded-xl px-4 py-3.5 font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    <span>Google 登入</span>
                </button>

                <!-- 按鈕 2: 訪客登入 -->
                <button id="btn-anon-login" class="w-full flex items-center justify-center gap-3 bg-gray-50 border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-100 text-gray-700 rounded-xl px-4 py-3.5 font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-300">
                    <i class="fa-solid fa-user-secret text-gray-500"></i>
                    <span>訪客登入 (雲端儲存)</span>
                </button>

                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                    <div class="relative flex justify-center"><span class="bg-white px-4 text-xs text-gray-400">或</span></div>
                </div>

                <!-- 按鈕 3: 本機測試模式 -->
                <button id="btn-local-login" class="w-full flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 py-3.5 font-medium transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-200 shadow-md">
                    <i class="fa-solid fa-hard-drive"></i>
                    <span>直接進入 (本機測試模式)</span>
                </button>
                <p class="text-xs text-center text-gray-400 mt-1">無需網路連線資料庫，儲存於瀏覽器</p>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden flex-col flex-grow">
        <!-- Header -->
        <header class="glass-panel sticky top-0 z-40 shadow-sm">
            <div class="container mx-auto px-4 max-w-7xl h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-link text-sm"></i>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">智能連結</h1>
                    <span id="mode-badge" class="ml-2 text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-semibold">模式</span>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 text-sm text-gray-600 bg-gray-100 px-3 py-1.5 rounded-full">
                        <i class="fa-regular fa-user text-gray-400"></i>
                        <span id="user-name">使用者</span>
                    </div>
                    <button id="btn-logout" class="text-gray-500 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition-colors" title="登出">
                        <i class="fa-solid fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 max-w-7xl py-8">
            <!-- 新增連結區塊 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 relative overflow-hidden">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> 新增連結
                </h2>
                
                <form id="add-link-form">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-globe"></i>
                            </div>
                            <input type="url" id="url-input" required placeholder="貼上網址 (Facebook, YouTube, Maps 等)..." 
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-gray-700">
                        </div>
                        <button type="submit" id="btn-submit-link" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3.5 rounded-xl font-medium transition-all flex items-center justify-center gap-2 min-w-[140px]">
                            <span id="btn-text">解析並儲存</span>
                            <div id="btn-spinner" class="spinner hidden"></div>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 連結列表區塊 -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-gray-900">收藏庫</h2>
                    <span id="link-count" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                
                <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center bg-white rounded-2xl border border-dashed border-gray-300">
                    <i class="fa-regular fa-folder-open text-4xl text-gray-300 mb-3"></i>
                    <h3 class="text-gray-900 font-medium">尚無連結</h3>
                    <p class="text-gray-500 text-sm mt-1">請在上方貼上網址來開始收藏</p>
                </div>

                <div id="links-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <div id="debug-panel">
        <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
            <span class="font-bold text-gray-300">系統日誌 (Debug Log)</span>
            <button onclick="document.getElementById('debug-content').innerHTML=''" class="text-xs bg-gray-800 hover:bg-gray-700 px-2 py-1 rounded text-gray-300">清除</button>
        </div>
        <div id="debug-content" class="space-y-1 pb-4"></div>
    </div>

    <script type="module">
        // ==========================================
        // 1. 攔截並覆寫 Console 以顯示在畫面上
        // ==========================================
        const debugContent = document.getElementById('debug-content');
        function appendLog(type, args) {
            const msg = Array.from(args).map(arg => {
                if (typeof arg === 'object') {
                    try { return JSON.stringify(arg); } catch(e) { return '[Object]'; }
                }
                return arg;
            }).join(' ');
            
            const div = document.createElement('div');
            if (type === 'error') div.className = 'log-error';
            else if (type === 'warn') div.className = 'log-warn';
            else if (type === 'info') div.className = 'log-info';
            
            const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            div.textContent = `[${time}] ${msg}`;
            debugContent.appendChild(div);
            
            // 自動捲動到底部
            const panel = document.getElementById('debug-panel');
            panel.scrollTop = panel.scrollHeight;
        }

        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalInfo = console.info;

        console.log = function() { appendLog('log', arguments); originalLog.apply(console, arguments); };
        console.error = function() { appendLog('error', arguments); originalError.apply(console, arguments); };
        console.warn = function() { appendLog('warn', arguments); originalWarn.apply(console, arguments); };
        console.info = function() { appendLog('info', arguments); originalInfo.apply(console, arguments); };

        console.log("系統啟動中... 日誌攔截器已就緒");

        // 確保 DOM 載入後才執行 Firebase 與 UI 綁定
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("DOM 載入完成，開始初始化模組...");

            try {
                // ==========================================
                // 2. 引入 Firebase (使用 Canvas 提供的全域變數)
                // ==========================================
                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                console.log("Firebase 模組載入成功");

                // 環境變數
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                let app, auth, db;
                let isFirebaseReady = false;

                if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
                    try {
                        app = initializeApp(firebaseConfig);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        isFirebaseReady = true;
                        console.log("Firebase 初始化成功");
                    } catch (e) {
                        console.error("Firebase 初始化失敗:", e.message);
                    }
                } else {
                    console.warn("未偵測到 Firebase 設定檔 (__firebase_config)。將只能使用本機測試模式。");
                }

                // ==========================================
                // 3. 狀態與 DOM 元素
                // ==========================================
                let currentMode = null; // 'firebase' 或是 'local'
                let currentUser = null; // Firebase user 或 local user object
                let linksData = []; 
                let unsubscribe = null;

                const ui = {
                    authOverlay: document.getElementById('auth-overlay'),
                    appContainer: document.getElementById('app-container'),
                    btnGoogle: document.getElementById('btn-google-login'),
                    btnAnon: document.getElementById('btn-anon-login'),
                    btnLocal: document.getElementById('btn-local-login'),
                    btnLogout: document.getElementById('btn-logout'),
                    userName: document.getElementById('user-name'),
                    modeBadge: document.getElementById('mode-badge'),
                    form: document.getElementById('add-link-form'),
                    urlInput: document.getElementById('url-input'),
                    btnSubmit: document.getElementById('btn-submit-link'),
                    btnText: document.getElementById('btn-text'),
                    btnSpinner: document.getElementById('btn-spinner'),
                    grid: document.getElementById('links-grid'),
                    emptyState: document.getElementById('empty-state'),
                    linkCount: document.getElementById('link-count')
                };

                // ==========================================
                // 4. 登入邏輯
                // ==========================================
                
                // 切換 UI 到主畫面
                function showMainApp(mode, userName) {
                    currentMode = mode;
                    ui.authOverlay.classList.add('hidden');
                    ui.appContainer.classList.remove('hidden');
                    ui.appContainer.classList.add('flex');
                    ui.userName.textContent = userName;
                    
                    if (mode === 'local') {
                        ui.modeBadge.textContent = '本機模式';
                        ui.modeBadge.className = 'ml-2 text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-semibold border border-orange-200';
                        loadLocalData();
                    } else {
                        ui.modeBadge.textContent = '雲端同步';
                        ui.modeBadge.className = 'ml-2 text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-semibold border border-emerald-200';
                        setupFirestoreListener();
                    }
                }

                // 本機測試登入
                ui.btnLocal.addEventListener('click', () => {
                    console.info("點擊「本機測試模式」");
                    currentUser = { uid: 'local_user' };
                    showMainApp('local', '測試人員 (本機)');
                });

                // 如果 Firebase 沒準備好，鎖定 Firebase 相關按鈕
                if (!isFirebaseReady) {
                    ui.btnGoogle.disabled = true;
                    ui.btnGoogle.classList.add('opacity-50', 'cursor-not-allowed');
                    ui.btnAnon.disabled = true;
                    ui.btnAnon.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    // Google 登入
                    ui.btnGoogle.addEventListener('click', async () => {
                        console.info("嘗試 Google 登入...");
                        try {
                            const provider = new GoogleAuthProvider();
                            await signInWithPopup(auth, provider);
                            console.log("Google 登入成功");
                        } catch (error) {
                            console.error("Google 登入失敗:", error.code, error.message);
                        }
                    });

                    // 訪客登入
                    ui.btnAnon.addEventListener('click', async () => {
                        console.info("嘗試訪客登入...");
                        try {
                            await signInAnonymously(auth);
                            console.log("訪客登入成功");
                        } catch (error) {
                            console.error("訪客登入失敗:", error.code, error.message);
                        }
                    });

                    // 自動登入檢查 (如果有 Initial Token)
                    if (initialAuthToken) {
                        console.info("偵測到授權 Token，嘗試自動登入...");
                        try {
                            await signInWithCustomToken(auth, initialAuthToken);
                            console.log("Token 登入成功");
                        } catch (error) {
                            console.error("Token 登入失敗:", error.message);
                        }
                    }

                    // 監聽 Firebase 登入狀態
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            console.log("Firebase 狀態: 已登入 (UID:", user.uid, ")");
                            currentUser = user;
                            const name = user.isAnonymous ? '訪客' : (user.displayName || '使用者');
                            showMainApp('firebase', name);
                        } else {
                            console.log("Firebase 狀態: 未登入");
                            if (currentMode === 'firebase') {
                                // 登出後重置 UI
                                currentUser = null;
                                currentMode = null;
                                ui.authOverlay.classList.remove('hidden');
                                ui.appContainer.classList.add('hidden');
                                ui.appContainer.classList.remove('flex');
                                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                            }
                        }
                    });
                }

                // 登出按鈕
                ui.btnLogout.addEventListener('click', async () => {
                    console.info("執行登出...");
                    if (currentMode === 'local') {
                        currentUser = null;
                        currentMode = null;
                        ui.authOverlay.classList.remove('hidden');
                        ui.appContainer.classList.add('hidden');
                        ui.appContainer.classList.remove('flex');
                    } else if (isFirebaseReady) {
                        try {
                            await signOut(auth);
                        } catch (error) {
                            console.error("登出發生錯誤:", error);
                        }
                    }
                });

                // ==========================================
                // 5. 網址解析邏輯 (Gemini API 或是 Mock)
                // ==========================================
                async function parseUrlData(url) {
                    console.log("開始解析網址:", url);
                    const apiKey = ""; // Canvas Runtime 會自動注入
                    
                    // 嘗試呼叫 Gemini
                    try {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                        const prompt = `分析這個網址: ${url}
請回傳純 JSON 格式，不要包含 Markdown 語法 (如 \`\`\`json)。
欄位要求 (請全部使用繁體中文，platform除外):
- platform: "YouTube", "Facebook", "Instagram", "Threads", "Google Maps", 或 "Other"
- title: 根據網址推測的標題
- locationName: 若為地圖則填地點名稱，否則填 null
- category: 分類 (例如: 影音、社群、餐廳、地標、文章)
- description: 一句簡短繁體中文摘要`;

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }]
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                            const parsed = JSON.parse(text);
                            console.log("Gemini 解析成功:", parsed);
                            return parsed;
                        } else {
                            console.warn("Gemini API 回傳錯誤，狀態碼:", response.status);
                        }
                    } catch (error) {
                        console.warn("Gemini API 呼叫失敗，將使用本地備用解析邏輯:", error.message);
                    }

                    // 備用解析邏輯 (Mock Logic)
                    console.log("啟動本地備用解析...");
                    let platform = 'Other', title = '未知連結', loc = null, cat = '未分類', desc = '無摘要資訊';
                    const lowerUrl = url.toLowerCase();
                    
                    if (lowerUrl.includes('youtu')) { platform = 'YouTube'; title = 'YouTube 影片'; cat = '影音'; desc = '這是一段 YouTube 影片連結'; }
                    else if (lowerUrl.includes('facebook.com')) { platform = 'Facebook'; title = 'Facebook 貼文'; cat = '社群'; desc = '這是一則 Facebook 貼文'; }
                    else if (lowerUrl.includes('instagram.com')) { platform = 'Instagram'; title = 'Instagram 貼文'; cat = '社群'; desc = '這是一則 Instagram 貼文'; }
                    else if (lowerUrl.includes('threads.net')) { platform = 'Threads'; title = 'Threads 串文'; cat = '社群'; desc = '這是一則 Threads 討論'; }
                    else if (lowerUrl.includes('google') && lowerUrl.includes('map')) { platform = 'Google Maps'; title = 'Google 地圖地點'; cat = '地標'; loc = '地圖地標'; desc = '這是 Google 地圖上的位置'; }
                    
                    return { platform, title, locationName: loc, category: cat, description: desc };
                }

                // ==========================================
                // 6. 資料儲存與渲染
                // ==========================================
                
                // 處理表單送出
                ui.form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const url = ui.urlInput.value.trim();
                    if (!url) return;

                    console.log("收到新網址送出...");
                    
                    // UI Loading State
                    ui.btnSubmit.disabled = true;
                    ui.urlInput.disabled = true;
                    ui.btnText.classList.add('hidden');
                    ui.btnSpinner.classList.remove('hidden');

                    try {
                        const meta = await parseUrlData(url);
                        
                        const newDoc = {
                            originalUrl: url,
                            platform: meta.platform || 'Other',
                            title: meta.title || '無標題',
                            locationName: meta.locationName || null,
                            category: meta.category || null,
                            description: meta.description || '',
                            createdAt: Date.now() // Local timestamp fallback
                        };

                        if (currentMode === 'local') {
                            console.log("儲存至 LocalStorage");
                            newDoc.id = 'loc_' + Date.now();
                            linksData.unshift(newDoc); // 放最前面
                            localStorage.setItem('smart_links', JSON.stringify(linksData));
                            renderLinks();
                        } else if (currentMode === 'firebase') {
                            console.log("儲存至 Firestore");
                            const ref = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'links');
                            // Replace local timestamp with server timestamp
                            newDoc.createdAt = serverTimestamp();
                            await addDoc(ref, newDoc);
                            console.log("Firestore 儲存成功");
                        }

                        ui.urlInput.value = '';
                    } catch (error) {
                        console.error("儲存連結失敗:", error);
                        alert("處理過程中發生錯誤，請查看日誌。");
                    } finally {
                        ui.btnSubmit.disabled = false;
                        ui.urlInput.disabled = false;
                        ui.btnText.classList.remove('hidden');
                        ui.btnSpinner.classList.add('hidden');
                    }
                });

                // Firestore 監聽
                function setupFirestoreListener() {
                    console.log("設定 Firestore 即時監聽...");
                    const ref = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'links');
                    const q = query(ref);
                    
                    unsubscribe = onSnapshot(q, (snapshot) => {
                        linksData = [];
                        snapshot.forEach(doc => {
                            linksData.push({ id: doc.id, ...doc.data() });
                        });
                        
                        // 記憶體內排序 (新到舊)
                        linksData.sort((a, b) => {
                            const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                            const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                            return timeB - timeA;
                        });
                        
                        console.log(`Firestore 更新: 讀取了 ${linksData.length} 筆資料`);
                        renderLinks();
                    }, (error) => {
                        console.error("Firestore 監聽失敗:", error);
                    });
                }

                // 載入 LocalStorage
                function loadLocalData() {
                    console.log("載入 LocalStorage 資料...");
                    const stored = localStorage.getItem('smart_links');
                    if (stored) {
                        try {
                            linksData = JSON.parse(stored);
                            console.log(`讀取了 ${linksData.length} 筆本地資料`);
                        } catch (e) {
                            console.error("解析 LocalStorage 失敗:", e);
                            linksData = [];
                        }
                    } else {
                        linksData = [];
                    }
                    renderLinks();
                }

                // 渲染畫面
                function renderLinks() {
                    ui.linkCount.textContent = linksData.length;
                    
                    if (linksData.length === 0) {
                        ui.grid.innerHTML = '';
                        ui.emptyState.classList.remove('hidden');
                        ui.emptyState.classList.add('flex');
                        return;
                    }

                    ui.emptyState.classList.add('hidden');
                    ui.emptyState.classList.remove('flex');
                    
                    ui.grid.innerHTML = linksData.map(link => {
                        let pInfo = { icon: 'fa-link', color: 'text-gray-500', bg: 'bg-gray-100', bd: 'border-gray-200' };
                        const p = (link.platform || '').toLowerCase();
                        if (p.includes('youtube')) pInfo = { icon: 'fa-youtube', color: 'text-red-500', bg: 'bg-red-50', bd: 'border-red-100' };
                        else if (p.includes('facebook')) pInfo = { icon: 'fa-facebook', color: 'text-blue-600', bg: 'bg-blue-50', bd: 'border-blue-100' };
                        else if (p.includes('instagram')) pInfo = { icon: 'fa-instagram', color: 'text-pink-600', bg: 'bg-pink-50', bd: 'border-pink-100' };
                        else if (p.includes('threads')) pInfo = { icon: 'fa-at', color: 'text-black', bg: 'bg-gray-100', bd: 'border-gray-200' };
                        else if (p.includes('map')) pInfo = { icon: 'fa-map-location-dot', color: 'text-emerald-600', bg: 'bg-emerald-50', bd: 'border-emerald-100' };

                        return `
                            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm card-hover relative flex flex-col group">
                                <div class="absolute top-4 right-4">
                                    <span class="${pInfo.bg} ${pInfo.color} ${pInfo.bd} border text-[10px] font-bold px-2 py-1 rounded-md tracking-wider flex items-center gap-1">
                                        <i class="fa-brands ${pInfo.icon}"></i> ${link.platform || 'Other'}
                                    </span>
                                </div>
                                
                                <button onclick="window.deleteItem('${link.id}')" class="absolute -top-3 -right-3 w-8 h-8 bg-white border border-gray-200 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 shadow-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all z-10" title="刪除">
                                    <i class="fa-solid fa-times"></i>
                                </button>

                                <div class="mt-4 flex-grow">
                                    <h3 class="text-base font-semibold text-gray-800 line-clamp-2 mb-2 pr-16">${link.title}</h3>
                                    ${link.locationName ? `<p class="text-sm text-emerald-600 mb-1 font-medium"><i class="fa-solid fa-location-dot"></i> ${link.locationName}</p>` : ''}
                                    ${link.category ? `<span class="inline-block bg-indigo-50 text-indigo-600 text-xs px-2 py-0.5 rounded border border-indigo-100 mb-2">${link.category}</span>` : ''}
                                    <p class="text-xs text-gray-500 line-clamp-2 mt-1">${link.description}</p>
                                </div>

                                <div class="mt-4 pt-4 border-t border-gray-50">
                                    <a href="${link.originalUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center gap-2 text-sm text-indigo-600 bg-indigo-50 hover:bg-indigo-100 py-2 rounded-lg transition-colors">
                                        開啟連結 <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 全域刪除方法
                window.deleteItem = async (id) => {
                    console.log("嘗試刪除項目:", id);
                    if (currentMode === 'local') {
                        linksData = linksData.filter(item => item.id !== id);
                        localStorage.setItem('smart_links', JSON.stringify(linksData));
                        renderLinks();
                        console.log("本機資料刪除成功");
                    } else if (currentMode === 'firebase') {
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'links', id));
                            console.log("Firestore 資料刪除成功");
                        } catch (error) {
                            console.error("刪除失敗:", error);
                        }
                    }
                };

            } catch (err) {
                console.error("全域初始化發生嚴重錯誤:", err);
            }
        });
    </script>
</body>
</html>
