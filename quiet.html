<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>静静在夏天🍔🎤⁰³²⁰</title>
  <style>
    :root {
      --burger-yellow: #ffcc66;
      --burger-orange: #ff9966;
      --burger-dark: #663300;
      --ketchup-red: #ff2b2b;
      --neon-cyan: #00ffff;
      --player-bg: #2b2d31;
      --list-bg: #232428;
    }

    body {
      background: #fff8f0 url('burger-bg.png') repeat;
      font-family: "Microsoft JhengHei", sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px;
      border: 20px solid var(--burger-yellow);
      border-radius: 40px;
      box-shadow: inset 0 0 20px rgba(255, 153, 51, 0.3);
      position: relative;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sesame { position: absolute; width: 8px; height: 5px; background: #fff; border-radius: 50%; box-shadow: 2px 2px 3px rgba(0,0,0,0.1); }
    .sesame:nth-child(1) { top: 15px; left: 40px; }
    .sesame:nth-child(2) { top: 25px; right: 60px; }
    .sesame:nth-child(3) { bottom: 20px; left: 80px; }
    .sesame:nth-child(4) { bottom: 30px; right: 100px; }
    .sesame:nth-child(5) { top: 50%; left: 10px; }
    .sesame:nth-child(6) { top: 50%; right: 20px; }

    h1 { color: var(--burger-orange); font-size: 28px; margin-bottom: 10px; text-shadow: 2px 2px #ffe0a3; position: relative; display: inline-block; }
    .ketchup { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 80px; height: 8px; background: var(--ketchup-red); border-radius: 4px; animation: drip 2s infinite; }
    @keyframes drip { 0%, 100% { height: 8px; } 50% { height: 25px; } }

    .btn { display: inline-block; margin: 10px; padding: 12px 20px; background-color: var(--burger-yellow); border: 3px solid var(--burger-orange); border-radius: 20px; font-size: 16px; font-weight: bold; color: var(--burger-dark); text-decoration: none; box-shadow: 3px 3px 8px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; }
    .btn:hover { background-color: #ffe0a3; transform: scale(1.05); }
    .burger-icon { font-size: 20px; margin-right: 6px; }

    .player-container {
      background-color: var(--player-bg);
      border-radius: 24px;
      padding: 30px;
      width: 400px;
      margin: 40px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--neon-cyan);
      color: white;
      border: 2px solid #444;
    }

    .now-playing-title {
      font-size: 16px;
      color: var(--burger-yellow);
      margin-bottom: 5px;
      font-weight: bold;
      height: 24px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size-info {
      font-size: 12px;
      color: #888;
      margin-bottom: 15px;
      height: 15px;
    }

    .progress-container { background: #444; height: 8px; width: 100%; border-radius: 10px; margin: 20px 0; cursor: pointer; position: relative; }
    .progress-bar { background: var(--neon-cyan); height: 100%; width: 0%; border-radius: 10px; transition: width 0.1s linear; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 20px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
    .ctrl-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; transition: 0.2s; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:hover { color: var(--neon-cyan); transform: scale(1.1); }
    .play-pause-btn { background: var(--neon-cyan); color: black; font-size: 30px; width: 60px; height: 60px; }

    /* 音量與增益控制區 */
    .audio-settings {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 25px;
      padding: 15px;
      background: #3e4045;
      border-radius: 15px;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .setting-group label {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 5px;
    }
    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      background: #555;
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--neon-cyan);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 5px var(--neon-cyan);
    }

    .song-list-wrapper {
      margin-top: 20px;
      background: var(--list-bg);
      border-radius: 15px;
      padding: 10px;
      border: 1px solid #444;
    }
    .song-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
      max-height: 300px;
      overflow-y: auto;
    }
    .song-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 4px;
      transition: 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item:hover { background: #3e4045; color: white; }
    .song-item.active { background: #444; color: var(--neon-cyan); font-weight: bold; border-left: 4px solid var(--neon-cyan); }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
    .page-btn {
      background: #3e4045;
      color: #ccc;
      border: 1px solid #555;
      padding: 3px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .mode-toggle { margin-top: 20px; font-size: 12px; background: #3e4045; color: #ccc; border: 1px solid #555; padding: 5px 15px; border-radius: 15px; cursor: pointer; }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #aaa;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .footer:hover { opacity: 1; }
    .footer a { color: #aaa; text-decoration: none; transition: color 0.3s; }
    .footer a:hover { color: #888; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="sesame"></div><div class="sesame"></div><div class="sesame"></div>
  <div class="sesame"></div><div class="sesame"></div><div class="sesame"></div>

  <h1>静静在夏天🍔🎤⁰³²⁰<div class="ketchup"></div></h1>

  <div style="margin-bottom: 20px;">
    <a class="btn" href="https://discord.com/channels/865334403864461373/1467603376144646319" target="_blank"><span class="burger-icon">🍔</span> DC靜靜幫</a>
    <a class="btn" href="https://v.douyin.com/_Zfxey53n7I/" target="_blank"><span class="burger-icon">🍔</span> 抖音</a>
    <a class="btn" href="https://www.youtube.com/playlist?list=PL3LHSN24syoOcIqA8nRwfYgAOoR5U27_U" target="_blank"><span class="burger-icon">🍔</span> YT</a>
    <a class="btn" href="https://www.twitch.tv/jingjingzaixiatian" target="_blank"><span class="burger-icon">🍔</span> 圖奇</a>
    <a class="btn" href="https://www.instagram.com/jingjing24739233910/" target="_blank"><span class="burger-icon">🍔</span> IG</a>
    <a class="btn" href="0320.html"><span class="burger-icon">🍔</span> 歌單</a>
  </div>

  <div class="player-container">
    <div id="songTitle" class="now-playing-title">🎶 正在載入歌單...</div>
    <div id="fileSize" class="file-size-info">檔案大小: -- MB</div>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="ctrl-btn play-pause-btn" id="playPauseBtn">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
    </div>

    <!-- 新增：音量與增益控制區 -->
    <div class="audio-settings">
      <div class="setting-group">
        <label>音量 <span id="volVal">100%</span></label>
        <input type="range" id="volSlider" class="slider" min="0" max="1" step="0.01" value="1">
      </div>
      <div class="setting-group">
        <label>增益 <span id="gainVal">1.0x</span></label>
        <input type="range" id="gainSlider" class="slider" min="0.1" max="5" step="0.1" value="1">
      </div>
    </div>

    <div class="song-list-wrapper">
      <div id="songList" class="song-list"></div>
      <div class="pagination">
        <button class="page-btn" id="prevPage">◀ 上一頁</button>
        <span id="pageInfo">第 1 / 1 頁</span>
        <button class="page-btn" id="nextPage">下一頁 ▶</button>
      </div>
    </div>

    <button id="modeToggle" class="mode-toggle">模式：順序播放</button>
  </div>

  <div class="footer">
     <a href="https://www.twitch.tv/chi828" target="_blank">新竹奇奇828製作</a>
  </div>

  <audio id="audioElement" crossorigin="anonymous"></audio>

  <script>
    let songs = []; 
    let currentIndex = 0;
    let isRandom = false;
    let currentPage = 0;
    const songsPerPage = 10;

    // --- Web Audio API 增益設定 ---
    let audioCtx, source, gainNode;
    const audio = document.getElementById('audioElement');
    
    function initAudioContext() {
      if (audioCtx) return; // 避免重複初始化
      
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audio);
      gainNode = audioCtx.createGain();
      
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      console.log("Audio Context 初始化成功");
    }

    const playPauseBtn = document.getElementById('playPauseBtn');
    const songTitle = document.getElementById('songTitle');
    const fileSizeEl = document.getElementById('fileSize');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const songListEl = document.getElementById('songList');
    const pageInfoEl = document.getElementById('pageInfo');
    const volSlider = document.getElementById('volSlider');
    const gainSlider = document.getElementById('gainSlider');
    const volVal = document.getElementById('volVal');
    const gainVal = document.getElementById('gainVal');

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }

    async function getFileSize(url) {
      try {
        const response = await fetch(url, { method: 'HEAD', mode: 'cors' });
        const size = response.headers.get('content-length');
        return size ? (size / (1024 * 1024)).toFixed(2) + ' MB' : '未知大小';
      } catch (e) { return '未知大小'; }
    }

    async function loadPlaylist() {
      try {
        const response = await fetch('songs.json');
        if (!response.ok) throw new Error('無法讀取 songs.json');
        songs = await response.json();
        if (songs.length === 0) throw new Error('歌單為空');
        loadSong(0, false);
        renderList();
      } catch (e) {
        console.error(e);
        songTitle.textContent = "❌ 找不到歌曲列表 (songs.json)";
      }
    }

    async function loadSong(index, shouldPlay = true) {
      currentIndex = index;
      const song = songs[currentIndex];
      if (!song) return;

      audio.src = song.src;
      songTitle.textContent = "🎶 正在播放：" + song.title;
      
      fileSizeEl.textContent = "檔案大小: 讀取中...";
      const size = await getFileSize(song.src);
      fileSizeEl.textContent = "檔案大小: " + size;

      if (shouldPlay) {
        try {
          initAudioContext(); // 確保在播放前初始化 AudioContext
          await audio.play();
          playPauseBtn.textContent = "⏸";
        } catch (e) {
          console.log("播放被攔截");
        }
      }
      renderList(); 
    }

    function togglePlay() {
      initAudioContext(); // 確保初始化
      if (audio.paused) {
        audio.play();
        playPauseBtn.textContent = "⏸";
      } else {
        audio.pause();
        playPauseBtn.textContent = "▶";
      }
    }

    function nextSong() {
      currentIndex = isRandom ? Math.floor(Math.random() * songs.length) : (currentIndex + 1) % songs.length;
      loadSong(currentIndex, true);
      currentPage = Math.floor(currentIndex / songsPerPage);
      renderList();
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex, true);
      currentPage = Math.floor(currentIndex / songsPerPage);
      renderList();
    }

    function renderList() {
      songListEl.innerHTML = "";
      const start = currentPage * songsPerPage;
      const end = Math.min(start + songsPerPage, songs.length);
      for (let i = start; i < end; i++) {
        const item = document.createElement('div');
        item.className = `song-item ${i === currentIndex ? 'active' : ''}`;
        item.textContent = `${i + 1}. ${songs[i].title}`;
        item.onclick = () => loadSong(i, true);
        songListEl.appendChild(item);
      }
      const totalPages = Math.ceil(songs.length / songsPerPage);
      pageInfoEl.textContent = `第 ${currentPage + 1} / ${totalPages} 頁`;
      document.getElementById('prevPage').disabled = (currentPage === 0);
      document.getElementById('nextPage').disabled = (currentPage >= totalPages - 1);
    }

    // --- 音量控制邏輯 ---
    volSlider.oninput = () => {
      audio.volume = volSlider.value;
      volVal.textContent = Math.round(volSlider.value * 100) + "%";
    };

    // --- 增益控制邏輯 ---
    gainSlider.oninput = () => {
      if (gainNode) {
        gainNode.gain.value = gainSlider.value;
        gainVal.textContent = parseFloat(gainSlider.value).toFixed(1) + "x";
      }
    };

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = percent + "%";
      currentTimeEl.textContent = formatTime(audio.currentTime);
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    progressContainer.onclick = (e) => {
      const width = progressContainer.clientWidth;
      audio.currentTime = (e.offsetX / width) * audio.duration;
    };

    audio.addEventListener('ended', nextSong);
    playPauseBtn.onclick = togglePlay;
    document.getElementById('nextBtn').onclick = nextSong;
    document.getElementById('prevBtn').onclick = prevSong;
    
    document.getElementById('prevPage').onclick = () => {
      if (currentPage > 0) { currentPage--; renderList(); }
    };
    document.getElementById('nextPage').onclick = () => {
      const totalPages = Math.ceil(songs.length / songsPerPage);
      if (currentPage < totalPages - 1) { currentPage++; renderList(); }
    };

    document.getElementById('modeToggle').onclick = function() {
      isRandom = !isRandom;
      this.textContent = isRandom ? "模式：隨機播放" : "模式：順序播放";
    };

    loadPlaylist();
  </script>
</body>
</html>
