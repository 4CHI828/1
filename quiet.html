    [data-theme="green"] { --main-color: #c2f0c2; --accent-color: #7ecb7e; --dark-color: #2d5a27; --bg-color: #f0fff0; }
    [data-theme="brown"] { --main-color: #d2b48c; --accent-color: #8b4513; --dark-color: #3e2723; --bg-color: #fdf5e6; }

      height: 14px;

      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--neon-cyan);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;

    .progress-bar:hover .progress-knob, .progress-bar.dragging .progress-knob { opacity: 1; }

        { "title": "靜靜在夏天-連名帶姓", "src": "http://chi.xo.je/MP3/靜靜在夏天-連名帶姓.mp3" },
        { "title": "靜靜在夏天-阿刁(新舊混合最終版)", "src": "http://chi.xo.je/MP3/靜靜在夏天-阿刁(新舊混合最終版).mp3" },
        { "title": "靜靜在夏天-阿刁", "src": "http://chi.xo.je/MP3/靜靜在夏天-阿刁.mp3" },
        { "title": "靜靜在夏天-離歌", "src": "http://chi.xo.je/MP3/靜靜在夏天-離歌.mp3" },
        { "title": "靜靜在夏天-靜靜的", "src": "http://chi.xo.je/MP3/靜靜在夏天-靜靜的.mp3" },

    };

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('song-list');
    const songTitleText = document.getElementById('song-title-text');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playerMain = document.getElementById('player-main');
    const vinylDisc = document.getElementById('vinyl-disc');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const progressKnob = document.getElementById('progress-knob');
    const currTimeText = document.getElementById('curr-time');
    const totalTimeText = document.getElementById('total-time');
    
    const volBtn = document.getElementById('vol-btn');
    const volPanel = document.getElementById('volume-panel');
    const volSlider = document.getElementById('volume-slider');
    const volValueText = document.getElementById('vol-value');

    let isDragging = false;

    function setPlaybackMode(mode, element) {
      Player.mode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    function startTitleScroll(songName) {
      if (Player.titleInterval) clearInterval(Player.titleInterval);
      let titleText = ` 🎵 正在播放：${Lang.convertText(songName)} 🍔🎤 `;
      document.title = titleText;
      Player.titleInterval = setInterval(() => {
        titleText = titleText.substring(1) + titleText[0];
        document.title = titleText;
      }, 300);
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function buildList() {
      playlistContainer.innerHTML = '';
      Player.playlist.forEach((song, index) => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.style.animationDelay = `${index * 0.03}s`; 
        
        let displayTitle = Lang.convertText(song.title);
        const urlLower = song.src.toLowerCase();
        if (urlLower.endsWith('.flac')) displayTitle += " (flac)";
        else if (urlLower.endsWith('.mp3')) displayTitle += " (MP3)";
        
        div.innerHTML = `<span class="song-name-span">${index + 1}. ${displayTitle}</span>`;
        div.onclick = () => playSong(index);
        playlistContainer.appendChild(div);
      });
    }

    function updateActiveSongUI() {
      const items = document.querySelectorAll('.song-item');
      items.forEach((item, idx) => {
        const nameSpan = item.querySelector('.song-name-span');
        if (idx === Player.index) {
          item.classList.add('active');
          const originalText = Lang.convertText(Player.playlist[idx].title);
          const urlLower = Player.playlist[idx].src.toLowerCase();
          const format = urlLower.endsWith('.flac') ? ' (flac)' : (urlLower.endsWith('.mp3') ? ' (MP3)' : '');
          nameSpan.innerText = `▶️ ${idx + 1}. ${originalText}${format}`;
        } else {
          item.classList.remove('active');
          const originalText = Lang.convertText(Player.playlist[idx].title);
          const urlLower = Player.playlist[idx].src.toLowerCase();
          const format = urlLower.endsWith('.flac') ? ' (flac)' : (urlLower.endsWith('.mp3') ? ' (MP3)' : '');
          nameSpan.innerText = `${idx + 1}. ${originalText}${format}`;
        }
      });
    }

    function playSong(index) {
        if (index < 0 || index >= Player.playlist.length) return;
        Player.index = index;
        const song = Player.playlist[Player.index];
        audioPlayer.src = song.src;
        audioPlayer.play().catch(e => console.log("Auto-play blocked"));
        
        songTitleText.style.opacity = 0;
        setTimeout(() => {
          songTitleText.innerText = Lang.convertText(song.title);
          songTitleText.style.opacity = 1;
        }, 200);

        updateActiveSongUI();
        
        const items = document.querySelectorAll('.song-item');
        if (items[Player.index]) {
          items[Player.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        startTitleScroll(song.title);
        localStorage.setItem('last-song-index', index);
    }

    function togglePlay() {
        if (Player.index === -1) { playSong(0); return; }
        if (audioPlayer.paused) audioPlayer.play(); else audioPlayer.pause();
    }

    function playNext() {
        if (Player.mode === 'loopOne') playSong(Player.index);
        else if (Player.mode === 'shuffle') playSong(Math.floor(Math.random() * Player.playlist.length));
        else playSong((Player.index + 1) % Player.playlist.length);
    }

    function playPrevious() {
        let prevIndex = Player.index - 1;
        if (prevIndex < 0) prevIndex = Player.playlist.length - 1;
        playSong(prevIndex);
    }

    function toggleVolumePanel() {
      volPanel.classList.toggle('show');
    }

    function updateVolumeIcon(val) {
      if (val == 0) volBtn.innerText = "🔇";
      else if (val < 0.3) volBtn.innerText = "🔈";
      else if (val < 0.7) volBtn.innerText = "🔉";
      else volBtn.innerText = "🔊";
      volValueText.innerText = Math.round(val * 100) + "%";
    }

    volSlider.oninput = () => {
      const val = parseFloat(volSlider.value);
      audioPlayer.volume = val;
      updateVolumeIcon(val);
      localStorage.setItem('preferred-volume', val); // 記憶音量
    };

    document.addEventListener('click', (e) => {
      if (!volPanel.contains(e.target) && e.target !== volBtn) {
        volPanel.classList.remove('show');
      }
    });

    function handleProgressUpdate() {
      if (isDragging) return;
      const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100 || 0;
      progressFill.style.width = percent + '%';
      progressKnob.style.left = percent + '%';
      currTimeText.innerText = formatTime(audioPlayer.currentTime);
      if (audioPlayer.duration) totalTimeText.innerText = formatTime(audioPlayer.duration);
    }

    function seekToPosition(e) {
      const rect = progressBar.getBoundingClientRect();
      let pos = (e.clientX - rect.left) / rect.width;
      if (pos < 0) pos = 0;
      if (pos > 1) pos = 1;
      
      if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
      }
      progressFill.style.width = (pos * 100) + '%';
      progressKnob.style.left = (pos * 100) + '%';
    }

    progressBar.onpointerdown = (e) => {
      isDragging = true;
      progressBar.classList.add('dragging');
      seekToPosition(e);
    };

    window.onpointermove = (e) => {
      if (isDragging) seekToPosition(e);
    };

    window.onpointerup = () => {
      isDragging = false;
      progressBar.classList.remove('dragging');
    };

    audioPlayer.ontimeupdate = handleProgressUpdate;

    audioPlayer.onplay = () => {
        playPauseBtn.innerText = "⏸️";
        playerMain.classList.remove('paused');
        vinylDisc.classList.add('playing');
    };
    audioPlayer.onpause = () => {
        playPauseBtn.innerText = "▶️";
        playerMain.classList.add('paused');
        vinylDisc.classList.remove('playing');
    };
    audioPlayer.onended = () => {
        if (Player.mode === 'loopOne') audioPlayer.play();
        else playNext();
    };
    audioPlayer.onerror = () => {
        songTitleText.innerText = Lang.dict[Lang.current].error;
        playNext();
    };

    window.onkeydown = (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowLeft') playPrevious();
      if (e.code === 'ArrowRight') playNext();
    };

    window.onload = () => { 
      Visuals.initFloatingBg(); 
      
      // 1. 語言初始化
      const savedLang = localStorage.getItem('preferred-lang');
      if (savedLang) Lang.current = savedLang;
      applyLanguage();

      // 2. 音量初始化 (解決播放按鍵沒聲音問題)
      const savedVol = localStorage.getItem('preferred-volume');
      if (savedVol !== null) {
        volSlider.value = savedVol;
        audioPlayer.volume = parseFloat(savedVol);
      } else {
        audioPlayer.volume = parseFloat(volSlider.value);
      }
      updateVolumeIcon(audioPlayer.volume);

      // 3. 其他初始化
      buildList();
      playerMain.classList.add('paused'); 
      const savedTheme = localStorage.getItem('preferred-theme');
      if (savedTheme) setTheme(savedTheme);
      const savedIndex = localStorage.getItem('last-song-index');
      if (savedIndex !== null) {
        Player.index = parseInt(savedIndex);
        songTitleText.innerText = Lang.convertText(Player.playlist[Player.index]?.title || "準備播放...");
        updateActiveSongUI();
      }
    };
  </script>
