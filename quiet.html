      { "title": "靜靜在夏天-Lydia", "src": "http://chi.xo.je/MUSIC/靜靜在夏天-Lydia.flac" },

      { "title": "靜靜在夏天-阿刁(新舊混合最終版)", "src": "http://chi.xo.je/MUSIC/靜靜在夏天-阿刁(新舊混合最終版).flac" },
      { "title": "靜靜在夏天-阿刁", "src": "http://chi.xo.je/MUSIC/靜靜在夏天-阿刁.flac" },

      { "title": "靜靜在夏天-靜靜的", "src": "http://chi.xo.je/MUSIC/靜靜在夏天-靜靜的.flac" },
      { "title": "靜靜在夏天_百年孤寂", "src": "http://chi.xo.je/MUSIC/靜靜在夏天_百年孤寂.flac" }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('song-list');
    const currentSongText = document.getElementById('current-song');

    function setPlaybackMode(mode, element) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    function startTitleScroll(songName) {
      if (titleInterval) clearInterval(titleInterval);
      let titleText = ` 🎵 正在播放：${songName} 🍔🎤 `;
      document.title = titleText;
      titleInterval = setInterval(() => {
        titleText = titleText.substring(1) + titleText[0];
        document.title = titleText;
      }, 300);
    }

    async function updateFileSize(url, element) {
      try {
        const response = await fetch(url, { method: 'HEAD' });
        const contentLength = response.headers.get('content-length');
        if (contentLength) {
          const sizeInMB = (parseInt(contentLength) / (1024 * 1024)).toFixed(2);
          element.innerText = sizeInMB + " MB";
        } else {
          element.innerText = "未知";
        }
      } catch (e) {
        element.innerText = "未知";
      }
    }

    function buildList() {
      playlistContainer.innerHTML = '';
      playlist.forEach((song, index) => {
        const div = document.createElement('div');
        div.className = 'song-item';
        
        // --- 邏輯：根據檔案副檔名增加標記 ---
        let displayTitle = song.title;
        const urlLower = song.src.toLowerCase();
        if (urlLower.endsWith('.flac')) {
          displayTitle += " (flac)";
        } else if (urlLower.endsWith('.mp3')) {
          displayTitle += " (MP3)";
        }
        
        const nameSpan = document.createElement('span');
        nameSpan.innerText = `${index + 1}. ${displayTitle}`;
        
        const sizeSpan = document.createElement('span');
        sizeSpan.className = 'song-size';
        sizeSpan.innerText = "讀取中...";
        
        div.appendChild(nameSpan);
        div.appendChild(sizeSpan);
        div.onclick = () => { playSong(index); };
        playlistContainer.appendChild(div);

        updateFileSize(song.src, sizeSpan);
      });
    }
    buildList();

    function playSong(index) {
        if (index < 0 || index >= playlist.length) return;
        
        currentIndex = index;
        const song = playlist[currentIndex];
        
        audioPlayer.src = song.src;
        audioPlayer.play().catch(e => console.log("播放被攔截:", e));
        
        currentSongText.innerText = "正在播放: " + song.title;
        
        document.querySelectorAll('.song-item').forEach((item, idx) => {
          item.classList.toggle('active', idx === currentIndex);
        });
        
        startTitleScroll(song.title);
    }

    function playNext() {
        if (currentMode === 'loopOne') {
            playSong((currentIndex + 1) % playlist.length);
        } else if (currentMode === 'shuffle') {
            const randomIndex = Math.floor(Math.random() * playlist.length);
            playSong(randomIndex);
        } else {
            playSong((currentIndex + 1) % playlist.length);
        }
    }

    audioPlayer.onended = function() {
        if (currentMode === 'loopOne') {
            audioPlayer.play();
        } else {
            playNext();
        }
    };

    audioPlayer.onerror = function() {
        currentSongText.innerText = "歌曲無法播放，跳轉中...";
        playNext();
    };

    window.onload = () => { Visuals.initFloatingBg(); };
