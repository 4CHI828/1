<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静静在夏天🍔🎤⁰³²⁰</title>
  <style>
    /* --- 主題變數系統 --- */
    :root {
      --main-color: #ffcc66;
      --accent-color: #ff9966;
      --dark-color: #663300;
      --ketchup-red: #ff2b2b;
      --neon-cyan: #00ffff;
      --player-bg: #2b2d31;
      --list-bg: #232428;
      --bg-color: #fff8f0;
      --transition-speed: 0.4s;
    }

    [data-theme="red"] {
      --main-color: #ff8a8a; --accent-color: #ff4d4d; --dark-color: #800000; --bg-color: #fff0f0;
    }
    [data-theme="green"] {
      --main-color: #c2f0c2; --accent-color: #7ecb7e; --dark-color: #2d5a27; --bg-color: #f0fff0;
    }
    [data-theme="brown"] {
      --main-color: #d2b48c; --accent-color: #8b4513; --dark-color: #3e2723; --bg-color: #fdf5e6;
    }

    body {
      background: var(--bg-color) url('burger-bg.png') repeat;
      font-family: "Microsoft JhengHei", sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px; 
      border: 15px solid var(--main-color); 
      border-radius: 40px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
      position: relative;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-x: hidden;
      transition: background var(--transition-speed), border-color var(--transition-speed);
    }

    /* --- 飄浮背景優化 --- */
    .floating-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .floating-item {
      position: absolute;
      bottom: -50px;
      font-size: 24px;
      user-select: none;
      will-change: transform, opacity; /* GPU 加速 */
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .sesame { position: absolute; width: 8px; height: 5px; background: #fff; border-radius: 50%; box-shadow: 2px 2px 3px rgba(0,0,0,0.1); }
    .sesame:nth-child(1) { top: 15px; left: 40px; }
    .sesame:nth-child(2) { top: 25px; right: 60px; }
    .sesame:nth-child(3) { bottom: 20px; left: 80px; }
    .sesame:nth-child(4) { bottom: 30px; right: 100px; }
    .sesame:nth-child(5) { top: 50%; left: 10px; }
    .sesame:nth-child(6) { top: 50%; right: 20px; }

    h1 { color: var(--accent-color); font-size: 24px; margin-bottom: 10px; text-shadow: 2px 2px #fff; position: relative; display: inline-block; transition: color var(--transition-speed); }
    .ketchup { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 80px; height: 8px; background: var(--ketchup-red); border-radius: 4px; animation: drip 2s infinite; }
    @keyframes drip { 0%, 100% { height: 8px; } 50% { height: 25px; } }

    .btn-group { margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn { display: inline-block; padding: 10px 15px; background-color: var(--main-color); border: 3px solid var(--accent-color); border-radius: 20px; font-size: 14px; font-weight: bold; color: var(--dark-color); text-decoration: none; box-shadow: 3px 3px 8px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; }
    .btn:hover { background-color: #fff; transform: scale(1.05); }

    .theme-group { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .theme-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.2); transition: transform 0.2s; }
    .theme-dot:hover { transform: scale(1.2); }
    .dot-yellow { background-color: #ffcc66; }
    .dot-red { background-color: #ff8a8a; }
    .dot-green { background-color: #c2f0c2; }
    .dot-brown { background-color: #d2b48c; }

    .player-container {
      background-color: var(--player-bg);
      border-radius: 24px;
      padding: 25px;
      width: 90%; 
      max-width: 400px; 
      margin: 20px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--neon-cyan);
      color: white;
      border: 2px solid #444;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .now-playing-title {
      font-size: 16px;
      color: var(--main-color);
      margin-bottom: 15px;
      font-weight: bold;
      height: 24px;
      white-space: nowrap;
      overflow: hidden; 
      position: relative;
      border-bottom: 1px solid #444; 
      padding-bottom: 5px;
      transition: color var(--transition-speed);
    }
    .marquee {
      display: inline-block;
      padding-left: 100%; 
      animation: marquee 12s linear infinite; 
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .progress-container { background: #444; height: 8px; width: 100%; border-radius: 10px; margin: 20px 0; cursor: pointer; position: relative; }
    .progress-bar { background: var(--neon-cyan); height: 100%; width: 0%; border-radius: 10px; transition: width 0.1s linear; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 20px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
    .ctrl-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; transition: 0.2s; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:hover { color: var(--neon-cyan); transform: scale(1.1); }
    .play-pause-btn { background: var(--neon-cyan); color: black; font-size: 30px; width: 60px; height: 60px; }

    .audio-settings {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 25px;
      padding: 15px;
      background: #3e4045;
      border-radius: 15px;
      flex-wrap: wrap;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 80px;
    }
    .setting-group label {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 5px;
    }
    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      background: #555;
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--neon-cyan);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 5px var(--neon-cyan);
    }

    .mode-toggle { 
      font-size: 11px; 
      background: #555; 
      color: #ccc; 
      border: 1px solid #777; 
      padding: 4px 8px; 
      border-radius: 10px; 
      cursor: pointer; 
      width: 100%; 
      max-width: 100px;
      transition: 0.2s;
    }
    .mode-toggle:hover { background: #666; color: white; border-color: var(--neon-cyan); }

    .song-list-wrapper {
      margin-top: 20px;
      background: var(--list-bg);
      border-radius: 15px;
      padding: 10px;
      border: 1px solid #444;
    }
    .song-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
      max-height: 300px;
      overflow-y: auto;
    }
    .song-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 4px;
      transition: 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item:hover { background: #3e4045; color: white; }
    .song-item.active { 
      background: #444; 
      color: var(--neon-cyan); 
      font-weight: bold; 
      border-left: 4px solid var(--neon-cyan); 
      animation: pulse 2s infinite; 
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
    .page-btn {
      background: #3e4045;
      color: #ccc;
      border: 1px solid #555;
      padding: 3px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #aaa;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .footer:hover { opacity: 1; }
    .footer a { color: #aaa; text-decoration: none; transition: color 0.3s; }
    .footer a:hover { color: #888; text-decoration: underline; }
  </style>
</head>
<body id="bodyTag">
  <div class="floating-bg" id="floatingBg"></div>

  <div class="sesame"></div><div class="sesame"></div><div class="sesame"></div>
  <div class="sesame"></div><div class="sesame"></div><div class="sesame"></div>

  <h1>静静在夏天🍔🎤⁰³²⁰<div class="ketchup"></div></h1>

  <div class="theme-group">
    <div class="theme-dot dot-yellow" onclick="setTheme('yellow')" title="經典黃"></div>
    <div class="theme-dot dot-red" onclick="setTheme('red')" title="番茄紅"></div>
    <div class="theme-dot dot-green" onclick="setTheme('green')" title="萵苣綠"></div>
    <div class="theme-dot dot-brown" onclick="setTheme('brown')" title="巧克力褐"></div>
  </div>

  <div class="btn-group">
    <a class="btn" href="https://discord.com/channels/865334403864461373/1467603376144646319" target="_blank" rel="noopener noreferrer"><span class="burger-icon">🍔</span> DC靜靜幫</a>
    <a class="btn" href="https://v.douyin.com/_Zfxey53n7I/" target="_blank" rel="noopener noreferrer"><span class="burger-icon">🍔</span> 抖音</a>
    <a class="btn" href="https://www.youtube.com/playlist?list=PL3LHSN24syoOcIqA8nRwfYgAOoR5U27_U" target="_blank" rel="noopener noreferrer"><span class="burger-icon">🍔</span> YT</a>
    <a class="btn" href="https://www.twitch.tv/jingjingzaixiatian" target="_blank" rel="noopener noreferrer"><span class="burger-icon">🍔</span> 圖奇</a>
    <a class="btn" href="https://www.instagram.com/jingjing24739233910/" target="_blank" rel="noopener noreferrer"><span class="burger-icon">🍔</span> IG</a>
    <a class="btn" href="0320.html"><span class="burger-icon">🍔</span> 歌單</a>
  </div>

  <div class="player-container">
    <div id="songTitle" class="now-playing-title">🎶 正在載入歌單...</div>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="ctrl-btn play-pause-btn" id="playPauseBtn">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
    </div>

    <div class="audio-settings">
      <div class="setting-group">
        <label>音量 <span id="volVal">50%</span></label>
        <input type="range" id="volSlider" class="slider" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="setting-group">
        <label>播放模式</label>
        <button id="modeToggle" class="mode-toggle">順序播放</button>
      </div>
    </div>

    <div class="song-list-wrapper">
      <div id="songList" class="song-list"></div>
      <div class="pagination">
        <button class="page-btn" id="prevPage">◀ 上一頁</button>
        <span id="pageInfo">第 1 / 1 頁</span>
        <button class="page-btn" id="nextPage">下一頁 ▶</button>
      </div>
    </div>
  </div>

  <div class="footer">
     <a href="https://www.twitch.tv/chi828" target="_blank" rel="noopener noreferrer">新竹奇奇828製作</a>
  </div>

  <audio id="audioElement"></audio>

  <script>
    /**
     * 漢堡主題與背景邏輯 (獨立於播放器)
     */
    const Visuals = {
      setTheme(theme) {
        document.body.setAttribute('data-theme', theme === 'yellow' ? '' : theme);
      },
      initFloatingBg() {
        const bg = document.getElementById('floatingBg');
        const items = ['🍔', '🎤', '🎶', '✨', '🍔'];
        setInterval(() => {
          const item = document.createElement('div');
          item.className = 'floating-item';
          item.textContent = items[Math.floor(Math.random() * items.length)];
          item.style.left = Math.random() * 100 + 'vw';
          item.style.fontSize = (Math.random() * 20 + 15) + 'px';
          item.style.animationDuration = (Math.random() * 9 + 6) + 's';
          item.style.opacity = Math.random() * 0.5 + 0.3;
          bg.appendChild(item);
          setTimeout(() => item.remove(), 15000);
        }, 800);
      }
    };

    // 全域主題切換函數
    window.setTheme = (t) => Visuals.setTheme(t);

    /**
     * 核心播放器模組
     */
    const Player = {
      state: {
        songs: [],
        currentIndex: 0,
        currentPage: 0,
        currentModeIndex: 0,
        songsPerPage: 10,
        modes: ["順序播放", "隨機播放", "單曲循環", "歌單循環"],
        titleInterval: null
      },

      dom: {},

      init() {
        // 緩存所有 DOM 元素
        this.dom = {
          audio: document.getElementById('audioElement'),
          playBtn: document.getElementById('playPauseBtn'),
          title: document.getElementById('songTitle'),
          progressBar: document.getElementById('progressBar'),
          progressContainer: document.getElementById('progressContainer'),
          currentTime: document.getElementById('currentTime'),
          durationTime: document.getElementById('durationTime'),
          list: document.getElementById('songList'),
          pageInfo: document.getElementById('pageInfo'),
          volSlider: document.getElementById('volSlider'),
          volVal: document.getElementById('volVal'),
          modeBtn: document.getElementById('modeToggle'),
          prevBtn: document.getElementById('prevBtn'),
          nextBtn: document.getElementById('nextBtn'),
          prevPage: document.getElementById('prevPage'),
          nextPage: document.getElementById('nextPage')
        };

        this.dom.audio.volume = 0.5;
        this.bindEvents();
        this.loadPlaylist();
      },

      bindEvents() {
        this.dom.playBtn.onclick = () => this.togglePlay();
        this.dom.nextBtn.onclick = () => this.nextSong();
        this.dom.prevBtn.onclick = () => this.prevSong();
        this.dom.volSlider.oninput = (e) => this.updateVolume(e.target.value);
        this.dom.modeBtn.onclick = () => this.cycleMode();
        this.dom.prevPage.onclick = () => this.changePage(-1);
        this.dom.nextPage.onclick = () => this.changePage(1);
        
        this.dom.progressContainer.onclick = (e) => {
          const percent = e.offsetX / this.dom.progressContainer.clientWidth;
          this.dom.audio.currentTime = percent * this.dom.audio.duration;
        };

        this.dom.audio.ontimeupdate = () => this.updateProgress();
        this.dom.audio.onended = () => this.nextSong();
        this.dom.audio.onerror = () => {
          console.error("Audio Error", this.dom.audio.src);
          this.nextSong();
        };
      },

      async loadPlaylist() {
        try {
          const response = await fetch('songs.json');
          if (!response.ok) throw new Error('JSON load failed');
          this.state.songs = await response.json();
          if (this.state.songs.length === 0) throw new Error('Empty playlist');
          this.loadSong(0, false);
          this.renderList();
        } catch (e) {
          console.error(e);
          this.dom.title.textContent = "❌ 找不到歌曲列表 (songs.json)";
        }
      },

      async loadSong(index, shouldPlay = true) {
        this.state.currentIndex = index;
        const song = this.state.songs[index];
        if (!song) return;

        this.dom.audio.src = song.src;
        
        // 更新標題
        const titleText = `🎶 正在播放：${song.title} &nbsp;&nbsp;&nbsp;&nbsp;`;
        this.dom.title.innerHTML = `<span class="marquee">${titleText}</span>`;
        this.startTabScroll(song.title);

        if (shouldPlay) {
          try {
            await this.dom.audio.play();
            this.dom.playBtn.textContent = "⏸";
          } catch (e) {
            console.warn("Autoplay blocked");
          }
        }
        this.renderList();
      },

      togglePlay() {
        if (this.dom.audio.paused) {
          this.dom.audio.play().catch(console.error);
          this.dom.playBtn.textContent = "⏸";
        } else {
          this.dom.audio.pause();
          this.dom.playBtn.textContent = "▶";
        }
      },

      nextSong() {
        const mode = this.state.modes[this.state.currentModeIndex];
        const total = this.state.songs.length;

        if (mode === "單曲循環") {
          // 不變
        } else if (mode === "隨機播放") {
          this.state.currentIndex = Math.floor(Math.random() * total);
        } else if (mode === "歌單循環") {
          this.state.currentIndex = (this.state.currentIndex + 1) % total;
        } else { // 順序播放
          this.state.currentIndex++;
          if (this.state.currentIndex >= total) {
            this.dom.audio.pause();
            this.dom.playBtn.textContent = "▶";
            return;
          }
        }
        this.loadSong(this.state.currentIndex, true);
        this.state.currentPage = Math.floor(this.state.currentIndex / this.state.songsPerPage);
        this.renderList();
      },

      prevSong() {
        this.state.currentIndex = (this.state.currentIndex - 1 + this.state.songs.length) % this.state.songs.length;
        this.loadSong(this.state.currentIndex, true);
        this.state.currentPage = Math.floor(this.state.currentIndex / this.state.songsPerPage);
        this.renderList();
      },

      updateVolume(val) {
        this.dom.audio.volume = val;
        this.dom.volVal.textContent = Math.round(val * 100) + "%";
      },

      cycleMode() {
        this.state.currentModeIndex = (this.state.currentModeIndex + 1) % this.state.modes.length;
        this.dom.modeBtn.textContent = this.state.modes[this.state.currentModeIndex];
      },

      updateProgress() {
        const { currentTime, duration } = this.dom.audio;
        const percent = (currentTime / duration) * 100;
        this.dom.progressBar.style.width = percent + "%";
        this.dom.currentTime.textContent = this.formatTime(currentTime);
        this.dom.durationTime.textContent = this.formatTime(duration);
      },

      formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      changePage(delta) {
        this.state.currentPage += delta;
        this.renderList();
      },

      renderList() {
        const { songs, currentPage, songsPerPage, currentIndex } = this.state;
        this.dom.list.innerHTML = "";
        
        const start = currentPage * songsPerPage;
        const end = Math.min(start + songsPerPage, songs.length);

        for (let i = start; i < end; i++) {
          const item = document.createElement('div');
          item.className = `song-item ${i === currentIndex ? 'active' : ''}`;
          item.textContent = `${i + 1}. ${songs[i].title}`;
          item.onclick = () => this.loadSong(i, true);
          this.dom.list.appendChild(item);
        }

        const totalPages = Math.ceil(songs.length / songsPerPage);
        this.dom.pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 頁`;
        this.dom.prevPage.disabled = (currentPage === 0);
        this.dom.nextPage.disabled = (currentPage >= totalPages - 1);
      },

      startTabScroll(name) {
        if (this.state.titleInterval) clearInterval(this.state.titleInterval);
        let text = ` 🎶 正在播放：${name} 🎶   `;
        document.title = text;
        this.state.titleInterval = setInterval(() => {
          text = text.substring(1) + text.substring(0, 1);
          document.title = text;
        }, 300);
      }
    };

    // 啟動所有模組
    window.onload = () => {
      Visuals.initFloatingBg();
      Player.init();
    };
  </script>
</body>
</html>
