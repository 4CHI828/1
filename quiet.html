  <style>
    /* --- 主題變數系統 --- */
    :root {
      --main-color: #ffcc66;
      --accent-color: #ff9966;
      --dark-color: #663300;
      --ketchup-red: #ff2b2b;
      --neon-cyan: #00ffff;
      --player-bg: rgba(43, 45, 49, 0.8);
      --list-bg: rgba(35, 36, 40, 0.9);
      --bg-color: #fff8f0;
      --transition-speed: 0.4s;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    [data-theme="red"] { --main-color: #ff8a8a; --accent-color: #ff4d4d; --dark-color: #800000; --bg-color: #fff0f0; }
    [data-theme="green"] { --main-color: #c2f0c2; --accent-color: #7ecb7e; --dark-color: #2d5a27; --bg-color: #f0fff0; }
    [data-theme="brown"] { --main-color: #d2b48c; --accent-color: #8b4513; --dark-color: #3e2723; --bg-color: #fdf5e6; }

    body {
      background: var(--bg-color) url('burger-bg.png') repeat;
      font-family: "Microsoft JhengHei", sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px; 
      border: 15px solid var(--main-color); 
      border-radius: 40px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
      position: relative;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-x: hidden;
      transition: background var(--transition-speed), border-color var(--transition-speed);
    }

    .floating-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
    .floating-item { position: absolute; bottom: -50px; font-size: 24px; user-select: none; will-change: transform, opacity; animation: floatUp linear infinite; }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

    h1 { color: var(--accent-color); font-size: 24px; margin-bottom: 10px; text-shadow: 2px 2px #fff; position: relative; display: inline-block; transition: color var(--transition-speed); }
    .ketchup { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 80px; height: 8px; background: var(--ketchup-red); border-radius: 4px; animation: drip 2s infinite; }

    .btn-group { margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn { display: inline-block; padding: 10px 15px; background-color: var(--main-color); border: 3px solid var(--accent-color); border-radius: 20px; font-size: 14px; font-weight: bold; color: var(--dark-color); text-decoration: none; box-shadow: 3px 3px 8px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; }

    .theme-group { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .theme-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.2); transition: transform 0.2s; }
    .theme-dot:hover { transform: scale(1.2); }
    .dot-yellow { background-color: #ffcc66; } .dot-red { background-color: #ff8a8a; } .dot-green { background-color: #c2f0c2; } .dot-brown { background-color: #d2b48c; }

    .player-container {
      background: var(--player-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 32px;
      padding: 30px;
      width: 90%; 
      max-width: 400px; 
      margin: 20px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 20px var(--neon-cyan);
      color: white;
      border: 1px solid var(--glass-border);
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 20px;
      font-size: 17px;
      color: var(--main-color);
      font-weight: bold;
      height: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .audio-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 20px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      gap: 10px;
    }
    .control-row label { width: 80px; }
    .control-row input[type="range"] {
      flex: 1;
      cursor: pointer;
      accent-color: var(--neon-cyan);
    }
    .value-display { width: 40px; text-align: right; font-family: monospace; }

    audio {
      width: 100%;
      margin-bottom: 20px;
      filter: invert(100%) hue-rotate(180deg) brightness(1.5);
    }

    .loop-mode-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 5px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.3s;
    }
    .loop-mode-btn:hover { background: var(--neon-cyan); color: #000; }

    .song-list-wrapper { 
      background: var(--list-bg); 
      border-radius: 20px; 
      padding: 12px; 
      border: 1px solid rgba(255,255,255,0.05); 
    }
    .song-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
      max-height: 280px;
      overflow-y: auto;
    }
    .song-list::-webkit-scrollbar { width: 6px; }
    .song-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
    .song-list::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

    .song-item { 
      padding: 10px 15px; 
      font-size: 13px; 
      color: #aaa; 
      cursor: pointer; 
      border-radius: 10px; 
      margin-bottom: 5px; 
      transition: 0.2s; 
    }
    .song-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .song-item.active { 
      background: rgba(0, 255, 255, 0.1); 
      color: var(--neon-cyan); 
      font-weight: bold; 
      border-left: 4px solid var(--neon-cyan); 
    }

    .footer { margin-top: 40px; font-size: 13px; color: #aaa; opacity: 0.7; transition: opacity 0.3s; }
    .footer:hover { opacity: 1; }
    .footer a { color: #aaa; text-decoration: none; transition: color 0.3s; }
    .footer a:hover { color: #888; text-decoration: underline; }
  </style>

  <script>

        setInterval(() => {

          item.textContent = items[Math.floor(Math.random() * items.length)];
          item.style.left = Math.random() * 100 + 'vw';
          item.style.fontSize = (Math.random() * 20 + 15) + 'px';
          item.style.animationDuration = (Math.random() * 9 + 6) + 's';
          item.style.opacity = Math.random() * 0.5 + 0.3;
          bg.appendChild(item);
          setTimeout(() => item.remove(), 15000);
        }, 800);
      }
    };
    window.setTheme = (t) => Visuals.setTheme(t);

    const originalUrls = [

        "https://mp3.chi828.workers.dev/靜靜在夏天-阿刁.mp3",

        "https://mp3.chi828.workers.dev/靜靜在夏天-突然好想你.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-要愛愛.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-時間都去哪兒了.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-唯一.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-盛夏光年.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-連名帶姓.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-給你一點顏色.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-給我一個理由忘記.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-愛人錯過.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-會呼吸的痛.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-靜靜的.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-離歌.mp3",
        "https://mp3.chi828.workers.dev/靜靜在夏天-寵愛.mp3",
        "https://mp3.chi828.workers.dev/芹靜歌_日不落_對唱版0.3.mp3"
    ];

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('song-list');
    const currentSongText = document.getElementById('current-song');
    const volSlider = document.getElementById('vol-slider');
    const volVal = document.getElementById('vol-val');
    const gainSlider = document.getElementById('gain-slider');
    const gainVal = document.getElementById('gain-val');
    const loopBtn = document.getElementById('loop-btn');

    // --- 播放模式邏輯 ---
    let playMode = 0; 
    const modeText = ["順序播放 ⏭️", "單曲循環 🔁", "列表循環 🔄"];

    loopBtn.onclick = () => {
        playMode = (playMode + 1) % 3;
        loopBtn.innerText = modeText[playMode];
    };

    // --- Web Audio API 增益設定 ---
    let audioCtx;
    let gainNode;
    let sourceNode;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            sourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }
    }

    // 預設音量 50%
    audioPlayer.volume = 0.5;

    volSlider.oninput = () => {
        const v = parseFloat(volSlider.value);
        audioPlayer.volume = v;
        volVal.innerText = Math.round(v * 100) + "%";
    };

    gainSlider.oninput = () => {
        const g = parseFloat(gainSlider.value);
        gainVal.innerText = g.toFixed(1) + "x";
        if (gainNode) gainNode.gain.value = g;
    };

    function getSongName(url) {
        return url.split('/').pop().replace('.mp3', '');
    }

    // --- 直接使用原始列表，不進行篩選排序 ---
    originalUrls.forEach((url, index) => {
        const name = getSongName(url);
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerText = `${index + 1}. ${name}`; 
        div.onclick = () => {
            playSong(url, name, div);
        };
        playlistContainer.appendChild(div);
    });

    function playSong(url, name, element) {
        initAudioContext();
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        audioPlayer.src = url;
        audioPlayer.play();
        currentSongText.innerText = "正在播放: " + name;
        document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
    }

    audioPlayer.onended = function() {
        const activeItem = document.querySelector('.song-item.active');
        if (playMode === 1) { 
            activeItem.click();
        } else if (playMode === 0 || playMode === 2) {
            if (activeItem && activeItem.nextElementSibling) {
                activeItem.nextElementSibling.click();
            } else if (playMode === 2) {
                document.querySelector('.song-item').click();
            }
        }
    };

    window.onload = () => {
      Visuals.initFloatingBg();
    };
  </script>
</body>
