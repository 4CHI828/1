<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静静在夏天🍔🎤⁰³²⁰</title>
  <style>
    /* --- 主題變數系統 --- */
    :root {
      --main-color: #ffcc66;
      --accent-color: #ff9966;
      --dark-color: #663300;
      --ketchup-red: #ff2b2b;
      --neon-cyan: #00ffff;
      --player-bg: rgba(43, 45, 49, 0.8);
      --list-bg: rgba(35, 36, 40, 0.9);
      --bg-color: #fff8f0;
      --transition-speed: 0.4s;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    [data-theme="red"] { --main-color: #ff8a8a; --accent-color: #ff4d4d; --dark-color: #800000; --bg-color: #fff0f0; }
    [data-theme="green"] { --main-color: #c2f0c2; --accent-color: #7ecb7e; --dark-color: #2d5a27; --bg-color: #f0fff0; }
    [data-theme="brown"] { --main-color: #d2b48c; --accent-color: #8b4513; --dark-color: #3e2723; --bg-color: #fdf5e6; }

    body {
      background: var(--bg-color) url('burger-bg.png') repeat;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px; 
      border: 15px solid var(--main-color); 
      border-radius: 40px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
      position: relative;
      min-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-x: hidden;
      transition: background var(--transition-speed), border-color var(--transition-speed);
    }

    .floating-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
    .floating-item { position: absolute; bottom: -50px; font-size: 24px; user-select: none; will-change: transform, opacity; animation: floatUp linear infinite; }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

    h1 { color: var(--accent-color); font-size: 24px; margin-bottom: 10px; text-shadow: 2px 2px #fff; position: relative; display: inline-block; transition: color var(--transition-speed); }
    .ketchup { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 80px; height: 8px; background: var(--ketchup-red); border-radius: 4px; animation: drip 2s infinite; }
    @keyframes drip { 0%, 100% { height: 8px; } 50% { height: 25px; } }

    .btn-group { margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn { display: inline-block; padding: 10px 15px; background-color: var(--main-color); border: 3px solid var(--accent-color); border-radius: 20px; font-size: 14px; font-weight: bold; color: var(--dark-color); text-decoration: none; box-shadow: 3px 3px 8px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; }
    .btn:hover { background-color: #fff; transform: scale(1.05); }

    .theme-group { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .theme-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.2); transition: transform 0.2s; }
    .theme-dot:hover { transform: scale(1.2); }
    .dot-yellow { background-color: #ffcc66; } .dot-red { background-color: #ff8a8a; } .dot-green { background-color: #c2f0c2; } .dot-brown { background-color: #d2b48c; }

    .player-container {
      background: var(--player-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 32px;
      padding: 30px;
      width: 90%; 
      max-width: 400px; 
      margin: 20px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 20px var(--neon-cyan);
      color: white;
      border: 1px solid var(--glass-border);
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 20px;
      font-size: 17px;
      color: var(--main-color);
      font-weight: bold;
      height: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
      filter: invert(100%) hue-rotate(180deg) brightness(1.5);
    }

    .song-list-wrapper { 
      background: var(--list-bg); 
      border-radius: 20px; 
      padding: 12px; 
      border: 1px solid rgba(255,255,255,0.05); 
    }
    .song-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
      max-height: 280px;
      overflow-y: auto;
    }
    .song-list::-webkit-scrollbar { width: 6px; }
    .song-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
    .song-list::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

    .song-item { 
      padding: 10px 15px; 
      font-size: 13px; 
      color: #aaa; 
      cursor: pointer; 
      border-radius: 10px; 
      margin-bottom: 5px; 
      transition: 0.2s; 
    }
    .song-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .song-item.active { 
      background: rgba(0, 255, 255, 0.1); 
      color: var(--neon-cyan); 
      font-weight: bold; 
      border-left: 4px solid var(--neon-cyan); 
    }

    .footer { margin-top: 40px; font-size: 13px; color: #aaa; opacity: 0.7; transition: opacity 0.3s; }
    .footer:hover { opacity: 1; }
    .footer a { color: #aaa; text-decoration: none; transition: color 0.3s; }
    .footer a:hover { color: #888; text-decoration: underline; }
  </style>
</head>
<body id="bodyTag">

     <a href="https://www.twitch.tv/chi828" target="_blank" rel="noopener noreferrer">新竹奇奇828製作</a>
  </div>

  <script>
    /**
     * 視覺效果
     */
    const Visuals = {
      setTheme(theme) {
        document.body.setAttribute('data-theme', theme === 'yellow' ? '' : theme);
      },
      initFloatingBg() {
        const bg = document.getElementById('floatingBg');
        const items = ['🍟', '🌭','🍔', '🎤', '🎶', '✨', '🍔'];
        setInterval(() => {
          const item = document.createElement('div');
          item.className = 'floating-item';
          item.textContent = items[Math.floor(Math.random() * items.length)];
          item.style.left = Math.random() * 100 + 'vw';
          item.style.fontSize = (Math.random() * 20 + 15) + 'px';
          item.style.animationDuration = (Math.random() * 9 + 6) + 's';
          item.style.opacity = Math.random() * 0.5 + 0.3;
          bg.appendChild(item);
          setTimeout(() => item.remove(), 15000);
        }, 800);
      }
    };
    window.setTheme = (t) => Visuals.setTheme(t);

    /**
     * 播放器邏輯
     */
    const playlist = [
      { "title": "靜靜在夏天(圖奇) 靜靜的", "src": "https://cdn.whyp.it/c21f9f21-d49e-4040-a18e-24129069685b.mp3?token=njSpOZg9Ixz37KbzLSQ5peycVLfqtFBC8izo_4fT_JY&expires=1780227230" },
      { "title": "靜靜在夏天(圖奇) Opera #2", "src": "https://cdn.whyp.it/f1d7213c-149c-4090-a95d-b0ddcbd3152b.mp3?token=NFfpFo3_UZvPyRtWPiiastH6DDus47ukj53_j6P796M&expires=1780227183" },
      { "title": "靜靜在夏天 (圖奇) 悟空", "src": "https://cdn.whyp.it/32f452c3-04db-4ace-8f66-4a14eae9a085.mp3?token=c21cqbaa0WaTxvAjTtCwVWALgKFpSbrI8sN5-A7q37s&expires=1780227272" },
      { "title": "靜靜在夏天(圖奇) 武家坡", "src": "https://cdn.whyp.it/f479e41f-d0db-4ce0-8576-be3f4529e0c3.mp3?token=OjrjYLFJN4Dmyw3MDCG6wHBr9_a6qAxu90vij5N6SVU&expires=1780226918" },
      { "title": "靜靜在夏天 煙火裡的塵埃", "src": "https://cdn.whyp.it/e9f1fa37-8713-42ca-981f-868e75a28ede.mp3?token=HBg0_7iVzggnKrV0XYkUSmAUN7WYiJOQ8H8Prsp5LEA&expires=1780294845" },
      { "title": "靜靜在夏天(圖奇)-天黑黑", "src": "https://cdn.whyp.it/7320956d-2daf-4a07-a7db-ea6d138cbcec.mp3?token=N6GZqrZh9DzaSPDlR3wZZhp1QqbOzxU7pBVazFJr_-0&expires=1780254643" },
      { "title": "靜靜在夏天(圖奇)-如願", "src": "https://cdn.whyp.it/58333d83-45e3-49a0-b97a-e101892624c0.mp3?token=7eeq7hhWpkw1l1MXH__813NA-Tz14YBNma0_AmjEeP4&expires=1780254825" },
      { "title": "靜靜在夏天(圖奇)-我好想你", "src": "https://cdn.whyp.it/9a88e7e2-42fe-4969-9113-a7945ca7ec1d.mp3?token=s85WwD-XALYDCn1st0mkHaqZeWBlVIW-uoBiap6QQqo&expires=1780255109" },
      { "title": "靜靜在夏天(圖奇)-安和橋", "src": "https://cdn.whyp.it/a3959afd-8dc7-49bb-86a5-af7fb1369d82.mp3?token=GMgE9X1DijX-eoQFUZ8RFYahH15Ms9Z92aBwbE4runQ&expires=1780255791" },
      { "title": "靜靜在夏天(圖奇)-克卜勒", "src": "https://cdn.whyp.it/60250fc7-ad54-4172-944f-88a728f63715.mp3?token=GK5Ze2JOeSUfc5KLOXUv8QK4y5DqmxE73ranYeX2ufA&expires=1780255851" },
      { "title": "靜靜在夏天-左手指月", "src": "https://cdn.whyp.it/74ecaaf3-5ef0-4041-bb98-141056baf693.mp3?token=SPU_g2uPtKPIbU0ur70ubqFDDQ8aPbjG8crc2xN3qxw&expires=1780294976" },
      { "title": "靜靜在夏天-Rolling in the deep", "src": "https://cdn.whyp.it/9b9a3d6d-9316-4ad3-8904-ab1b3e24d041.mp3?token=jLY4bs6YySo5TvibpCKaluorEI2SxHgIbEM9d6zaY6k&expires=1780295036" },
      { "title": "靜靜在夏天-空心", "src": "https://cdn.whyp.it/092df4ca-da3b-458a-bbe6-1dd9e3a92c59.mp3?token=54L953PLSppt_J91TUbsK2NCw2HDqkDA_2bEgWOkCtk&expires=1780295115" },
      { "title": "靜靜在夏天-你把我灌醉", "src": "https://cdn.whyp.it/d5d09c05-edf9-4fad-8ea3-9f119653b4ad.mp3?token=iwaNKZiWJhD5BkM-M32jPvFqmN5Tcr4VKPi99G4a-lc&expires=1780295188" }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('song-list');
    const currentSongText = document.getElementById('current-song');

    // 生成列表
    playlist.forEach((song, index) => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerText = `${index + 1}. ${song.title}`; 
        
        div.onclick = () => {
            playSong(song.src, song.title, div);
        };
        playlistContainer.appendChild(div);
    });

    function playSong(url, name, element) {
        audioPlayer.src = url;
        audioPlayer.play();
        currentSongText.innerText = "正在播放: " + name;
        document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
    }

    // 自動播放下一首
    audioPlayer.onended = function() {
        const activeItem = document.querySelector('.song-item.active');
        if (activeItem && activeItem.nextElementSibling) {
            activeItem.nextElementSibling.click();
        }
    };

    window.onload = () => {
      Visuals.initFloatingBg();
    };
  </script>
</body>
