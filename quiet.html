        { "title": "靜靜在夏天-突然好想你", "src": "https://files.catbox.moe/758q11.mp3" },
        { "title": "靜靜在夏天-要愛愛", "src": "https://files.catbox.moe/q6ca3p.mp3" },
        { "title": "靜靜在夏天-時間都去哪了", "src": "https://files.catbox.moe/6wy36v.mp3" },
        { "title": "靜靜在夏天-唯一", "src": "https://files.catbox.moe/wr6uvi.mp3" },
        { "title": "靜靜在夏天-盛夏光年", "src": "https://files.catbox.moe/ihkyf1.mp3" },
        { "title": "靜靜在夏天-連名帶姓", "src": "https://files.catbox.moe/gklzwr.mp3" },
        { "title": "靜靜在夏天-給你一點顏色", "src": "https://files.catbox.moe/tsqobv.mp3" }
      ]
    };

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('song-list');
    const songTitleText = document.getElementById('song-title-text');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playerMain = document.getElementById('player-main');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const progressKnob = document.getElementById('progress-knob');
    const currTimeText = document.getElementById('curr-time');
    const totalTimeText = document.getElementById('total-time');
    const volBtn = document.getElementById('vol-btn');
    const volPanel = document.getElementById('volume-panel');
    const volSlider = document.getElementById('volume-slider');
    const volValueText = document.getElementById('vol-value');

    let isDragging = false;

    function updateMarquee(text) {
      songTitleText.innerText = text;
      songTitleText.classList.remove('animate-marquee');
      setTimeout(() => {
        const containerWidth = document.querySelector('.marquee-container').offsetWidth;
        if (songTitleText.offsetWidth > containerWidth) {
          songTitleText.classList.add('animate-marquee');
        }
      }, 50);
    }

    function setPlaybackMode(mode, element) {
      Player.mode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    function startTitleScroll(songName) {
      if (Player.titleInterval) clearInterval(Player.titleInterval);
      let titleText = ` 🎵 正在播放：${songName} 🍔🎤 `;
      document.title = titleText;
      Player.titleInterval = setInterval(() => {
        titleText = titleText.substring(1) + titleText[0];
        document.title = titleText;
      }, 300);
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function buildList() {
      playlistContainer.innerHTML = '';
      Player.playlist.forEach((song, index) => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.style.animationDelay = `${index * 0.03}s`; 
        div.setAttribute('data-original-title', song.title);
        div.setAttribute('data-index', index);
        const span = document.createElement('span');
        span.className = 'song-name-span';
        div.appendChild(span);
        div.onclick = () => playSong(index);
        playlistContainer.appendChild(div);
      });
      refreshListText();
    }

    function refreshListText() {
      const items = document.querySelectorAll('.song-item');
      items.forEach((item, idx) => {
        const span = item.querySelector('.song-name-span');
        const originalTitle = item.getAttribute('data-original-title');
        const song = Player.playlist[idx];
        const format = song.src.toLowerCase().endsWith('.flac') ? ' (flac)' : ' (MP3)';
        if (idx === Player.index) {
          item.classList.add('active');
          span.innerText = `▶️ ${idx + 1}. ${originalTitle}${format}`;
        } else {
          item.classList.remove('active');
          span.innerText = `${idx + 1}. ${originalTitle}${format}`;
        }
      });
    }

    async function playSong(index) {
        if (index < 0 || index >= Player.playlist.length) return;
        if (Player.index !== -1 && audioPlayer.currentTime > 0) {
            await fadeAudio(0, 0.4); 
        }
        Player.index = index;
        const song = Player.playlist[Player.index];
        audioPlayer.src = song.src;
        audioPlayer.load();
        audioPlayer.play().then(() => {
            fadeAudio(1, 0.6);
        }).catch(e => console.log("Autoplay blocked"));
        updateMarquee(song.title);
        refreshListText();
        const items = document.querySelectorAll('.song-item');
        if (items[Player.index]) items[Player.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        startTitleScroll(song.title);
        localStorage.setItem('last-song-index', index);
    }

    function togglePlay() {
        if (Player.index === -1) { playSong(0); return; }
        initAudioAnalysis();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (audioPlayer.paused) {
            audioPlayer.play();
            fadeAudio(1, 0.3);
        } else {
            fadeAudio(0, 0.3);
            setTimeout(() => { if(audioPlayer.paused) return; audioPlayer.pause(); }, 300);
        }
    }

    function playNext() {
        if (Player.mode === 'loopOne') playSong(Player.index);
        else if (Player.mode === 'shuffle') playSong(Math.floor(Math.random() * Player.playlist.length));
        else playSong((Player.index + 1) % Player.playlist.length);
    }

    function playPrevious() {
        let prevIndex = Player.index - 1;
        if (prevIndex < 0) prevIndex = Player.playlist.length - 1;
        playSong(prevIndex);
    }

    function toggleVolumePanel() { volPanel.classList.toggle('show'); }

    function updateVolumeIcon(val) {
      if (val == 0) volBtn.innerText = "🔇";
      else if (val < 0.3) volBtn.innerText = "🔈";
      else if (val < 0.7) volBtn.innerText = "🔉";
      else volBtn.innerText = "🔊";
      volValueText.innerText = Math.round(val * 100) + "%";
    }

    volSlider.oninput = () => {
      const val = parseFloat(volSlider.value);
      audioPlayer.volume = val;
      updateVolumeIcon(val);
      localStorage.setItem('preferred-volume', val);
    };

    document.addEventListener('click', (e) => {
      if (!volPanel.contains(e.target) && e.target !== volBtn) volPanel.classList.remove('show');
    });

    function handleProgressUpdate() {
      if (isDragging) return;
      const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100 || 0;
      progressFill.style.width = percent + '%';
      progressKnob.style.left = percent + '%';
      currTimeText.innerText = formatTime(audioPlayer.currentTime);
      if (audioPlayer.duration) totalTimeText.innerText = formatTime(audioPlayer.duration);
    }

    function seekToPosition(e) {
      const rect = progressBar.getBoundingClientRect();
      let pos = (e.clientX - rect.left) / rect.width;
      pos = Math.max(0, Math.min(1, pos));
      if (audioPlayer.duration) audioPlayer.currentTime = pos * audioPlayer.duration;
      progressFill.style.width = (pos * 100) + '%';
      progressKnob.style.left = (pos * 100) + '%';
    }

    progressBar.onpointerdown = (e) => { isDragging = true; progressBar.classList.add('dragging'); seekToPosition(e); };
    window.onpointermove = (e) => { if (isDragging) seekToPosition(e); };
    window.onpointerup = () => { isDragging = false; progressBar.classList.remove('dragging'); };

    audioPlayer.ontimeupdate = handleProgressUpdate;

    audioPlayer.onplay = () => {
        playPauseBtn.innerText = "⏸️";
        playPauseBtn.classList.add('playing-btn');
        playerMain.classList.remove('paused');
    };
    audioPlayer.onpause = () => {
        playPauseBtn.innerText = "▶️";
        playPauseBtn.classList.remove('playing-btn');
        playerMain.classList.add('paused');
    };
    audioPlayer.onended = () => {
        if (Player.mode === 'loopOne') playSong(Player.index);
        else playNext();
    };
    audioPlayer.onerror = () => {
        songTitleText.innerText = "歌曲失效，跳轉中...";
        playNext();
    };

    window.onkeydown = (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowLeft') playPrevious();
      if (e.code === 'ArrowRight') playNext();
    };

    window.onload = () => { 
      Visuals.initFloatingBg(); 
      const savedVol = localStorage.getItem('preferred-volume');
      if (savedVol !== null) {
        volSlider.value = savedVol;
        audioPlayer.volume = parseFloat(savedVol);
      } else {
        audioPlayer.volume = parseFloat(volSlider.value);
      }
      updateVolumeIcon(audioPlayer.volume);
      buildList();
      playerMain.classList.add('paused'); 
      const savedTheme = localStorage.getItem('preferred-theme');
      if (savedTheme) setTheme(savedTheme);
      const savedIndex = localStorage.getItem('last-song-index');
      if (savedIndex !== null) {
        Player.index = parseInt(savedIndex);
        updateMarquee(Player.playlist[Player.index]?.title || "準備播放...");
        refreshListText();
      }
    };
  </script>
</body>
</html>
