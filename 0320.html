<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静静在夏天🍔🎤⁰³²⁰的歌單</title>
    <style>
        /* =========================================================================
           1. 設計 Token (Design Tokens)
           ========================================================================= */
        :root {
            --primary: #ff7675; 
            --bg-color: #fffaf0;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-color: #2d3436;
            --accent-grad: linear-gradient(135deg, #ff7675 0%, #fab1a0 100%);
            --border-color: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --highlight: #ffeaa7;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --card-bg: rgba(30, 30, 30, 0.7);
            --text-color: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(45, 45, 45, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.6);
            --highlight: #4b4b4b;
        }

        /* =========================================================================
           2. 全局基礎樣式
           ========================================================================= */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; opacity: 0.5; }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 背景粒子動畫 */
        .particle {
            position: fixed; bottom: -50px; user-select: none; pointer-events: none;
            z-index: -1; animation: floatUp linear forwards; color: var(--primary);
            opacity: 0.3;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* 抽獎紙屑動畫 */
        .confetti {
            position: fixed; width: 10px; height: 10px; z-index: 1001;
            pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

        /* 主容器：玻璃擬態 */
        .container {
            width: 100%; max-width: 850px;
            background: var(--card-bg); padding: 35px;
            border-radius: 40px; backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: var(--shadow);
            text-align: center; position: relative; z-index: 1;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        /* 右上角設定組 */
        .settings-group {
            position: absolute; top: 25px; right: 25px;
            display: flex; gap: 10px; align-items: center;
        }
        
        .theme-toggle {
            cursor: pointer; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            color: var(--text-color); 
            transition: 0.3s ease;
            font-size: 14px;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
        }
        .theme-toggle:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 標題與問候 */
        #greeting {
            font-size: 16px; opacity: 0.8; margin-bottom: 8px; font-weight: 400;
            animation: fadeInDown 0.8s ease;
        }
        h1 { color: var(--primary); font-size: 28px; margin-bottom: 20px; letter-spacing: 1px; font-weight: 800; }
        
        /* 連結按鈕通用樣式 */
        .main-link-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--accent-grad); color: white;
            text-decoration: none; border-radius: 50px;
            font-weight: 600; transition: 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.4);
        }
        .main-link-btn:hover { transform: translateY(-5px) scale(1.05); }

        .douyin-link {
            padding: 14px 32px; margin-bottom: 20px;
            font-size: 18px;
        }

        /* 社交連結群組 */
        .social-links-group {
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            justify-content: center; 
            margin-bottom: 35px;
        }
        .social-btn {
            padding: 10px 20px;
            font-size: 14px;
        }

        /* 控制區域 */
        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .search-box {
            flex: 2; min-width: 200px; padding: 15px 22px;
            border: 2px solid #ffeaa7; border-radius: 30px;
            background: var(--input-bg); color: var(--text-color); outline: none;
            transition: 0.3s ease; font-size: 16px;
        }
        .sort-select {
            padding: 10px 20px; border-radius: 30px;
            border: 2px solid #ffeaa7; background: var(--input-bg);
            color: var(--text-color); outline: none; cursor: pointer;
        }
        .random-btn {
            padding: 0 25px; background: var(--accent-grad);
            color: white; border: none; border-radius: 30px;
            cursor: pointer; font-weight: 600; transition: 0.3s ease;
        }

        /* 分頁標籤 */
        .category-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .tab {
            padding: 8px 16px; background: var(--bg-color); border-radius: 20px;
            cursor: pointer; font-size: 13px; border: 1px solid var(--border-color); 
            color: var(--text-color); transition: 0.3s ease;
        }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.1); }

        /* 表格樣式 */
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: rgba(0,0,0,0.03); text-align: center; padding: 15px; color: #999; font-weight: 500; font-size: 14px; }
        
        tr { animation: rowIn 0.4s ease forwards; opacity: 0; }
        @keyframes rowIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); vertical-align: middle; transition: 0.2s; text-align: center; }
        tr:hover td { background: rgba(255,118,117,0.05); }
        .col-fav { width: 60px; }
        .col-artist { width: 160px; color: #888; font-size: 15px; }
        .col-song { white-space: nowrap; }

        .fav-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #ccc; transition: 0.3s ease; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; }
        .fav-btn.active { color: #ff4757; transform: scale(1.3); }

        .song-link { color: var(--text-color); text-decoration: none; transition: 0.3s ease; display: inline-block; font-weight: 600; font-size: 16px; }
        .song-link:hover { color: var(--primary); transform: scale(1.05); }

        mark { background-color: var(--highlight); color: inherit; border-radius: 3px; padding: 0 2px; }

        /* 抽獎彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(15px);
        }
        .modal-card {
            background: var(--card-bg); padding: 50px; border-radius: 40px;
            text-align: center; animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 350px; width: 85%; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes popUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .random-song { font-size: 28px; font-weight: 800; color: var(--primary); margin: 20px 0; min-height: 40px; }
        .random-artist { font-size: 18px; margin-bottom: 35px; opacity: 0.8; min-height: 25px; }
        
        .modal-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .close-btn {
            background: var(--accent-grad); color: white; border: none;
            padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: 600;
            transition: 0.3s ease; width: 80%;
        }
        .retry-btn {
            background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary);
            padding: 12px 40px; border-radius: 30px; cursor: pointer; font-weight: 600;
            transition: 0.3s ease; width: 80%;
        }
        .retry-btn:hover { background: var(--primary); color: white; }

        #backToTop {
            position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px;
            border-radius: 50%; background: var(--accent-grad); color: white;
            border: none; cursor: pointer; font-size: 22px; display: none;
            align-items: center; justify-content: center; z-index: 99;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s ease;
        }

        .footer-stats {
            font-size: 14px; color: #888; display: flex; align-items: center;
            justify-content: center; gap: 10px; opacity: 0.8; margin-bottom: 30px;
        }
        .visitor-count {
            background: var(--card-bg); padding: 5px 15px; border-radius: 20px;
            border: 1px solid var(--border-color); font-weight: 600; color: var(--primary);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    const State = {
        favorites: JSON.parse(localStorage.getItem('musicFavs')) || [],
        currentArtist: "全部",
        theme: localStorage.getItem('theme') || 'light',
    };

    const musicBody = document.getElementById('musicBody');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const totalCountSpan = document.getElementById('totalCount');
    const categoryTabs = document.getElementById('categoryTabs');
    const modalOverlay = document.getElementById('modalOverlay');
    const backToTopBtn = document.getElementById('backToTop');
    const personalCountSpan = document.getElementById('personalCount');

    /* =========================================================================
       4. 核心功能模組
       ========================================================================= */

    function setGreeting() {
        const hour = new Date().getHours();
        const greetingEl = document.getElementById('greeting');
        let text = (hour < 12) ? UI_TEXT.greetingMorning : (hour < 18) ? UI_TEXT.greetingAfternoon : UI_TEXT.greetingEvening;
        greetingEl.innerText = text;
    }

    function updatePersonalCount() {
        let personalVisits = localStorage.getItem('myPlaylistVisits') || 0;
        personalVisits = parseInt(personalVisits) + 1;
        localStorage.setItem('myPlaylistVisits', personalVisits);
        personalCountSpan.innerText = personalVisits;
    }

    function toggleFavorite(id) {
        if (State.favorites.includes(id)) {
            State.favorites = State.favorites.filter(fid => fid !== id);
        } else {
            State.favorites.push(id);
        }
        localStorage.setItem('musicFavs', JSON.stringify(State.favorites));
        renderTable();
    }

    function generateTabs() {
        const counts = {};
        rawMusicData.forEach(item => { counts[item.artist] = (counts[item.artist] || 0) + 1; });
        const sortedArtists = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const topArtists = sortedArtists.slice(0, 15);
        
        let tabsHTML = `<button class="tab ${State.currentArtist==='全部'?'active':''}" data-artist="全部">${UI_TEXT.allTab}</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='收藏'?'active':''}" data-artist="收藏">${UI_TEXT.favTab}</button>`;
        topArtists.forEach(artist => {
            tabsHTML += `<button class="tab ${State.currentArtist===artist?'active':''}" data-artist="${artist}">${artist}</button>`;
        });
        categoryTabs.innerHTML = tabsHTML;
    }

    function highlight(text, term) {
        if (!term) return text;
        const regex = new RegExp(`(${term})`, 'gi');
        return text.replace(regex, `<mark>$1</mark>`);
    }

    function renderTable() {
        const term = searchInput.value.toLowerCase();
        const sort = sortSelect.value;
        
        let filtered = rawMusicData.filter(item => {
            const matchesSearch = item.artist.toLowerCase().includes(term) || item.song.toLowerCase().includes(term);
            const matchesArtist = (State.currentArtist === "全部") || 
                                  (State.currentArtist === "收藏" ? State.favorites.includes(item.id) : item.artist === State.currentArtist);
            return matchesSearch && matchesArtist;
        });

        if (sort === 'song') filtered.sort((a, b) => a.song.localeCompare(b.song, 'zh-Hant'));
        else if (sort === 'artist') filtered.sort((a, b) => a.artist.localeCompare(b.artist, 'zh-Hant'));

        musicBody.innerHTML = '';
        if (filtered.length === 0) {
            musicBody.innerHTML = `<tr><td colspan="3" style="padding: 40px; color: #999;">${UI_TEXT.emptySearch}</td></tr>`;
        } else {
            filtered.forEach((item, index) => {
                const isFav = State.favorites.includes(item.id);
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.artist + ' ' + item.song)}`;
                const tr = document.createElement('tr');
                tr.style.animationDelay = `${index * 0.03}s`;
                tr.innerHTML = `
                    <td class="col-fav"><button class="fav-btn ${isFav?'active':''}" onclick="toggleFavorite(${item.id})">❤</button></td>
                    <td class="col-artist">${highlight(item.artist, term)}</td>
                    <td class="col-song"><a href="${searchUrl}" target="_blank" class="song-link">🎵 ${highlight(item.song, term)}</a></td>
                `;
                musicBody.appendChild(tr);
            });
        }
        totalCountSpan.innerText = filtered.length;
    }

    /* =========================================================================
       5. 視覺特效模組
       ========================================================================= */
    function initVisuals() {
        setInterval(() => {
            const symbols = ['🎵', '🎶', '🎤', '🍔', '✨', '💿', '🎸'];
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (15 + Math.random() * 20) + 'px';
            p.style.animationDuration = (5 + Math.random() * 8) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 13000);
        }, 400);
    }

    function fireConfetti() {
        const colors = ['#ff7675', '#fab1a0', '#ffeaa7', '#55efc4', '#81ecec', '#a29bfe'];
        for (let i = 0; i < 40; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.width = (Math.random() * 8 + 5) + 'px';
            c.style.height = c.style.width;
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            c.style.animationDelay = (Math.random() * 0.5) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    function startRandomDraw() {
        const resSong = document.getElementById('resSong');
        const resArtist = document.getElementById('resArtist');
        const modalTitle = document.getElementById('modalTitle');
        
        modalTitle.innerText = UI_TEXT.modalDrawing;
        modalOverlay.style.display = 'flex';
        
        let speed = 20, iterations = 0;
        function shuffle() {
            const tempSong = rawMusicData[Math.floor(Math.random() * rawMusicData.length)];
            resSong.innerText = tempSong.song;
            resArtist.innerText = "歌手：" + tempSong.artist;
            iterations++;
            if(iterations < 25) {
                if (iterations > 12) speed += 15;
                if (iterations > 20) speed += 40;
                setTimeout(shuffle, speed);
            } else {
                const finalSong = rawMusicData[Math.floor(Math.random() * rawMusicData.length)];
                resSong.innerText = "✨ " + finalSong.song + " ✨";
                resArtist.innerText = "歌手：" + finalSong.artist;
                modalTitle.innerText = UI_TEXT.modalWon;
                fireConfetti();
            }
        }
        shuffle();
    }

    /* =========================================================================
       6. 事件監聽與初始化
       ========================================================================= */
    document.getElementById('randomBtn').addEventListener('click', startRandomDraw);
    document.getElementById('retryBtn').addEventListener('click', startRandomDraw);
    document.getElementById('closeModal').addEventListener('click', () => modalOverlay.style.display = 'none');
    
    function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }
    const processSearch = debounce(() => renderTable());
    searchInput.addEventListener('input', processSearch);
    sortSelect.addEventListener('change', renderTable);
    
    categoryTabs.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab')) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            State.currentArtist = e.target.getAttribute('data-artist');
            renderTable();
        }
    });

    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        themeToggle.innerText = theme === 'dark' ? '切換主題 ☀️' : '切換主題 🌙';
        localStorage.setItem('theme', theme);
    }
    applyTheme(State.theme);
    themeToggle.addEventListener('click', () => {
        State.theme = State.theme === 'light' ? 'dark' : 'light';
        applyTheme(State.theme);
    });

    window.onscroll = () => {
        backToTopBtn.style.display = (document.documentElement.scrollTop > 300) ? "flex" : "none";
    };
    backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 全局初始化
    window.onload = () => {
        updatePersonalCount();
        setGreeting();
        generateTabs();
        initVisuals();
        renderTable();
    };
</script>
