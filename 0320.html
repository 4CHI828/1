            --accent-grad: linear-gradient(135deg, #ff7675 0%, #fab1a0 100%);

            --input-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.1);

        [data-theme="dark"] {
            --bg-color: #0f0f0f;

            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(45, 45, 45, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .particle {
            position: fixed; bottom: -50px; user-select: none; pointer-events: none;
            z-index: -1; animation: floatUp linear forwards; color: var(--primary);
            opacity: 0.3;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            width: 100%; max-width: 850px;
            background: var(--card-bg); padding: 35px;
            border-radius: 40px; backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: var(--shadow);
            text-align: center; position: relative; z-index: 1;
            border: 1px solid var(--border-color);
        }

        .theme-toggle {
            position: absolute; top: 25px; right: 25px;
            cursor: pointer; font-size: 24px; background: none; border: none;
            color: var(--text-color); transition: 0.3s ease;
        }

        h1 { color: var(--primary); font-size: 28px; margin-bottom: 20px; letter-spacing: 1px; font-weight: 800; }
        
        .douyin-link {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 14px 32px; margin-bottom: 35px;
            background: var(--accent-grad); color: white;
            text-decoration: none; border-radius: 50px;
            font-weight: 600; transition: 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.4);
        }
        .douyin-link:hover { transform: translateY(-5px) scale(1.02); filter: brightness(1.1); }

        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .search-box {
            flex: 2; min-width: 200px; padding: 15px 22px;
            border: 2px solid #ffeaa7; border-radius: 30px;
            background: var(--input-bg); color: var(--text-color); outline: none;
            transition: 0.3s ease; font-size: 16px;
        }
        .sort-select {
            padding: 10px 20px; border-radius: 30px;
            border: 2px solid #ffeaa7; background: var(--input-bg);
            color: var(--text-color); outline: none; cursor: pointer;
        }

        .random-btn {
            padding: 0 25px; background: var(--accent-grad);
            color: white; border: none; border-radius: 30px;
            cursor: pointer; font-weight: 600; transition: 0.3s ease;
        }

        .category-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .tab {
            padding: 8px 16px; background: var(--bg-color); border-radius: 20px;
            cursor: pointer; font-size: 13px; border: 1px solid var(--border-color); 
            color: var(--text-color); transition: 0.3s ease;
        }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); }

        /* --- 表格排版置中優化 --- */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 500px; 
        }
        th { 
            background: rgba(0,0,0,0.03); 
            text-align: center; /* 表頭置中 */
            padding: 15px; 
            color: #999; 
            font-weight: 500; 
            font-size: 14px; 
            white-space: nowrap;
        }
        td { 
            padding: 12px 15px; 
            border-bottom: 1px solid var(--border-color); 
            vertical-align: middle; 
            transition: 0.2s;
            text-align: center; /* 內容全部置中 */
        }
        tr:hover td { background: rgba(255,118,117,0.05); }
        
        .col-fav { width: 60px; }
        .col-artist {

            color: #888; 
            font-size: 15px; 
            white-space: nowrap; 
        }
        .col-song {

        }

        .close-btn {

        }
        #backToTop:hover { transform: translateY(-5px); }
    </style>

    ];

    const State = {
        favorites: JSON.parse(localStorage.getItem('musicFavs')) || [],
        currentArtist: "全部",
        theme: localStorage.getItem('theme') || 'light',
    };

    const musicBody = document.getElementById('musicBody');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const totalCountSpan = document.getElementById('totalCount');
    const categoryTabs = document.getElementById('categoryTabs');
    const modalOverlay = document.getElementById('modalOverlay');
    const backToTopBtn = document.getElementById('backToTop');

    function initVisuals() {
        setInterval(() => {
            const symbols = ['🎵', '🎶', '🎤', '🍔', '✨', '💿', '🎸'];
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (15 + Math.random() * 20) + 'px';
            p.style.animationDuration = (5 + Math.random() * 8) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 13000);
        }, 400);
    }

    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        themeToggle.innerText = theme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', theme);
    }
    applyTheme(State.theme);
    themeToggle.addEventListener('click', () => {
        State.theme = State.theme === 'light' ? 'dark' : 'light';
        applyTheme(State.theme);
    });

    window.onscroll = () => {
        backToTopBtn.style.display = (document.documentElement.scrollTop > 300) ? "flex" : "none";
    };
    backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    function toggleFavorite(index) {
        if (State.favorites.includes(index)) {
            State.favorites = State.favorites.filter(id => id !== index);
        } else {
            State.favorites.push(index);
        }
        localStorage.setItem('musicFavs', JSON.stringify(State.favorites));
        renderTable();
    }

    function generateTabs() {
        const counts = {};
        musicData.forEach(item => { counts[item[0]] = (counts[item[0]] || 0) + 1; });
        const sortedArtists = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const topArtists = sortedArtists.slice(0, 15);
        
        let tabsHTML = `<button class="tab ${State.currentArtist==='全部'?'active':''}" data-artist="全部">全部</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='收藏'?'active':''}" data-artist="收藏">❤️ 最愛</button>`;
        topArtists.forEach(artist => {
            tabsHTML += `<button class="tab ${State.currentArtist===artist?'active':''}" data-artist="${artist}">${artist}</button>`;
        });
        categoryTabs.innerHTML = tabsHTML;
    }

    function renderTable() {
        const term = searchInput.value.toLowerCase();
        const sort = sortSelect.value;
        
        let filtered = musicData.filter((item, index) => {
            const matchesSearch = item[0].toLowerCase().includes(term) || item[1].toLowerCase().includes(term);
            const matchesArtist = (State.currentArtist === "全部") || 
                                  (State.currentArtist === "收藏" ? State.favorites.includes(index) : item[0] === State.currentArtist);
            return matchesSearch && matchesArtist;
        });

        if (sort === 'song') filtered.sort((a, b) => a[1].localeCompare(b[1], 'zh-Hant'));
        else if (sort === 'artist') filtered.sort((a, b) => a[0].localeCompare(b[0], 'zh-Hant'));

        const fragment = document.createDocumentFragment();
        const tempTable = document.createElement('tbody');

        filtered.forEach(item => {
            const originalIndex = musicData.indexOf(item);
            const isFav = State.favorites.includes(originalIndex);
            const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item[0] + ' ' + item[1])}`;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-fav">
                    <button class="fav-btn ${isFav?'active':''}" onclick="toggleFavorite(${originalIndex})">❤</button>
                </td>
                <td class="col-artist">${item[0]}</td>
                <td class="col-song">
                    <a href="${searchUrl}" target="_blank" class="song-link">🎵 ${item[1]}</a>
                </td>
            `;
            tempTable.appendChild(tr);
        });

        musicBody.innerHTML = '';
        musicBody.appendChild(tempTable);
        totalCountSpan.innerText = filtered.length;
    }

    document.getElementById('randomBtn').addEventListener('click', () => {
        const resSong = document.getElementById('resSong');
        const resArtist = document.getElementById('resArtist');
        const modalTitle = document.getElementById('modalTitle');
        document.getElementById('modalCard').classList.remove('winner');
        modalTitle.innerText = "✨ 正在抽獎... ✨";
        modalOverlay.style.display = 'flex';
        
        let speed = 20, iterations = 0;
        const totalSteps = 25;

        function shuffle() {
            const tempIndex = Math.floor(Math.random() * musicData.length);
            resSong.innerText = musicData[tempIndex][1];
            resArtist.innerText = "歌手：" + musicData[tempIndex][0];
            
            iterations++;
            if(iterations < totalSteps) {
                if (iterations > 12) speed += 15;
                if (iterations > 20) speed += 40;
                setTimeout(shuffle, speed);
            } else {
                const finalIndex = Math.floor(Math.random() * musicData.length);
                resSong.innerText = "✨ " + musicData[finalIndex][1] + " ✨";
                resArtist.innerText = "歌手：" + musicData[finalIndex][0];
                modalTitle.innerText = "🎉 抽中啦！ 🎉";
                document.getElementById('modalCard').classList.add('winner');
            }
        }
        shuffle();
    });

    document.getElementById('closeModal').addEventListener('click', () => modalOverlay.style.display = 'none');
    searchInput.addEventListener('input', renderTable);
    sortSelect.addEventListener('change', renderTable);
    categoryTabs.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab')) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            State.currentArtist = e.target.getAttribute('data-artist');
            renderTable();
        }
    });

    initVisuals();
    generateTabs();
    renderTable();
</script>

</body>
</html>
