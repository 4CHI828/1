<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>静静在夏天🍔🎤⁰³²⁰的歌單</title>
    <style>
        /* =========================================================================
           1. 設計 Token & 變數
           ========================================================================= */
        :root {
            --primary: #ff7675; 
            --primary-glow: rgba(255, 118, 117, 0.3);
            --bg-color: #fffaf0;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-color: #2d3436;
            --accent-grad: linear-gradient(135deg, #ff7675 0%, #fab1a0 100%);
            --border-color: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --card-bg: rgba(30, 30, 30, 0.8);
            --text-color: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(45, 45, 45, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.6);
            --primary-glow: rgba(255, 118, 117, 0.15);
        }

        /* =========================================================================
           2. 全局基礎樣式
           ========================================================================= */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
            overflow-x: hidden;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #cursor-glow {
            position: fixed; width: 300px; height: 300px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
            transform: translate(-50%, -50%); will-change: top, left;
        }

        @media (pointer: coarse) {
            #cursor-glow { display: none !important; }
        }

        .blob {
            position: fixed; width: 300px; height: 300px;
            background: var(--primary-glow); filter: blur(80px); border-radius: 50%;
            z-index: -2; animation: moveBlob 20s infinite alternate;
        }
        .blob-1 { top: -10%; left: -10%; background: rgba(255, 118, 117, 0.3); }
        .blob-2 { bottom: -10%; right: -10%; background: rgba(250, 177, 160, 0.3); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; background: rgba(255, 234, 167, 0.2); animation-delay: -10s; }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        .particle {
            position: fixed; bottom: -50px; user-select: none; pointer-events: none;
            z-index: -1; animation: floatUp linear forwards; color: var(--primary);
            opacity: 0.3;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* =========================================================================
           3. 容器與 UI 組件
           ========================================================================= */
        .container {
            width: 100%; max-width: 850px;
            background: var(--card-bg); padding: 35px;
            border-radius: 40px; backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            text-align: center; position: relative; z-index: 1;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            transition: var(--transition);
            box-sizing: border-box;
        }

        h1 { color: var(--primary); font-size: 28px; margin-bottom: 20px; font-weight: 800; }
        
        .main-link-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--accent-grad); color: white;
            text-decoration: none; border-radius: 50px;
            font-weight: 600; transition: var(--transition);
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .main-link-btn:hover { transform: translateY(-3px) scale(1.03); }
        .social-links-group { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 35px; }
        .social-btn { padding: 10px 20px; font-size: 14px; }

        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .search-wrapper { position: relative; flex: 2; min-width: 200px; }
        .search-box {
            width: 100%; padding: 15px 45px 15px 22px;
            border: 2px solid #ffeaa7; border-radius: 30px;
            background: var(--input-bg); color: var(--text-color); outline: none;
            transition: var(--transition); font-size: 16px; box-sizing: border-box;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .clear-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; color: #bbb; cursor: pointer; display: none; }

        .sort-select { padding: 10px 20px; border-radius: 30px; border: 2px solid #ffeaa7; background: var(--input-bg); color: var(--text-color); cursor: pointer; }
        .random-btn { padding: 0 25px; background: var(--accent-grad); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: 600; transition: var(--transition); }
        .history-btn { padding: 0 25px; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); border-radius: 30px; cursor: pointer; font-weight: 600; transition: var(--transition); }
        .history-btn:hover { background: var(--primary); color: white; }

        .category-tabs { 
            display: flex; flex-wrap: nowrap; gap: 10px; justify-content: flex-start; 
            margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch;
        }
        .category-tabs::-webkit-scrollbar { height: 4px; }
        .category-tabs::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .tab {
            padding: 8px 16px; background: var(--bg-color); border-radius: 20px;
            cursor: pointer; font-size: 13px; border: 1px solid var(--border-color); 
            color: var(--text-color); transition: var(--transition); white-space: nowrap;
        }
        .tab.active { background: var(--primary); color: white; transform: scale(1.05); box-shadow: 0 4px 10px var(--primary-glow); }

        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(0,0,0,0.03); text-align: center; padding: 15px; color: #999; font-size: 14px; }
        .music-row { opacity: 0; transform: translateY(15px); animation: rowSlideIn 0.4s ease forwards; }
        @keyframes rowSlideIn { to { opacity: 1; transform: translateY(0); } }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); text-align: center; }
        tr:hover td { background: rgba(255,118,117,0.05); }

        .fav-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #ccc; transition: var(--transition); width: 30px; height: 30px; }
        .fav-btn.active { color: #ff4757; transform: scale(1.3); }

        .song-link { color: var(--text-color); text-decoration: none; font-weight: 600; transition: var(--transition); }
        .song-link:hover { color: var(--primary); transform: scale(1.05); }
        mark { background-color: rgba(255, 118, 117, 0.3); color: inherit; border-radius: 3px; }

        /* 彈窗樣式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(15px); transition: var(--transition);
        }
        .modal-card {
            background: var(--card-bg); padding: 25px 20px; border-radius: 35px;
            text-align: center; animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px; width: 90%; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2); position: relative;
            display: flex; flex-direction: column; max-height: 90vh;
        }
        @keyframes popUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-badge {
            display: inline-block; padding: 4px 12px; background: rgba(255, 118, 117, 0.15);
            color: var(--primary); border-radius: 15px; font-size: 13px; font-weight: 700;
            margin-bottom: 5px; border: 1px solid rgba(255, 118, 117, 0.3);
        }
        .random-song { font-size: 22px; font-weight: 800; color: var(--primary); margin: 10px 0 5px 0; min-height: 32px; word-break: break-word; }
        .random-artist { font-size: 16px; margin-bottom: 10px; opacity: 0.85; font-weight: 600; }
        
        .modal-meta-box {
            background: rgba(0,0,0,0.04); border-radius: 15px; padding: 8px 14px;
            margin-bottom: 15px; font-size: 12px; opacity: 0.8; display: flex; flex-direction: column; gap: 4px;
            border: 1px solid var(--border-color);
        }

        .modal-actions { display: flex; flex-direction: row; gap: 10px; justify-content: center; margin-bottom: 15px; width: 100%; }
        .close-btn { background: var(--accent-grad); color: white; border: none; padding: 12px 15px; border-radius: 30px; cursor: pointer; font-weight: 600; flex: 1; }
        .retry-btn { background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); padding: 10px 15px; border-radius: 30px; cursor: pointer; font-weight: 600; flex: 1; }
        
        /* 手動停止按鈕的呼吸動畫 */
        .stop-btn {
            background: #ff4757 !important; color: white !important; font-size: 18px !important; width: 80% !important;
            animation: pulseStop 1.2s infinite cubic-bezier(0.66, 0, 0, 1); margin: 0 auto;
        }
        @keyframes pulseStop {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* 歷史紀錄列表樣式 */
        .history-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-top: 1px dashed var(--border-color); padding-top: 15px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
        .history-list { flex: 1; overflow-y: auto; text-align: left; padding-right: 5px; margin: 0; max-height: 35vh; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .history-item {
            padding: 10px 12px; border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.02); border-radius: 12px; margin-bottom: 8px; transition: var(--transition);
        }
        .history-item:hover { background: rgba(255, 118, 117, 0.05); }
        .history-time { font-size: 11px; opacity: 0.6; margin-bottom: 4px; }
        .history-song { font-weight: 700; color: var(--primary); font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-artist { font-size: 12px; opacity: 0.8; }

        .fab-btn {
            position: fixed; bottom: 30px; width: 55px; height: 55px; border-radius: 50%;
            background: var(--accent-grad); color: white; border: none; cursor: pointer; font-size: 22px; 
            display: flex; align-items: center; justify-content: center; z-index: 99;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: var(--transition);
        }
        #themeToggle { left: 30px; }
        #langToggle { left: 30px; bottom: 95px; }
        #backToTop { right: 30px; display: none; }

        .footer-stats { font-size: 14px; color: #888; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.8; margin-bottom: 10px; }
        .visitor-count { background: var(--card-bg); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--border-color); font-weight: 600; color: var(--primary); }
        .footer-credits { font-size: 12px; color: #bbb; text-align: center; margin-bottom: 30px; opacity: 0.6; }
        .footer-credits a { color: inherit; text-decoration: none; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; border-radius: 30px; }
            h1 { font-size: 22px; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            .music-row { margin-bottom: 15px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
            .music-row td { border: none; padding: 8px; text-align: left; display: flex; align-items: center; }
            .col-fav { justify-content: center; width: 40px; margin-right: -40px; position: absolute; right: 10px; top: 10px; }
            .col-artist { font-size: 13px; opacity: 0.7; color: var(--text-color); }
            .col-song { font-size: 16px; font-weight: 600; }
            .controls-row { gap: 8px; }
            .search-wrapper { flex: 1 1 100%; }
            .random-btn, .history-btn { flex: 1; min-width: 45%; padding: 12px 10px; text-align: center; }
            .fab-btn { width: 45px; height: 45px; font-size: 18px; }
            #themeToggle { left: 15px; }
            #langToggle { left: 15px; bottom: 80px; }
            #backToTop { right: 15px; }
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    // 為每首歌加入我的最愛專用 Key
    rawMusicData.forEach(item => {
        item.favKey = `${item.artist}-${item.song}`;
    });

    const State = {
        favorites: JSON.parse(localStorage.getItem('musicFavsV2')) || [],
        currentArtist: "全部",
        theme: localStorage.getItem('theme') || 'light',
        lang: localStorage.getItem('preferred-lang') || 'zh-Hant',
        displayLimit: 30,
        drawCount: parseInt(localStorage.getItem('drawCount') || '0'),
        drawHistory: JSON.parse(localStorage.getItem('drawHistory')) || []
    };

    const musicBody = document.getElementById('musicBody');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearch');
    const sortSelect = document.getElementById('sortSelect');
    const totalCountSpan = document.getElementById('totalCount');
    const categoryTabs = document.getElementById('categoryTabs');
    const modalOverlay = document.getElementById('modalOverlay');
    const backToTopBtn = document.getElementById('backToTop');
    const personalCountSpan = document.getElementById('personalCount');
    const cursorGlow = document.getElementById('cursor-glow');

    function convertText(text) {
        if (!text) return "";
        if (State.lang === 'zh-Hans') {
            return text.replace(/靜/g, '静').replace(/單/g, '单').replace(/環/g, '环').replace(/團/g, '团').replace(/龍/g, '龙').replace(/適/g, '适').replace(/麗/g, '丽').replace(/願/g, '愿').replace(/樂/g, '乐').replace(/個/g, '个').replace(/體/g, '体');
        } else {
            return text.replace(/静/g, '靜').replace(/单/g, '單').replace(/环/g, '環').replace(/团/g, '團').replace(/龙/g, '龍').replace(/适/g, '適').replace(/丽/g, '麗').replace(/愿/g, '願').replace(/乐/g, '樂').replace(/个/g, '個').replace(/体/g, '體');
        }
    }

    function applyLanguage() {
        const d = LANG_DICT[State.lang];
        document.documentElement.lang = State.lang;
        document.getElementById('mainTitle').innerText = d.mainTitle;
        document.getElementById('link-douyin').innerText = d.linkDouyin;
        document.getElementById('link-twitch').innerText = d.linkTwitch;
        document.getElementById('link-dc').innerText = d.linkDC;
        document.getElementById('link-yt').innerText = d.linkYT;
        document.getElementById('link-ig').innerText = d.linkIG;
        document.getElementById('searchInput').placeholder = d.searchPlaceholder;
        document.getElementById('opt-default').innerText = d.sortDefault;
        document.getElementById('opt-song').innerText = d.sortSong;
        document.getElementById('opt-artist').innerText = d.sortArtist;
        document.getElementById('randomBtn').innerText = d.randomBtn;
        document.getElementById('historyBtn').innerText = d.historyBtn;
        document.getElementById('stat-text').innerText = d.statText;
        document.getElementById('stat-unit').innerText = d.statUnit;
        document.getElementById('th-artist').innerText = d.thArtist;
        document.getElementById('th-song').innerText = d.thSong;
        document.getElementById('footerText').innerHTML = `${d.footerVisit}: <span class="visitor-count" id="personalCount">${localStorage.getItem('myPlaylistVisits') || 0}</span> 次`;
        document.getElementById('credit-text').innerText = d.credits;
        document.getElementById('closeModal').innerText = d.modalClose;
        document.getElementById('retryBtn').innerText = d.modalRetry;
        document.getElementById('stopBtn').innerText = d.stopBtn;
        document.getElementById('historyTitle').innerText = d.historyTitle;
        document.getElementById('clearHistoryBtn').innerText = d.historyClear;
        document.getElementById('langToggle').innerText = d.langBtn;
        generateTabs();
        renderTable();
        if (modalOverlay.style.display === 'flex') renderHistoryList(); 
    }

    function switchLanguage() {
        State.lang = (State.lang === 'zh-Hant') ? 'zh-Hans' : 'zh-Hant';
        localStorage.setItem('preferred-lang', State.lang);
        applyLanguage();
    }

    musicBody.addEventListener('click', (e) => {
        const favBtn = e.target.closest('.fav-btn');
        if (favBtn) {
            const favKey = favBtn.dataset.key;
            toggleFavorite(favKey);
        }
    });

    function setGreeting() {
        const hour = new Date().getHours();
        const d = LANG_DICT[State.lang];
        const greetingEl = document.getElementById('greeting');
        greetingEl.innerText = (hour < 12) ? d.greetingMorning : (hour < 18) ? d.greetingAfternoon : d.greetingEvening;
    }

    function updatePersonalCount() {
        let personalVisits = localStorage.getItem('myPlaylistVisits') || 0;
        personalVisits = parseInt(personalVisits) + 1;
        localStorage.setItem('myPlaylistVisits', personalVisits);
        const span = document.getElementById('personalCount');
        if(span) span.innerText = personalVisits;
    }

    function toggleFavorite(favKey) {
        if (State.favorites.includes(favKey)) {
            State.favorites = State.favorites.filter(fk => fk !== favKey);
        } else {
            State.favorites.push(favKey);
        }
        localStorage.setItem('musicFavsV2', JSON.stringify(State.favorites));
        renderTable();
    }

    function generateTabs() {
        const d = LANG_DICT[State.lang];
        const counts = {};
        rawMusicData.forEach(item => { counts[item.artist] = (counts[item.artist] || 0) + 1; });
        const sortedArtists = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const topArtists = sortedArtists.slice(0, 15);
        
        let tabsHTML = `<button class="tab ${State.currentArtist==='全部'?'active':''}" data-artist="全部">${d.allTab}</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='收藏'?'active':''}" data-artist="收藏">${d.favTab}</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='高音歌'?'active':''}" data-artist="高音歌">${d.highPitchTab}</button>`;
        
        topArtists.forEach(artist => {
            tabsHTML += `<button class="tab ${State.currentArtist===artist?'active':''}" data-artist="${artist}">${convertText(artist)}</button>`;
        });
        categoryTabs.innerHTML = tabsHTML;
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
    }

    function highlight(text, term) {
        if (!term) return text;
        const safeTerm = escapeRegExp(term);
        const regex = new RegExp(`(${safeTerm})`, 'gi');
        return text.replace(regex, `<mark>$1</mark>`);
    }

    function renderTable() {
        const d = LANG_DICT[State.lang];
        const term = searchInput.value.toLowerCase();
        const sort = sortSelect.value;
        clearSearchBtn.style.display = term ? 'block' : 'none';

        let filtered = rawMusicData.filter(item => {
            const matchesSearch = item.artist.toLowerCase().includes(term) || item.song.toLowerCase().includes(term);
            let matchesArtist = (State.currentArtist === "全部") ? true : 
                               (State.currentArtist === "收藏") ? State.favorites.includes(item.favKey) : 
                               (State.currentArtist === "高音歌") ? HIGH_PITCH_SONGS.includes(item.song) : 
                               item.artist === State.currentArtist;
            return matchesSearch && matchesArtist;
        });

        if (sort === 'song') filtered.sort((a, b) => a.song.localeCompare(b.song, State.lang));
        else if (sort === 'artist') filtered.sort((a, b) => a.artist.localeCompare(b.artist, State.lang));

        totalCountSpan.innerText = filtered.length;

        const slice = filtered.slice(0, State.displayLimit);
        const fragment = document.createDocumentFragment();

        if (slice.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="3" style="padding: 40px; color: #999;">${d.emptySearch}</td>`;
            fragment.appendChild(tr);
        } else {
            slice.forEach((item, index) => {
                const isFav = State.favorites.includes(item.favKey);
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.artist + ' ' + item.song)}`;
                const tr = document.createElement('tr');
                tr.className = 'music-row';
                tr.style.animationDelay = `${index * 0.01}s`;
                
                const convArtist = convertText(item.artist);
                const convSong = convertText(item.song);

                tr.innerHTML = `
                    <td class="col-fav"><button class="fav-btn ${isFav?'active':''}" data-key="${item.favKey}">❤</button></td>
                    <td class="col-artist">${highlight(convArtist, term)}</td>
                    <td class="col-song"><a href="${searchUrl}" target="_blank" class="song-link">🎵 ${highlight(convSong, term)}</a></td>
                `;
                fragment.appendChild(tr);
            });
        }
        musicBody.innerHTML = '';
        musicBody.appendChild(fragment);
    }

    window.addEventListener('mousemove', (e) => {
        cursorGlow.style.top = `${e.clientY}px`;
        cursorGlow.style.left = `${e.clientX}px`;
    });

    function initVisuals() {
        const interval = window.innerWidth < 600 ? 1200 : 600;
        setInterval(() => {
            const symbols = ['🎵', '🎶', '🎤', '🍔', '✨', '💿', '🎸'];
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (15 + Math.random() * 20) + 'px';
            p.style.animationDuration = (5 + Math.random() * 8) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 13000);
        }, interval);
    }

    function fireConfetti() {
        const colors = ['#ff7675', '#fab1a0', '#ffeaa7', '#55efc4', '#81ecec', '#a29bfe'];
        for (let i = 0; i < 40; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.width = c.style.height = (Math.random() * 8 + 5) + 'px';
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    function formatDateTime(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        return `${y}/${m}/${d} ${h}:${min}:${s}`;
    }

    function renderHistoryList() {
        const historyList = document.getElementById('historyList');
        const d = LANG_DICT[State.lang];
        if (State.drawHistory.length === 0) {
            historyList.innerHTML = `<div style="text-align:center; padding: 25px 10px; opacity:0.5; font-size: 14px;">${d.historyEmpty}</div>`;
        } else {
            historyList.innerHTML = State.drawHistory.map(item => {
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.artist + ' ' + item.song)}`;
                return `
                <div class="history-item">
                    <div class="history-time">${d.drawSeqPrefix}#${item.seq} &nbsp;|&nbsp; ${item.time}</div>
                    <a href="${searchUrl}" target="_blank" style="text-decoration:none;">
                        <div class="history-song">🎵 ${convertText(item.song)}</div>
                        <div class="history-artist">🎤 ${convertText(item.artist)}</div>
                    </a>
                </div>
            `}).join('');
        }
    }

    let drawInterval = null;
    let isDrawing = false;

    function startRandomDraw(doAnimate = true) {
        const d = LANG_DICT[State.lang];
        const resSong = document.getElementById('resSong');
        const resArtist = document.getElementById('resArtist');
        const modalTitle = document.getElementById('modalTitle');
        const modalBadge = document.getElementById('modalBadge');
        const modalMetaBox = document.getElementById('modalMetaBox');
        const stopBtn = document.getElementById('stopBtn');
        const resultActions = document.getElementById('resultActions');

        modalOverlay.style.display = 'flex';
        renderHistoryList(); 

        if (!doAnimate) {
            if (State.drawHistory.length > 0) {
                const latest = State.drawHistory[0];
                modalTitle.innerText = "🕒 " + d.historyBtn;
                resSong.innerText = "✨ " + convertText(latest.song) + " ✨";
                resArtist.innerText = "🎤 " + convertText(latest.artist);
                modalBadge.innerText = `${d.songSeqPrefix}${latest.id}`;
                modalBadge.style.display = 'inline-block';
                document.getElementById('resDrawSeq').innerHTML = `${d.drawSeqPrefix}<strong>#${latest.seq}</strong>${d.drawSeqSuffix}`;
                document.getElementById('resDrawTime').innerHTML = `${d.drawTimePrefix}<strong>${latest.time}</strong>`;
                modalMetaBox.style.display = 'flex';
                stopBtn.style.display = 'none';
                resultActions.style.display = 'flex';
            } else {
                modalTitle.innerText = "🕒 " + d.historyBtn;
                resSong.innerText = "...";
                resArtist.innerText = "...";
                modalBadge.style.display = 'none';
                modalMetaBox.style.display = 'none';
                stopBtn.style.display = 'none';
                resultActions.style.display = 'flex';
            }
            return;
        }

        isDrawing = true;
        modalTitle.innerText = d.modalDrawing;
        modalBadge.style.display = 'none';
        modalMetaBox.style.display = 'none';
        
        stopBtn.style.display = 'block';
        resultActions.style.display = 'none';
        
        if (drawInterval) clearInterval(drawInterval);
        
        drawInterval = setInterval(() => {
            const tempSong = rawMusicData[Math.floor(Math.random() * rawMusicData.length)];
            resSong.innerText = tempSong.song;
            resArtist.innerText = tempSong.artist;
        }, 60); 
    }

    document.getElementById('stopBtn').addEventListener('click', () => {
        if (!isDrawing) return;
        isDrawing = false;
        clearInterval(drawInterval);

        const d = LANG_DICT[State.lang];
        const finalSong = rawMusicData[Math.floor(Math.random() * rawMusicData.length)];
        
        State.drawCount += 1;
        localStorage.setItem('drawCount', State.drawCount);
        const nowStr = formatDateTime(new Date());

        State.drawHistory.unshift({
            seq: State.drawCount,
            time: nowStr,
            song: finalSong.song,
            artist: finalSong.artist,
            id: finalSong.id
        });
        if(State.drawHistory.length > 50) State.drawHistory.pop(); 
        localStorage.setItem('drawHistory', JSON.stringify(State.drawHistory));
        
        document.getElementById('resSong').innerText = "✨ " + convertText(finalSong.song) + " ✨";
        document.getElementById('resArtist').innerText = "🎤 " + convertText(finalSong.artist);
        
        const modalBadge = document.getElementById('modalBadge');
        modalBadge.innerText = `${d.songSeqPrefix}${finalSong.id}`;
        modalBadge.style.display = 'inline-block';

        document.getElementById('resDrawSeq').innerHTML = `${d.drawSeqPrefix}<strong>#${State.drawCount}</strong>${d.drawSeqSuffix}`;
        document.getElementById('resDrawTime').innerHTML = `${d.drawTimePrefix}<strong>${nowStr}</strong>`;
        document.getElementById('modalMetaBox').style.display = 'flex';

        document.getElementById('modalTitle').innerText = d.modalWon;
        
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('resultActions').style.display = 'flex';
        
        renderHistoryList(); 
        fireConfetti();
    });

    document.getElementById('randomBtn').addEventListener('click', () => startRandomDraw(true));
    document.getElementById('retryBtn').addEventListener('click', () => startRandomDraw(true));
    document.getElementById('historyBtn').addEventListener('click', () => startRandomDraw(false));
    document.getElementById('closeModal').addEventListener('click', () => {
        if (isDrawing) {
            clearInterval(drawInterval);
            isDrawing = false;
        }
        modalOverlay.style.display = 'none';
    });
    
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        const d = LANG_DICT[State.lang];
        if (confirm(d.confirmClear)) {
            State.drawHistory = [];
            localStorage.removeItem('drawHistory');
            renderHistoryList();
            
            if (!isDrawing) {
                document.getElementById('modalTitle').innerText = "🕒 " + d.historyBtn;
                document.getElementById('resSong').innerText = "...";
                document.getElementById('resArtist').innerText = "...";
                document.getElementById('modalBadge').style.display = 'none';
                document.getElementById('modalMetaBox').style.display = 'none';
            }
        }
    });

    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
            State.displayLimit += 30; 
            renderTable();
        }
    }, { threshold: 1.0 });

    observer.observe(document.getElementById('loadMoreSentinel'));

    clearSearchBtn.addEventListener('click', () => { searchInput.value = ''; renderTable(); });
    document.getElementById('langToggle').addEventListener('click', switchLanguage);

    function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }
    searchInput.addEventListener('input', debounce(() => {
        State.displayLimit = 30; 
        renderTable();
    }));
    sortSelect.addEventListener('change', renderTable);
    
    categoryTabs.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab')) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            State.currentArtist = e.target.getAttribute('data-artist');
            State.displayLimit = 30; 
            renderTable();
        }
    });

    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        themeToggle.innerText = theme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', theme);
    }
    applyTheme(State.theme);
    themeToggle.addEventListener('click', () => {
        State.theme = State.theme === 'light' ? 'dark' : 'light';
        applyTheme(State.theme);
    });

    window.onscroll = () => {
        backToTopBtn.style.display = (document.documentElement.scrollTop > 300) ? "flex" : "none";
    };
    backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    window.onload = () => {
        updatePersonalCount();
        applyLanguage();
        setGreeting();
        initVisuals();
        renderTable();
    };
</script>
