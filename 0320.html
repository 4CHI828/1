        /* =========================================================================
           1. 設計 Token & 變數
           ========================================================================= */
        :root {
            --primary: #ff7675; 
            --primary-glow: rgba(255, 118, 117, 0.4);
            --bg-color: #fffaf0;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-color: #2d3436;
            --accent-grad: linear-gradient(135deg, #ff7675 0%, #fab1a0 100%);
            --border-color: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --card-bg: rgba(30, 30, 30, 0.8);
            --text-color: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(45, 45, 45, 0.9);
            --shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* =========================================================================
           2. 全局基礎樣式 & 背景氛圍
           ========================================================================= */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            transition: background 0.5s ease;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 背景模糊光暈 (Blobs) */
        .blob {
            position: fixed; width: 300px; height: 300px;
            background: var(--primary-glow);
            filter: blur(80px); border-radius: 50%;
            z-index: -2; animation: moveBlob 20s infinite alternate;
        }
        .blob-1 { top: -10%; left: -10%; background: rgba(255, 118, 117, 0.3); }
        .blob-2 { bottom: -10%; right: -10%; background: rgba(250, 177, 160, 0.3); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; background: rgba(255, 234, 167, 0.2); animation-delay: -10s; }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        .particle {
            position: fixed; bottom: -50px; user-select: none; pointer-events: none;
            z-index: -1; animation: floatUp linear forwards; color: var(--primary);
            opacity: 0.3;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* =========================================================================
           3. 容器與 UI 組件
           ========================================================================= */
        .container {
            width: 100%; max-width: 850px;
            background: var(--card-bg); padding: 35px;
            border-radius: 40px; backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            text-align: center; position: relative; z-index: 1;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            transition: var(--transition);
        }

        h1 { color: var(--primary); font-size: 28px; margin-bottom: 20px; font-weight: 800; }
        
        .main-link-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--accent-grad); color: white;
            text-decoration: none; border-radius: 50px;
            font-weight: 600; transition: var(--transition);
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .main-link-btn:hover { transform: translateY(-3px) scale(1.03); }

        .social-links-group { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 35px; }
        .social-btn { padding: 10px 20px; font-size: 14px; }

        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .search-wrapper { position: relative; flex: 2; min-width: 200px; }
        .search-box {
            width: 100%; padding: 15px 45px 15px 22px;
            border: 2px solid #ffeaa7; border-radius: 30px;
            background: var(--input-bg); color: var(--text-color); outline: none;
            transition: var(--transition); font-size: 16px; box-sizing: border-box;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        
        .clear-btn {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 18px; color: #bbb;
            cursor: pointer; display: none;
        }

        .sort-select { padding: 10px 20px; border-radius: 30px; border: 2px solid #ffeaa7; background: var(--input-bg); color: var(--text-color); cursor: pointer; }
        .random-btn { padding: 0 25px; background: var(--accent-grad); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: 600; transition: var(--transition); }

        .category-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .tab {
            padding: 8px 16px; background: var(--bg-color); border-radius: 20px;
            cursor: pointer; font-size: 13px; border: 1px solid var(--border-color); 
            color: var(--text-color); transition: var(--transition);
        }
        .tab.active { background: var(--primary); color: white; transform: scale(1.1); box-shadow: 0 4px 10px var(--primary-glow); }

        /* 表格樣式 */
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: rgba(0,0,0,0.03); text-align: center; padding: 15px; color: #999; font-size: 14px; }
        tr { transition: var(--transition); }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); text-align: center; }
        tr:hover td { background: rgba(255,118,117,0.05); }

        .fav-btn { 
            background: none; border: none; cursor: pointer; font-size: 20px; color: #ccc; 
            transition: var(--transition); width: 30px; height: 30px; 
        }
        .fav-btn.active { color: #ff4757; transform: scale(1.3); }
        /* 點擊心形動畫 */
        .fav-btn:active { transform: scale(0.8); transition: 0.1s; }

        .song-link { color: var(--text-color); text-decoration: none; font-weight: 600; transition: var(--transition); }
        .song-link:hover { color: var(--primary); transform: scale(1.05); }

        mark { background-color: rgba(255, 118, 117, 0.3); color: inherit; border-radius: 3px; }

        /* 彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(15px); transition: var(--transition);
        }
        .modal-card {
            background: var(--card-bg); padding: 50px; border-radius: 40px;
            text-align: center; animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 350px; width: 85%; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes popUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .random-song { font-size: 28px; font-weight: 800; color: var(--primary); margin: 20px 0; min-height: 40px; }
        .random-artist { font-size: 18px; margin-bottom: 35px; opacity: 0.8; }

        .close-btn { background: var(--accent-grad); color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: 600; width: 80%; }
        .retry-btn { background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); padding: 12px 40px; border-radius: 30px; cursor: pointer; font-weight: 600; width: 80%; }

        .fab-btn {

        ["郭靜", "心牆"], ["張惠妹", "原來你什麼都不想要"],
        ["", "首選"], ["", "心臟"], ["", "光熒"], ["", "你好"], ["", "關鍵"]
    ];

    const rawMusicData = musicList.map((item, index) => ({ 
        id: index, 
        artist: (item[0] && item[0].trim() !== "") ? item[0] : "其他", 
        song: item[1] 
    }));

    const State = {
        favorites: JSON.parse(localStorage.getItem('musicFavs')) || [],
        currentArtist: "全部",
        theme: localStorage.getItem('theme') || 'light',
    };

    // DOM Elements
    const musicBody = document.getElementById('musicBody');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearch');
    const sortSelect = document.getElementById('sortSelect');
    const totalCountSpan = document.getElementById('totalCount');
    const categoryTabs = document.getElementById('categoryTabs');
    const modalOverlay = document.getElementById('modalOverlay');
    const backToTopBtn = document.getElementById('backToTop');
    const personalCountSpan = document.getElementById('personalCount');

    /* =========================================================================
       4. 核心邏輯 (含事件委託)
       ========================================================================= */

    // 【重要】事件委託：監聽整個 table body，而不是為每個按鈕綁定事件
    musicBody.addEventListener('click', (e) => {
        const favBtn = e.target.closest('.fav-btn');
        if (favBtn) {
            const id = parseInt(favBtn.dataset.id);
            toggleFavorite(id);
        }
    });

    function setGreeting() {
        const hour = new Date().getHours();
        const greetingEl = document.getElementById('greeting');
        greetingEl.innerText = (hour < 12) ? UI_TEXT.greetingMorning : (hour < 18) ? UI_TEXT.greetingAfternoon : UI_TEXT.greetingEvening;
    }

    function updatePersonalCount() {
        let personalVisits = localStorage.getItem('myPlaylistVisits') || 0;
        personalVisits = parseInt(personalVisits) + 1;
        localStorage.setItem('myPlaylistVisits', personalVisits);
        personalCountSpan.innerText = personalVisits;
    }

    function toggleFavorite(id) {
        if (State.favorites.includes(id)) {
            State.favorites = State.favorites.filter(fid => fid !== id);
        } else {
            State.favorites.push(id);
        }
        localStorage.setItem('musicFavs', JSON.stringify(State.favorites));
        renderTable();
    }

    function generateTabs() {
        const counts = {};
        rawMusicData.forEach(item => { counts[item.artist] = (counts[item.artist] || 0) + 1; });
        const sortedArtists = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const topArtists = sortedArtists.slice(0, 15);
        
        let tabsHTML = `<button class="tab ${State.currentArtist==='全部'?'active':''}" data-artist="全部">${UI_TEXT.allTab}</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='收藏'?'active':''}" data-artist="收藏">${UI_TEXT.favTab}</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='高音歌'?'active':''}" data-artist="高音歌">${UI_TEXT.highPitchTab}</button>`;
        tabsHTML += `<button class="tab ${State.currentArtist==='其他'?'active':''}" data-artist="其他">${UI_TEXT.otherTab}</button>`;
        
        topArtists.forEach(artist => {
            if(artist !== "其他") {
                tabsHTML += `<button class="tab ${State.currentArtist===artist?'active':''}" data-artist="${artist}">${artist}</button>`;
            }
        });
        categoryTabs.innerHTML = tabsHTML;
    }

    function highlight(text, term) {
        if (!term) return text;
        const regex = new RegExp(`(${term})`, 'gi');
        return text.replace(regex, `<mark>$1</mark>`);
    }

    function renderTable() {
        const term = searchInput.value.toLowerCase();
        const sort = sortSelect.value;
        clearSearchBtn.style.display = term ? 'block' : 'none';

        let filtered = rawMusicData.filter(item => {
            const matchesSearch = item.artist.toLowerCase().includes(term) || item.song.toLowerCase().includes(term);
            let matchesArtist = (State.currentArtist === "全部") ? true : 
                               (State.currentArtist === "收藏") ? State.favorites.includes(item.id) : 
                               (State.currentArtist === "高音歌") ? HIGH_PITCH_SONGS.includes(item.song) : 
                               item.artist === State.currentArtist;
            return matchesSearch && matchesArtist;
        });

        if (sort === 'song') filtered.sort((a, b) => a.song.localeCompare(b.song, 'zh-Hant'));
        else if (sort === 'artist') filtered.sort((a, b) => a.artist.localeCompare(b.artist, 'zh-Hant'));

        const fragment = document.createDocumentFragment();
        if (filtered.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="3" style="padding: 40px; color: #999;">${UI_TEXT.emptySearch}</td>`;
            fragment.appendChild(tr);
        } else {
            filtered.forEach((item, index) => {
                const isFav = State.favorites.includes(item.id);
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.artist + ' ' + item.song)}`;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-fav"><button class="fav-btn ${isFav?'active':''}" data-id="${item.id}">❤</button></td>
                    <td class="col-artist">${highlight(item.artist, term)}</td>
                    <td class="col-song"><a href="${searchUrl}" target="_blank" class="song-link">🎵 ${highlight(item.song, term)}</a></td>
                `;
                fragment.appendChild(tr);
            });
        }
        musicBody.innerHTML = '';
        musicBody.appendChild(fragment);
        totalCountSpan.innerText = filtered.length;
    }

    /* =========================================================================
       5. 視覺特效 (含抽獎緊張感 & 粒子優化)
       ========================================================================= */
    function initVisuals() {
        setInterval(() => {
            const symbols = ['🎵', '🎶', '🎤', '🍔', '✨', '💿', '🎸'];
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (15 + Math.random() * 20) + 'px';
            p.style.animationDuration = (5 + Math.random() * 8) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 13000);
        }, 600); // 稍微降低頻率，提升效能
    }

    function fireConfetti() {
        const colors = ['#ff7675', '#fab1a0', '#ffeaa7', '#55efc4', '#81ecec', '#a29bfe'];
        for (let i = 0; i < 40; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.width = c.style.height = (Math.random() * 8 + 5) + 'px';
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    function startRandomDraw() {
        const resSong = document.getElementById('resSong');
        const resArtist = document.getElementById('resArtist');
        const modalTitle = document.getElementById('modalTitle');
        
        modalTitle.innerText = UI_TEXT.modalDrawing;
        modalOverlay.style.display = 'flex';
        
        // 非線性減速序列 [快, 快, 中, 中, 慢, 慢, 停]
        const delays = [30, 50, 100, 150, 300, 600, 1000];
        let currentStep = 0;

        function shuffle() {
            const tempSong = rawMusicData[Math.floor(Math.random() * rawMusicData.length)];
            resSong.innerText = tempSong.song;
            resArtist.innerText = "歌手：" + tempSong.artist;

            if (currentStep < delays.length - 1) {
                setTimeout(shuffle, delays[currentStep]);
                currentStep++;
            } else {
                const finalSong = rawMusicData[Math.floor(Math.random() * rawMusicData.length)];
                resSong.innerText = "✨ " + finalSong.song + " ✨";
                resArtist.innerText = "歌手：" + finalSong.artist;
                modalTitle.innerText = UI_TEXT.modalWon;
                fireConfetti();
            }
        }
        shuffle();
    }

    /* =========================================================================
       6. 事件綁定與初始化
       ========================================================================= */
    document.getElementById('randomBtn').addEventListener('click', startRandomDraw);
    document.getElementById('retryBtn').addEventListener('click', startRandomDraw);
    document.getElementById('closeModal').addEventListener('click', () => modalOverlay.style.display = 'none');
    
    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        renderTable();
    });

    function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }
    searchInput.addEventListener('input', debounce(() => renderTable()));
    sortSelect.addEventListener('change', renderTable);
    
    categoryTabs.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab')) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            State.currentArtist = e.target.getAttribute('data-artist');
            renderTable();
        }
    });

    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        themeToggle.innerText = theme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', theme);
    }
    applyTheme(State.theme);
    themeToggle.addEventListener('click', () => {
        State.theme = State.theme === 'light' ? 'dark' : 'light';
        applyTheme(State.theme);
    });

    window.onscroll = () => {
        backToTopBtn.style.display = (document.documentElement.scrollTop > 300) ? "flex" : "none";
    };
    backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    window.onload = () => {
        updatePersonalCount();
        setGreeting();
        generateTabs();
        initVisuals();
        renderTable();
    };
</script>
