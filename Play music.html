<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新竹奇奇828音樂播放器</title>
    <style>
    body {
      background: linear-gradient(#1a1a1a, #0f0f0f);
      color: #ccc;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    h2 { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
    .top-bar { display: flex; gap: 20px; margin: 20px 0; justify-content: center; width: 100%; }
    .controls { display: flex; gap: 12px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
    audio { width: 100%; max-width: 560px; margin: 10px 0; }

    /* 按鈕光暈效果 */
    button, input[type="file"] {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2b2d31;
      color: #00ffff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
    }
    button:hover {
      background: #3a3d41;
      box-shadow: 
        0 0 20px rgba(255, 0, 255, 0.8),
        0 0 30px rgba(0, 255, 255, 0.6);
    }

    /* 播放清單邊框呼吸式漸層動畫 */
    @keyframes borderGlow {
      0% { box-shadow: 0 0 15px rgba(0,255,255,0.4), 0 0 25px rgba(255,0,255,0.3); }
      50% { box-shadow: 0 0 30px rgba(0,255,255,0.8), 0 0 45px rgba(255,0,255,0.6); }
      100% { box-shadow: 0 0 15px rgba(0,255,255,0.4), 0 0 25px rgba(255,0,255,0.3); }
    }
    #playlist {
      list-style: none;
      padding: 0;
      margin: 20px 0 0 0;
      width: 100%;
      max-width: 560px;
      background: #2b2d31;
      border-radius: 12px;
      max-height: 400px;
      overflow-y: auto;
      border: 2px solid transparent;
      background-clip: padding-box;
      animation: borderGlow 4s infinite ease-in-out;
    }
    #playlist li {
      padding: 12px 16px;
      border-bottom: 1px solid #444;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 15px; }
    .file-size { color: #00ffcc; font-size: 14px; font-weight: 600; }

    /* 播放中歌曲動畫 */
    @keyframes glowPulse {
      0% { color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff; }
      50% { color: #ff00ff; text-shadow: 0 0 20px #ff00ff, 0 0 30px #00ffff; }
      100% { color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff; }
    }
    @keyframes playingGlow {
      0% { border: 2px solid rgba(0,255,255,0.6); box-shadow: 0 0 10px rgba(0,255,255,0.6); }
      50% { border: 2px solid rgba(255,0,255,0.8); box-shadow: 0 0 20px rgba(255,0,255,0.8), 0 0 30px rgba(0,255,255,0.6); }
      100% { border: 2px solid rgba(0,255,255,0.6); box-shadow: 0 0 10px rgba(0,255,255,0.6); }
    }
    #playlist li.playing {
      font-weight: bold;
      border-radius: 8px;
      animation: glowPulse 2s infinite alternate,
                 playingGlow 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <h2>🎧 新竹奇奇828音樂播放器</h2>

  <div class="top-bar" style="flex-direction: column; gap: 10px; align-items: center;">
    <label style="text-align: center;">選擇檔案：<input type="file" id="fileInput" accept="audio/*" multiple></label>
    <label style="text-align: center;">選擇目錄：<input type="file" id="folderInput" webkitdirectory multiple></label>
  </div>

  <div class="controls">
    <button id="prevBtn">◀ 上一首</button>
    <button id="loopPlaylistBtn">歌單循環</button>
    <button id="loopSingleBtn">單曲循環</button>
    <button id="shuffleBtn">隨機播放</button>
    <button id="nextBtn">下一首 ▶</button>
  </div>

  <audio id="player" controls></audio>
  <ul id="playlist"></ul>

  <script>
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const playlist = document.getElementById('playlist');
    const player = document.getElementById('player');
    const loopPlaylistBtn = document.getElementById('loopPlaylistBtn');
    const loopSingleBtn = document.getElementById('loopSingleBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');

    let files = [];
let currentIndex = 0;
let loopPlaylist = false;
let loopSingle = false;
let shuffleMode = false;

function renderPlaylist() {
  playlist.innerHTML = '';
  files.forEach((file, index) => {
    const sizeMB = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
    const li = document.createElement('li');
    li.innerHTML = `
      <span class="file-name">${index + 1}. ${file.name}</span>
      <span class="file-size">${sizeMB}</span>
    `;
    li.addEventListener('click', () => playFile(index));
    playlist.appendChild(li);
  });
}

function playFile(index) {
  if (index < 0 || index >= files.length) return;
  currentIndex = index;

  if (player.src && player.src.startsWith("blob:")) {
    URL.revokeObjectURL(player.src);
  }
  player.src = URL.createObjectURL(files[index]);
  player.play();

  Array.from(playlist.children).forEach((li, i) => {
    li.classList.toggle('playing', i === currentIndex);
    if (i === currentIndex) {
      li.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });
}

function updateLoopMode(single, playlistLoop) {
  loopSingle = single;
  loopPlaylist = playlistLoop;
  player.loop = loopSingle;
  loopSingleBtn.textContent = loopSingle ? "單曲循環 ✅" : "單曲循環";
  loopPlaylistBtn.textContent = loopPlaylist ? "歌單循環 ✅" : "歌單循環";
}

fileInput.addEventListener('change', () => {
  files = Array.from(fileInput.files);
  renderPlaylist();
  if (files.length > 0) playFile(0);
});

folderInput.addEventListener('change', () => {
  files = Array.from(folderInput.files).filter(f => f.type.startsWith('audio/'));
  renderPlaylist();
  if (files.length > 0) playFile(0);
});

prevBtn.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + files.length) % files.length;
  playFile(currentIndex);
});

nextBtn.addEventListener('click', () => {
  if (shuffleMode) {
    playFile(Math.floor(Math.random() * files.length));
  } else {
    currentIndex = (currentIndex + 1) % files.length;
    playFile(currentIndex);
  }
});

loopPlaylistBtn.addEventListener('click', () => updateLoopMode(false, !loopPlaylist));
loopSingleBtn.addEventListener('click', () => updateLoopMode(!loopSingle, false));

shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.textContent = shuffleMode ? "隨機播放 ✅" : "隨機播放";
});

player.addEventListener('ended', () => {
  if (shuffleMode) {
    playFile(Math.floor(Math.random() * files.length));
  } else if (currentIndex + 1 < files.length) {
    playFile(currentIndex + 1);
  } else if (loopPlaylist) {
    playFile(0);
  }
});

  </script>
</body>
</html>
