<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新竹奇奇828音樂播放器</title>
  <style>
    /* ============================================================
       【視覺層：CSS 定義】
       ============================================================ */
    
    /* 1. 霓虹主題配色方案：使用 CSS 變數方便統一修改 */
    :root {
      --neon-color: #00ffff;      /* 主色：青色 */
      --neon-glow: rgba(0, 255, 255, 0.6); /* 發光效果 */
      --neon-accent: #ff00ff;     /* 點綴色：品紅 */
      --bg-dark: #0f0f0f;         /* 深色背景 */
      --glass-bg: rgba(43, 45, 49, 0.7); /* 玻璃擬態背景 */
      --glass-border: rgba(255, 255, 255, 0.1); /* 玻璃邊框 */
    }

    body {
      background: linear-gradient(#1a1a1a, var(--bg-dark));
      color: #ccc;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
      transition: all 0.3s ease;
      margin: 0;
    }

    /* 拖放檔案時的背景視覺反饋 */
    body.drag-over {
      background: radial-gradient(circle, #252a30 0%, var(--bg-dark) 100%);
      box-shadow: inset 0 0 100px var(--neon-glow);
    }

    h2 { 
      color: var(--neon-color); 
      text-shadow: 0 0 20px var(--neon-color); 
      margin-bottom: 30px;
    }
    
    /* 佈局容器：頂部工具列 */
    .top-bar { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      align-items: center; 
      margin-bottom: 20px; 
      width: 100%; 
    }
    
    /* 播放控制按鈕組 */
    .controls { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
      justify-content: center; 
    }
    
    audio { 
      width: 100%; 
      max-width: 560px; 
      margin: 10px 0 20px 0; 
    }

    /* 玻璃擬態面板：核心視覺風格 */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px); /* 毛玻璃模糊 */
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* 增益控制面板 */
    .gain-panel {
      display: flex;
      gap: 20px;
      padding: 15px 25px;
      margin-bottom: 15px;
      font-size: 14px;
      align-items: center;
      justify-content: center;
    }
    .adv-item { display: flex; align-items: center; gap: 8px; }
    .adv-item input {
      background: rgba(0,0,0,0.5);
      color: var(--neon-color);
      border: 1px solid var(--neon-color);
      border-radius: 4px;
    }

    /* 按鈕通用樣式與霓虹懸停效果 */
    button, input[type="file"] {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--neon-color);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--glass-border);
      box-shadow: 0 0 12px var(--neon-glow);
    }
    button:hover {
      background: rgba(58, 61, 65, 0.8);
      box-shadow: 0 0 20px var(--neon-accent), 0 0 30px var(--neon-glow);
      transform: translateY(-2px);
    }
    button.active {
      background: var(--neon-color);
      color: #000;
      box-shadow: 0 0 20px var(--neon-color);
    }

    /* 動畫：歌單邊框呼吸燈 */
    @keyframes borderGlow {
      0% { box-shadow: 0 0 15px var(--neon-glow), 0 0 25px rgba(255,0,255,0.3); }
      50% { box-shadow: 0 0 30px var(--neon-glow), 0 0 45px rgba(255,0,255,0.6); }
      100% { box-shadow: 0 0 15px var(--neon-glow), 0 0 25px rgba(255,0,255,0.3); }
    }

    #playlist {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
      width: 100%;
      max-width: 560px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
      animation: borderGlow 4s infinite ease-in-out; /* 套用呼吸燈動畫 */
    }
    #playlist li {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    #playlist li:hover { background: rgba(255, 255, 255, 0.05); }
    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 15px; }
    .file-size { color: #00ffcc; font-size: 14px; font-weight: 600; }

    /* 動畫：目前播放歌曲的發光跳動效果 */
    @keyframes glowPulse {
      0% { color: var(--neon-color); text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-accent); }
      50% { color: var(--neon-accent); text-shadow: 0 0 20px var(--neon-accent), 0 0 30px var(--neon-color); }
      100% { color: var(--neon-color); text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-accent); }
    }
    @keyframes playingGlow {
      0% { border: 2px solid var(--neon-glow); box-shadow: 0 0 10px var(--neon-glow); }
      50% { border: 2px solid var(--neon-accent); box-shadow: 0 0 20px var(--neon-accent), 0 0 30px var(--neon-glow); }
      100% { border: 2px solid var(--neon-glow); box-shadow: 0 0 10px var(--neon-glow); }
    }
    #playlist li.playing {
      font-weight: bold;
      border-radius: 8px;
      animation: glowPulse 2s infinite alternate, playingGlow 2.5s infinite ease-in-out;
      margin: 4px;
    }

    .update-tag {
      font-size: 12px;
      color: #666;
      margin-top: 20px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>
<body id="mainBody">
  <!-- ============================================================
       【結構層：HTML 佈局】
       ============================================================ -->
  
  <h2>🎧 新竹奇奇828音樂播放器</h2>

  <!-- 檔案輸入區 -->
  <div class="top-bar">
    <label style="text-align: center;">檔案：<input type="file" id="fileInput" accept="audio/*" multiple></label>
    <label style="text-align: center;">目錄：<input type="file" id="folderInput" webkitdirectory multiple></label>
  </div>

  <!-- 播放控制按鈕區 -->
  <div class="controls">
    <button id="prevBtn">◀ 上</button>
    <button id="loopPlaylistBtn">歌單循環</button>
    <button id="loopSingleBtn">單曲循環</button>
    <button id="shuffleBtn">隨機</button>
    <button id="nextBtn">下 ▶</button>
  </div>

  <!-- 音訊增益（放大）控制面板 -->
  <div class="gain-panel glass-panel">
    <div class="adv-item">
      <span style="color: var(--neon-color);">增益:</span>
      <input type="range" id="gainSlider" min="1" max="10" step="0.1" value="1">
      <span id="gainValue" style="color: var(--neon-color); min-width: 40px;">1.0x</span>
    </div>
  </div>

  <!-- 核心播放器組件 -->
  <audio id="player" controls></audio>

  <!-- 動態生成歌單的容器 -->
  <ul id="playlist"></ul>

  <!-- 頁面更新標記 -->
  <div class="update-tag" id="updateTag"></div>

  <script>
    /* ============================================================
       【邏輯層：JavaScript 功能實現】
       ============================================================ */

    // --- 1. 元素選取 (DOM Selection) ---
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const playlist = document.getElementById('playlist');
    const player = document.getElementById('player');
    const loopPlaylistBtn = document.getElementById('loopPlaylistBtn');
    const loopSingleBtn = document.getElementById('loopSingleBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const mainBody = document.getElementById('mainBody');
    const updateTag = document.getElementById('updateTag');
    const gainSlider = document.getElementById('gainSlider');
    const gainValueDisplay = document.getElementById('gainValue');

    // --- 2. 全域狀態管理 (State Management) ---
    let files = [];             // 儲存所有導入的音樂檔案
    let currentIndex = 0;      // 目前播放的歌曲索引
    let loopPlaylist = false;   // 是否開啟歌單循環
    let loopSingle = false;     // 是否開啟單曲循環
    let shuffleMode = false;    // 是否開啟隨機播放
    let titleInterval = null;   // 標題跑馬燈的計時器

    // Web Audio API 相關變數
    let audioCtx, source, gainNode;

    // 定義支援的音訊格式正則表達式
    const AUDIO_EXTENSIONS = /\.(mp3|wav|ogg|m4a|flac|aac|opus|wma|aiff|aif|m4p|alac)$/i;

    /**
     * 初始化 Web Audio API
     * 目的：建立音訊處理鏈路，實現超越 100% 的增益放大
     */
    function initAudioContext() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(player); // 將 audio 標籤作為音源
        gainNode = audioCtx.createGain();                   // 建立增益節點
        source.connect(gainNode);                           // 連接：音源 -> 增益
        gainNode.connect(audioCtx.destination);             // 連接：增益 -> 輸出(喇叭)
      } catch (e) {
        console.error("AudioContext initialization failed:", e);
      }
    }

    // 設定保存與讀取 (localStorage)
    function saveSettings() {
      localStorage.setItem('playerSettings', JSON.stringify({ gain: gainSlider.value }));
    }

    function loadSettings() {
      const saved = localStorage.getItem('playerSettings');
      if (saved) {
        const s = JSON.parse(saved);
        gainSlider.value = s.gain;
        gainValueDisplay.textContent = parseFloat(s.gain).toFixed(1) + 'x';
      }
    }

    function displayUpdateTime() {
      updateTag.textContent = `頁面最後更新時間：${document.lastModified}`;
    }
    displayUpdateTime();

    /**
     * 渲染歌單
     * 將 files 陣列轉換為 HTML 列表並顯示
     */
    function renderPlaylist() {
      playlist.innerHTML = files.map((file, index) => {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
        return `<li data-index="${index}" class="${index === currentIndex ? 'playing' : ''}">
                  <span class="file-name">${index + 1}. ${file.name}</span>
                  <span class="file-size">${sizeMB}</span>
                </li>`;
      }).join('');
    }

    /**
     * 標題跑馬燈效果
     * 使瀏覽器分頁標題動態滾動
     */
    function startTitleScrolling(songName) {
      if (titleInterval) clearInterval(titleInterval);
      let text = ` 🎵 播放中: ${songName} 🎵 `;
      titleInterval = setInterval(() => {
        text = text.substring(1) + text[0];
        document.title = text;
      }, 300);
    }

    /**
     * 播放指定索引的檔案
     * @param {number} index 檔案陣列中的索引
     */
    function playFile(index) {
      if (files.length === 0) return;
      if (index < 0 || index >= files.length) return;
      
      initAudioContext(); // 確保音訊上下文已啟動
      currentIndex = index;

      // 記憶體管理：釋放舊的 Blob URL 防止記憶體洩漏
      if (player.src && player.src.startsWith("blob:")) {
        URL.revokeObjectURL(player.src);
      }
      
      player.src = URL.createObjectURL(files[currentIndex]);
      player.play().catch(e => console.log("Autoplay prevented"));
      startTitleScrolling(files[currentIndex].name);

      renderPlaylist();
      // 自動滾動到目前播放的項目
      const activeItem = document.querySelector(`#playlist li[data-index="${currentIndex}"]`);
      if (activeItem) activeItem.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    /**
     * 切換至下一首
     * 處理：隨機模式 -> 順序播放 -> 循環播放 -> 停止
     */
    function playNext() {
      if (files.length === 0) return;
      if (shuffleMode) {
        playFile(Math.floor(Math.random() * files.length));
      } else {
        if (currentIndex + 1 < files.length) {
          playFile(currentIndex + 1);
        } else if (loopPlaylist) {
          playFile(0); // 回到第一首
        } else {
          player.pause();
          if (titleInterval) clearInterval(titleInterval);
          document.title = "新竹奇奇828音樂播放器";
        }
      }
    }

    // 循環模式切換邏輯
    function updateLoopMode(single, playlistLoop) {
      loopSingle = single;
      loopPlaylist = playlistLoop;
      player.loop = loopSingle; // HTML5 原生單曲循環屬性
      loopSingleBtn.textContent = loopSingle ? "單曲循環 ✅" : "單曲循環";
      loopPlaylistBtn.textContent = loopPlaylist ? "歌單循環 ✅" : "歌單循環";
    }

    // 點擊歌單項目即播放
    playlist.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li) playFile(parseInt(li.dataset.index));
    });

    // 檢查檔案是否為音訊格式
    function isAudioFile(file) {
      return file.type.startsWith('audio/') || AUDIO_EXTENSIONS.test(file.name);
    }

    /**
     * 處理新加入的檔案
     */
    const handleFiles = (newFiles) => {
      const filtered = Array.from(newFiles).filter(isAudioFile);
      if (filtered.length === 0) return;
      files = [...files, ...filtered];
      renderPlaylist();
      // 如果目前沒在播放且沒歌，自動播放剛加入的第一首歌
      if (player.paused && (!player.src || player.src === "")) {
        playFile(files.length - filtered.length);
      }
    };

    fileInput.addEventListener('change', () => handleFiles(fileInput.files));
    folderInput.addEventListener('change', () => handleFiles(folderInput.files));

    // --- 3. 拖放功能實作 (Drag and Drop) ---
    window.addEventListener('dragover', (e) => { 
      e.preventDefault(); 
      mainBody.classList.add('drag-over'); 
    });

    window.addEventListener('dragleave', () => mainBody.classList.remove('drag-over'));

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      mainBody.classList.remove('drag-over');

      const items = e.dataTransfer.items;
      const droppedFiles = [];

      // 遞迴掃描資料夾內容
      if (items && items.length > 0) {
        async function traverseFileTree(entry) {
          if (!entry) return;
          try {
            if (entry.isFile) {
              const file = await new Promise((resolve) => entry.file(resolve));
              if (isAudioFile(file)) droppedFiles.push(file);
            } else if (entry.isDirectory) {
              const reader = entry.createReader();
              const entries = await new Promise((resolve) => reader.readEntries(resolve));
              for (const childEntry of entries) {
                await traverseFileTree(childEntry);
              }
            }
          } catch (err) {
            console.error("Error reading entry:", err);
          }
        }

        const promises = [];
        for (let i = 0; i < items.length; i++) {
          const entry = items[i].webkitGetAsEntry();
          if (entry) promises.push(traverseFileTree(entry));
        }
        await Promise.all(promises);
      }

      // 處理單純的檔案拖入
      if (droppedFiles.length === 0 && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const basicFiles = Array.from(e.dataTransfer.files).filter(isAudioFile);
        droppedFiles.push(...basicFiles);
      }

      if (droppedFiles.length > 0) {
        files = [...files, ...droppedFiles];
        renderPlaylist();
        if (player.paused && (!player.src || player.src === "")) {
          playFile(files.length - droppedFiles.length);
        }
      }
    });

    // --- 4. 按鈕事件綁定 ---
    prevBtn.addEventListener('click', () => {
      if (files.length === 0) return;
      currentIndex = (currentIndex - 1 + files.length) % files.length; // 循環索引
      playFile(currentIndex);
    });

    nextBtn.addEventListener('click', playNext);
    loopPlaylistBtn.addEventListener('click', () => updateLoopMode(false, !loopPlaylist));
    loopSingleBtn.addEventListener('click', () => updateLoopMode(!loopSingle, false));
    shuffleBtn.addEventListener('click', () => {
      shuffleMode = !shuffleMode;
      shuffleBtn.textContent = shuffleMode ? "隨機 ✅" : "隨機";
    });

    // 歌曲結束時自動執行 playNext
    player.addEventListener('ended', playNext);

    // 增益滑桿即時生效
    gainSlider.addEventListener('input', () => {
      const val = parseFloat(gainSlider.value);
      gainValueDisplay.textContent = val.toFixed(1) + 'x';
      if (gainNode) gainNode.gain.value = val;
      saveSettings();
    });

    // --- 5. 快捷鍵支援 ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault(); // 防止頁面跳轉
        player.paused ? player.play() : player.pause();
      } else if (e.code === 'ArrowLeft') {
        prevBtn.click();
      } else if (e.code === 'ArrowRight') {
        nextBtn.click();
      } else if (e.key.toLowerCase() === 'm') {
        player.muted = !player.muted;
      }
    });

    // 初始化設定
    loadSettings();
    player.onplay = () => {
      if (gainNode) gainNode.gain.value = parseFloat(gainSlider.value);
    };
  </script>
</body>
</html>
