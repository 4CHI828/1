<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如如Sherry🐑</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        :root {
            --sheep-pink: #ffb6c1;
            --marshmallow-white: rgba(255, 255, 255, 0.85);
            --soft-bg: #fffaf5;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden; 
            background: var(--soft-bg); 
            font-family: 'Noto Sans TC', sans-serif;
            color: #b18e8e;
        }

        /* 頂部圖片的漂浮動畫 */
        .main-profile-img {
            display: block;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 20px 30px rgba(255, 182, 193, 0.5));
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .main-profile-img:active {
            transform: scale(0.95) rotate(-2deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        /* 柔和的雲朵背景光斑 */
        .cloud-blob {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255, 223, 230, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(60px);
            animation: drift 15s infinite alternate ease-in-out;
        }

        @keyframes drift {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(10%, 10%) rotate(20deg); }
        }

        /* 玻璃擬態容器 */
        .glass-panel {
            background: var(--marshmallow-white);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.2);
        }

        /* 棉花糖按鈕樣式 */
        .marshmallow-link {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #ffe4e1;
            background: white;
            color: #b18e8e;
            box-shadow: 0 4px 10px rgba(255, 192, 203, 0.3);
        }

        .marshmallow-link:hover {
            background: #fff0f5;
            border-color: var(--sheep-pink);
            transform: scale(1.05) translateY(-3px);
            color: #ff69b4;
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.5);
        }

        /* 圖片相框樣式 */
        .image-frame {
            border: 10px solid white;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
        }

        /* 小綿羊粒子 */
        .mini-sheep {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen w-screen py-12 px-4 relative">

    <!-- 背景裝飾 -->
    <div class="cloud-blob" style="top: -10%; left: -10%;"></div>
    <div class="cloud-blob" style="bottom: -10%; right: -10%; animation-delay: -7s; background: radial-gradient(circle, rgba(240, 248, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);"></div>

    <!-- 主內容容器 -->
    <div class="z-10 flex flex-col items-center gap-8 w-full max-w-2xl">
        
        <!-- 1. 頂部：照片與名稱 -->
        <div class="flex flex-col items-center gap-6">
            <!-- 原本底部的圖片移到這裡，並加上漂浮動畫 -->
            <div id="mainProfile" class="main-profile-img image-frame rounded-3xl overflow-hidden max-w-xs md:max-w-sm">
                <img src="Copilot_20260516_195020.png" alt="如如Sherry" class="w-full h-auto block">
            </div>
            <h1 class="text-3xl md:text-5xl font-bold text-pink-400 drop-shadow-sm">如如Sherry</h1>
        </div>

        <!-- 2. 中間：連結區域 (玻璃面板) -->
        <div class="glass-panel p-6 rounded-[40px] w-full">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <a href="https://discord.com/channels/865334403864461373/1487116354581565610" target="_blank" class="marshmallow-link px-6 py-3 rounded-full font-medium text-base flex items-center justify-center gap-2">
                    <span>🐑</span> 如如幫DC
                </a>
                <a href="https://v.douyin.com/aBFu2J91Kus/" target="_blank" class="marshmallow-link px-6 py-3 rounded-full font-medium text-base flex items-center justify-center gap-2">
                    <span>🐑</span> 如如Sherry抖音
                </a>
                <a href="https://www.instagram.com/periririi/" target="_blank" class="marshmallow-link px-6 py-3 rounded-full font-medium text-base flex items-center justify-center gap-2">
                    <span>🐑</span> 如如Sherry IG
                </a>
                <a href="https://www.twitch.tv/rurusherry" target="_blank" class="marshmallow-link px-6 py-3 rounded-full font-medium text-base flex items-center justify-center gap-2">
                    <span>🐑</span> 如如Sherry圖奇
                </a>
                <a href="https://www.youtube.com/playlist?list=PL3LHSN24syoNIiNrZppr6l1VQY8LFhLFs" target="_blank" class="marshmallow-link px-6 py-3 rounded-full font-medium text-base flex items-center justify-center gap-2">
                    <span>🐑</span> 如如Sherry-YT
                </a>
            </div>
        </div>

    </div>

    <!-- 底部裝飾 -->
    <div class="z-10 flex flex-col items-center mt-auto mb-8">
        <div class="w-12 h-1.5 rounded-full bg-pink-200 opacity-60"></div>
    </div>

    <script>
        // 創建飄落的小綿羊粒子
        function createMiniSheep() {
            const sheep = document.createElement('div');
            sheep.className = 'mini-sheep';
            sheep.innerText = '🐑';
            
            const size = 15 + Math.random() * 20;
            sheep.style.fontSize = size + 'px';
            sheep.style.left = Math.random() * 100 + 'vw';
            
            const duration = 5 + Math.random() * 7;
            sheep.style.animationDuration = duration + 's';
            
            document.body.appendChild(sheep);
            
            setTimeout(() => {
                sheep.remove();
            }, duration * 1000);
        }

        // 每隔 2 秒生成一隻小綿羊
        setInterval(createMiniSheep, 2000);

        // 點擊圖片的互動 (原本點擊綿羊的邏輯移到圖片上)
        const mainProfile = document.getElementById('mainProfile');
        mainProfile.addEventListener('click', () => {
            for(let i=0; i<5; i++) {
                setTimeout(createMiniSheep, i * 100);
            }
        });
    </script>

</body>
</html>
