    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden; 
            background: #fffaf5; 
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 巨大綿羊的「漂浮動畫」 */
        .center-sheep {
            display: inline-block;
            font-size: 6rem; 
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 20px 30px rgba(255, 182, 193, 0.4));
            cursor: default;
            user-select: none;
        }

        @media (min-width: 768px) {
            .center-sheep {
                font-size: 10rem; 
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* 柔和的雲朵背景光斑 */
        .cloud-blob {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 223, 230, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            animation: drift 15s infinite alternate;
        }

        @keyframes drift {
            from { transform: translate(-20%, -10%) rotate(0deg); }
            to { transform: translate(20%, 10%) rotate(10deg); }
        }

        /* 像棉花糖一樣的按鈕樣式 */
        .marshmallow-link {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #ffe4e1;
            background: rgba(255, 255, 255, 0.9);
            color: #b18e8e;
            box-shadow: 0 8px 20px rgba(255, 192, 203, 0.2);
            white-space: nowrap;
        }

        .marshmallow-link:hover {
            background: #fff0f5;
            border-color: #ffb6c1;
            transform: scale(1.1) rotate(-2deg);
            color: #ff69b4;
            box-shadow: 0 12px 25px rgba(255, 182, 193, 0.4);
        }

        /* 圖片相框樣式 */
        .image-frame {
            position: relative;
            transition: all 0.5s ease;
            border: 8px solid white;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3);
        }

        .image-frame:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(255, 182, 193, 0.5);
        }
    </style>
</head>
