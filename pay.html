<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端分帳與多幣別記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-3 md:p-6 text-gray-800">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-5 md:p-6 space-y-5">
    
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="text-xl font-bold text-gray-900">分帳與多幣別記帳</h1>
        <div id="rateStatus" class="text-xs text-gray-400 mt-0.5">即時匯率載入中...</div>
      </div>
      <div class="flex gap-2">
        <button id="toggleMemberBtn" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded-lg transition">⚙️ 成員</button>
        <button id="refreshBtn" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium px-2.5 py-1.5 rounded-lg transition">重整</button>
      </div>
    </div>

    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2 flex-1 min-w-[200px]">
        <span class="text-xs font-semibold text-amber-900">🔒 存取密碼：</span>
        <input type="password" id="accessPassword" placeholder="請輸入密碼解鎖" class="flex-1 border rounded-lg px-2.5 py-1 text-xs bg-white focus:outline-amber-500">
      </div>
      <div class="flex items-center gap-2">
        <button id="authBtn" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded-lg text-xs font-medium transition">解鎖資料</button>
        <button id="clearAuthBtn" class="text-xs text-gray-500 hover:text-red-500 underline">鎖定</button>
      </div>
    </div>

    <div id="memberConfigPanel" class="hidden bg-gray-50 border border-gray-200 rounded-xl p-4 space-y-3">
      <div class="text-xs font-bold text-gray-700">管理分攤成員名單</div>
      <div class="flex gap-2">
        <input type="text" id="newMemberName" placeholder="輸入成員名字" class="flex-1 border rounded-lg px-3 py-1.5 text-xs bg-white focus:outline-blue-500">
        <button id="addMemberBtn" class="bg-gray-800 hover:bg-black text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">加入</button>
      </div>
      <div id="memberTagList" class="flex flex-wrap gap-1.5 text-xs"></div>
    </div>

    <div class="bg-blue-50 border border-blue-100 rounded-xl p-4">
      <div class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2">成員分帳結算 (TWD)</div>
      <div id="settlementGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
        <div class="col-span-full text-gray-400 py-1">請先解鎖以查看結算金額</div>
      </div>
    </div>

    <form id="recordForm" class="space-y-4">
      <div class="grid grid-cols-3 gap-2">
        <select id="type" class="border rounded-lg px-2.5 py-2 text-sm bg-gray-50 focus:bg-white focus:outline-blue-500">
          <option value="expense">支出</option>
          <option value="income">個人收入</option>
        </select>
        <input type="text" id="title" placeholder="項目名稱 (如: 居酒屋晚餐)" required class="col-span-2 border rounded-lg px-3 py-2 text-sm focus:outline-blue-500">
      </div>

      <div class="grid grid-cols-3 gap-2">
        <select id="currency" class="border rounded-lg px-2.5 py-2 text-sm bg-gray-50 focus:bg-white focus:outline-blue-500 font-semibold">
          <option value="TWD">TWD 台幣</option>
          <option value="JPY">JPY 日圓</option>
          <option value="USD">USD 美元</option>
          <option value="KRW">KRW 韓元</option>
          <option value="EUR">EUR 歐元</option>
        </select>
        <input type="number" id="originalAmount" placeholder="原始金額" step="any" min="0.01" required class="border rounded-lg px-3 py-2 text-sm focus:outline-blue-500">
        <div class="flex items-center text-xs text-gray-500 bg-gray-50 px-3 py-2 rounded-lg border">
          折合 <span id="previewTwd" class="font-bold text-blue-600 ml-1">0</span> TWD
        </div>
      </div>

      <div id="splitSection" class="p-3 bg-gray-50 rounded-xl border border-gray-200 space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-gray-600">誰先代墊 (付款人)：</span>
          <select id="payer" class="border rounded-lg px-2 py-1 bg-white text-xs"></select>
        </div>
        <div>
          <div class="text-xs font-medium text-gray-600 mb-1">分攤成員 (平分)：</div>
          <div class="flex flex-wrap gap-3 text-xs" id="membersCheckboxes"></div>
        </div>
      </div>

      <div class="flex gap-2">
        <input type="date" id="date" required class="w-1/2 border rounded-lg px-3 py-2 text-sm focus:outline-blue-500">
        <button type="submit" id="submitBtn" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
          儲存紀錄
        </button>
      </div>
    </form>

    <div>
      <h2 class="text-sm font-semibold text-gray-500 mb-2">歷史明細</h2>
      <div id="recordList" class="space-y-2 max-h-80 overflow-y-auto">
        <p class="text-gray-400 text-center text-sm py-4">請輸入密碼以讀取雲端資料</p>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyLdzLuX2UzEpgD2fc-P_2l8L0yjfjsUgLaOTdn7tJWcRdhIG6ZY4lxFp5WAY7pFXxW/exec";
    
    let members = JSON.parse(localStorage.getItem("split_members")) || ["我", "小明", "小華"];
    let exchangeRates = { TWD: 1, JPY: 0.21, USD: 32.5, KRW: 0.024, EUR: 35.2 };
    let cachedRecords = [];

    // 取得當前輸入或儲存的密碼
    function getPassword() {
      return document.getElementById("accessPassword").value.trim() || localStorage.getItem("app_pwd") || "";
    }

    // 初始化成員選單
    function renderMemberControls() {
      const payerSelect = document.getElementById("payer");
      payerSelect.innerHTML = members.map(m => `<option value="${m}">${m}</option>`).join("");

      const cbContainer = document.getElementById("membersCheckboxes");
      cbContainer.innerHTML = members.map(m => `
        <label class="flex items-center gap-1 cursor-pointer bg-white px-2 py-1 rounded border border-gray-200">
          <input type="checkbox" value="${m}" checked class="member-cb"> ${m}
        </label>
      `).join("");

      const tagList = document.getElementById("memberTagList");
      tagList.innerHTML = members.map((m, idx) => `
        <span class="inline-flex items-center gap-1 bg-white border border-gray-300 px-2 py-0.5 rounded-md">
          ${m}
          <button onclick="removeMember(${idx})" class="text-red-400 hover:text-red-600 font-bold ml-1">×</button>
        </span>
      `).join("");

      localStorage.setItem("split_members", JSON.stringify(members));
      if (cachedRecords.length > 0) renderSettlement(cachedRecords);
    }

    document.getElementById("addMemberBtn").addEventListener("click", () => {
      const input = document.getElementById("newMemberName");
      const name = input.value.trim();
      if (name && !members.includes(name)) {
        members.push(name);
        input.value = "";
        renderMemberControls();
      }
    });

    window.removeMember = function(index) {
      if (members.length <= 1) return alert("至少需保留一位成員！");
      members.splice(index, 1);
      renderMemberControls();
    };

    document.getElementById("toggleMemberBtn").addEventListener("click", () => {
      document.getElementById("memberConfigPanel").classList.toggle("hidden");
    });

    async function fetchExchangeRates() {
      try {
        const res = await fetch("https://open.er-api.com/v6/latest/TWD");
        const data = await res.json();
        if (data && data.rates) {
          exchangeRates.JPY = 1 / data.rates.JPY;
          exchangeRates.USD = 1 / data.rates.USD;
          exchangeRates.KRW = 1 / data.rates.KRW;
          exchangeRates.EUR = 1 / data.rates.EUR;
          document.getElementById("rateStatus").textContent = `匯率已同步 (1 USD ≈ ${exchangeRates.USD.toFixed(1)} TWD)`;
        }
      } catch (e) {
        document.getElementById("rateStatus").textContent = "使用預設匯率";
      }
      updateTwdPreview();
    }

    function updateTwdPreview() {
      const curr = document.getElementById("currency").value;
      const amount = parseFloat(document.getElementById("originalAmount").value) || 0;
      const rate = exchangeRates[curr] || 1;
      const twd = Math.round(amount * rate);
      document.getElementById("previewTwd").textContent = twd.toLocaleString();
      return { rate, twd };
    }

    document.getElementById("type").addEventListener("change", (e) => {
      document.getElementById("splitSection").style.display = e.target.value === "expense" ? "block" : "none";
    });
    document.getElementById("currency").addEventListener("change", updateTwdPreview);
    document.getElementById("originalAmount").addEventListener("input", updateTwdPreview);
    document.getElementById("date").valueAsDate = new Date();

    function renderSettlement(records) {
      const balances = {};
      members.forEach(m => balances[m] = 0);

      records.forEach(item => {
        if (item.type === "expense" && item.splitMembers && item.splitMembers.length > 0) {
          const splitCount = item.splitMembers.length;
          const perPersonShare = (item.twdAmount || 0) / splitCount;

          if (balances[item.payer] !== undefined) {
            balances[item.payer] += item.twdAmount || 0;
          }
          item.splitMembers.forEach(m => {
            if (balances[m] !== undefined) {
              balances[m] -= perPersonShare;
            }
          });
        }
      });

      const grid = document.getElementById("settlementGrid");
      grid.innerHTML = "";
      for (const [member, bal] of Object.entries(balances)) {
        const roundedBal = Math.round(bal);
        const isPositive = roundedBal > 0;
        const isZero = roundedBal === 0;
        grid.innerHTML += `
          <div class="bg-white p-2 rounded-lg border ${isZero ? 'border-gray-200' : isPositive ? 'border-green-200' : 'border-red-200'}">
            <div class="font-medium text-gray-600">${member}</div>
            <div class="font-bold mt-1 ${isZero ? 'text-gray-400' : isPositive ? 'text-green-600' : 'text-red-500'}">
              ${isZero ? '$0' : (isPositive ? `+應收 $${roundedBal}` : `-應付 $${Math.abs(roundedBal)}`)}
            </div>
          </div>
        `;
      }
    }

    // 讀取資料
    async function loadRecords() {
      const pwd = getPassword();
      const listEl = document.getElementById("recordList");
      const grid = document.getElementById("settlementGrid");

      if (!pwd) {
        listEl.innerHTML = `<p class="text-amber-600 text-center text-sm py-4">🔒 請輸入密碼以載入資料</p>`;
        grid.innerHTML = `<div class="col-span-full text-gray-400 py-1">請先解鎖以查看結算金額</div>`;
        return;
      }

      listEl.innerHTML = `<p class="text-gray-400 text-center text-sm py-4">驗證中並載入資料...</p>`;

      try {
        const res = await fetch(`${API_URL}?password=${encodeURIComponent(pwd)}`);
        const data = await res.json();

        if (data.error === "AUTH_FAILED") {
          listEl.innerHTML = `<p class="text-red-500 text-center text-sm py-4">❌ 密碼錯誤，無法讀取資料</p>`;
          grid.innerHTML = `<div class="col-span-full text-red-400 py-1">密碼錯誤</div>`;
          return;
        }

        // 認證成功，記住密碼
        localStorage.setItem("app_pwd", pwd);
        cachedRecords = data || [];
        listEl.innerHTML = "";

        if (cachedRecords.length === 0) {
          listEl.innerHTML = `<p class="text-gray-400 text-center text-sm py-4">目前尚無資料</p>`;
        }

        cachedRecords.forEach(item => {
          const isExp = item.type === "expense";
          const row = document.createElement("div");
          row.className = "p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs flex justify-between items-start";
          row.innerHTML = `
            <div>
              <div class="font-bold text-sm text-gray-800">${item.title}</div>
              <div class="text-gray-400 mt-0.5">${item.date} · ${isExp ? `由 <b>${item.payer}</b> 先付` : '個人收入'}</div>
              ${isExp && item.splitMembers && item.splitMembers.length ? `<div class="text-gray-500 mt-1">分攤: ${item.splitMembers.join(", ")}</div>` : ''}
            </div>
            <div class="text-right">
              <div class="font-bold text-sm ${isExp ? 'text-gray-900' : 'text-green-600'}">
                ${item.currency !== 'TWD' ? `${item.currency} ${(item.originalAmount || 0).toLocaleString()} ≈ ` : ''}NT$ ${(item.twdAmount || 0).toLocaleString()}
              </div>
              <button onclick="deleteRecord('${item.id}')" class="text-red-400 hover:text-red-600 text-xs mt-1">刪除</button>
            </div>
          `;
          listEl.appendChild(row);
        });

        renderSettlement(cachedRecords);

      } catch (err) {
        listEl.innerHTML = `<p class="text-red-400 text-center text-sm py-4">連線失敗，請檢查網路或 Apps Script 設定</p>`;
      }
    }

    // 新增資料
    document.getElementById("recordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwd = getPassword();
      if (!pwd) return alert("請先在上方輸入密碼解鎖！");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "儲存中...";

      const { rate, twd } = updateTwdPreview();
      const type = document.getElementById("type").value;
      const selectedMembers = Array.from(document.querySelectorAll(".member-cb:checked")).map(cb => cb.value);

      const payload = {
        password: pwd,
        type: type,
        title: document.getElementById("title").value,
        originalAmount: parseFloat(document.getElementById("originalAmount").value),
        currency: document.getElementById("currency").value,
        rate: rate,
        twdAmount: twd,
        payer: type === "expense" ? document.getElementById("payer").value : "",
        splitMembers: type === "expense" ? selectedMembers : [],
        date: document.getElementById("date").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        
        if (result.status === "error") {
          alert("儲存失敗：" + result.message);
        } else {
          document.getElementById("title").value = "";
          document.getElementById("originalAmount").value = "";
          updateTwdPreview();
          await loadRecords();
        }
      } catch (err) {
        alert("儲存失敗，請檢查網路連線");
      } finally {
        btn.disabled = false;
        btn.textContent = "儲存紀錄";
      }
    });

    // 刪除資料
    window.deleteRecord = async function(id) {
      const pwd = getPassword();
      if (!pwd) return alert("請先輸入密碼！");
      if (!confirm("確定要刪除這筆紀錄？")) return;

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "delete", id: id, password: pwd })
        });
        loadRecords();
      } catch (err) {
        alert("刪除失敗");
      }
    };

    // 密碼解鎖按鈕
    document.getElementById("authBtn").addEventListener("click", loadRecords);
    
    // 鎖定按鈕（清除本地儲存的密碼）
    document.getElementById("clearAuthBtn").addEventListener("click", () => {
      localStorage.removeItem("app_pwd");
      document.getElementById("accessPassword").value = "";
      cachedRecords = [];
      loadRecords();
    });

    document.getElementById("refreshBtn").addEventListener("click", loadRecords);

    // 啟動初始化
    const savedPwd = localStorage.getItem("app_pwd");
    if (savedPwd) {
      document.getElementById("accessPassword").value = savedPwd;
    }
    renderMemberControls();
    fetchExchangeRates().then(() => loadRecords());
  </script>
</body>
</html>
