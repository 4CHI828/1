<!DOCTYPE html>
<html lang="zh-TW" style="font-size: 16px;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雲端全能分帳記帳系統</title>
  
  <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoi6Zuy56uv5YWo6IO95YiG5biz6KiY5biz57O757WxIiwic2hvcnRfbmFtZSI6IumZvueuuKiY5bizIiwiZGVzY3JpcHRpb24iOiLmlK/mjIjlhb5Lq65YiG5biz44CB5aSa5bmj5Yil44CB6KiY5biz5ZyW6aSF5ZyW44CBSlBXRU9DUiDlm77ljZrlpKrlpKrlpKoiLCJzdGFydF91cmwiOiIuLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMxMTE4MjciLCJ0aGVtZV9jb2xvciI6IiMyNTYzZWIiLCJpY29ucyI6W3sic3JjIjoiaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZsYXRpY29uLmNvbS81MTIvMjkzNi8yOTM2NzU4LnBuZyIsInNpemVzIjoiMTkyeDE5MiIsInR5cGUiOiJpbWFnZS9wbmciLCJwdXJwb3NlIjoiYW55IG1hc2thYmxlIn0seyJzcmMiOiiaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZsYXRpY29uLmNvbS81MTIvMjkzNi8yOTM2NzU4LnBuZyIsInNpemVzIjoiNTEyeDUxMiIsInR5cGUiOiJpbWFnZS9wbmciLCJwdXJwb3NlIjoiYW55IG1hc2thYmxlIn1dfQ==">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="雲端記帳">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2936/2936758.png">

  <!-- 第三方函式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    .glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    
    @keyframes slideDown {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { transform: translateY(0); opacity: 1; }
      90% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100%); opacity: 0; }
    }
    .toast-anim { animation: slideDown 3.5s ease-in-out forwards; }
  </style>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-gray-900 min-h-screen p-2 sm:p-4 text-gray-800 dark:text-gray-100 transition-colors duration-300 font-sans">
  
  <div id="toastContainer" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

  <div class="max-w-2xl mx-auto w-full glass bg-white/80 dark:bg-gray-800/80 rounded-[1.5rem] shadow-xl border border-white/50 dark:border-gray-700/50 p-4 sm:p-6 space-y-5">
    
    <!-- 頂部控制列 -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-200/60 dark:border-gray-700/60 pb-4 gap-3">
      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <select id="sheetSelector" class="flex-1 sm:flex-none border border-gray-300/50 dark:border-gray-600/50 rounded-xl px-3 py-1.5 text-sm bg-white/50 dark:bg-gray-700/50 dark:text-white font-bold text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          <option value="預設帳本">預設帳本</option>
        </select>
        <button type="button" id="addSheetBtn" class="bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-800 px-3 py-1.5 rounded-xl font-bold transition active:scale-95">＋</button>
      </div>

      <div class="flex items-center gap-2 flex-wrap w-full sm:w-auto justify-end">
        <button type="button" id="pwaInstallBtn" class="hidden text-xs bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold px-3 py-1.5 rounded-xl shadow transition active:scale-95">📲 安裝App</button>
        <button type="button" id="themeToggleBtn" class="p-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition active:scale-95 shadow-sm text-sm">🌙</button>
        <button type="button" id="toggleFontPanelBtn" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-2.5 py-1.5 rounded-xl font-medium shadow-sm transition active:scale-95">🔤</button>
        <button type="button" id="toggleMemberBtn" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-2.5 py-1.5 rounded-xl font-medium shadow-sm transition active:scale-95">👥 成員</button>
        <button type="button" id="toggleDataBtn" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-2.5 py-1.5 rounded-xl font-medium shadow-sm transition active:scale-95">📁 備份</button>
        <button type="button" id="refreshBtn" class="text-xs bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 font-bold px-3 py-1.5 rounded-xl hover:bg-blue-200 dark:hover:bg-blue-800 transition active:scale-95 shadow-sm">↻ 更新</button>
      </div>
    </div>

    <!-- 匯率橫幅 -->
    <div class="bg-gradient-to-r from-blue-50/80 to-indigo-50/80 dark:from-slate-800/80 dark:to-gray-800/80 border border-blue-100/50 dark:border-gray-700 rounded-2xl p-3 shadow-sm">
      <div class="flex items-center justify-between text-[11px] font-bold text-gray-500 dark:text-gray-400 mb-2">
        <span class="flex items-center gap-1">💱 <span>即時參考匯率</span></span>
        <span id="rateUpdateTime" class="font-mono text-[10px] bg-white/50 dark:bg-black/20 px-2 py-0.5 rounded-full">更新中...</span>
      </div>
      <div id="rateChipsContainer" class="flex gap-2 overflow-x-auto pb-1 text-xs snap-x">
        <div class="text-gray-400 py-1">載入中...</div>
      </div>
    </div>

    <!-- 設定面板群組 -->
    <div id="fontConfigPanel" class="hidden bg-white/60 dark:bg-slate-900/60 border border-gray-200/50 dark:border-gray-700/50 rounded-2xl p-4 space-y-3 shadow-inner">
      <div class="flex justify-between items-center text-xs font-bold text-gray-700 dark:text-gray-300">
        <span>自訂全站字體大小</span><span id="fontSizeDisplay" class="text-blue-600 font-mono text-sm bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded-lg">16px</span>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" id="fontDecBtn" class="w-8 h-8 bg-white dark:bg-gray-700 rounded-full shadow hover:bg-gray-50 transition font-bold active:scale-90">-</button>
        <input type="range" id="fontSlider" min="12" max="24" step="1" value="16" class="flex-1 accent-blue-600 h-1.5 bg-gray-200 rounded-lg appearance-none">
        <button type="button" id="fontIncBtn" class="w-8 h-8 bg-white dark:bg-gray-700 rounded-full shadow hover:bg-gray-50 transition font-bold active:scale-90">+</button>
        <button type="button" id="fontResetBtn" class="text-xs text-gray-500 hover:text-blue-500 ml-1 font-medium">重設</button>
      </div>
    </div>

    <div id="dataConfigPanel" class="hidden bg-white/60 dark:bg-slate-900/60 border border-gray-200/50 dark:border-gray-700/50 rounded-2xl p-4 space-y-3 shadow-inner">
      <div class="text-xs font-bold text-gray-700 dark:text-gray-300 mb-2">📥 匯出資料</div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button type="button" id="exportCsvBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-xl font-medium shadow transition active:scale-95">試算表 (CSV)</button>
        <button type="button" id="exportTxtBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-xl font-medium shadow transition active:scale-95">文字檔 (TXT)</button>
      </div>
      <div class="pt-3 border-t border-gray-200/50 dark:border-gray-700/50">
        <div class="text-[11px] font-bold text-gray-500 dark:text-gray-400 mb-2">📤 匯入資料 (CSV/TXT)</div>
        <div class="flex gap-2">
          <input type="file" id="importFileInput" accept=".csv,.txt" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-medium file:bg-gray-100 dark:file:bg-gray-700 file:text-gray-700 dark:file:text-gray-200 hover:file:bg-gray-200">
          <button type="button" id="importBtn" class="bg-gray-800 dark:bg-gray-700 hover:bg-black text-white px-4 py-1.5 rounded-xl text-xs font-medium shadow transition active:scale-95">開始匯入</button>
        </div>
      </div>
    </div>

    <div id="memberConfigPanel" class="hidden bg-white/60 dark:bg-slate-900/60 border border-gray-200/50 dark:border-gray-700/50 rounded-2xl p-4 space-y-3 shadow-inner">
      <div class="text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">👥 管理分攤成員</div>
      <div class="flex gap-2">
        <input type="text" id="newMemberName" placeholder="輸入新成員名字" class="flex-1 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-1.5 text-xs bg-white dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
        <button type="button" id="addMemberBtn" class="bg-gray-800 dark:bg-gray-700 hover:bg-black text-white px-4 py-1.5 rounded-xl text-xs font-medium shadow transition active:scale-95">加入</button>
      </div>
      <div id="memberTagList" class="flex flex-wrap gap-2 pt-1 text-xs"></div>
    </div>

    <!-- 密碼解鎖區 -->
    <div class="bg-amber-50/80 dark:bg-amber-900/20 border border-amber-200/60 dark:border-amber-700/40 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-2 flex-1 min-w-[200px]">
        <span class="text-lg">🔒</span>
        <input type="password" id="accessPassword" placeholder="請輸入存取密碼解鎖" class="flex-1 border-0 bg-white/60 dark:bg-gray-800/60 rounded-xl px-3 py-1.5 text-sm font-medium focus:ring-2 focus:ring-amber-400 outline-none transition shadow-inner">
      </div>
      <div class="flex items-center gap-2">
        <button type="button" id="authBtn" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow transition active:scale-95">解鎖</button>
        <button type="button" id="clearAuthBtn" class="text-xs text-gray-500 hover:text-red-500 font-medium px-1">清除</button>
      </div>
    </div>

    <!-- 分帳結算卡片 -->
    <div class="bg-gradient-to-br from-blue-50 to-blue-100/50 dark:from-slate-800/80 dark:to-blue-900/20 border border-blue-200/60 dark:border-blue-800/50 rounded-2xl p-4 shadow-sm">
      <div class="text-[11px] font-bold text-blue-800 dark:text-blue-300 uppercase tracking-widest mb-3 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        成員結餘 (TWD)
      </div>
      <div id="settlementGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
        <div class="col-span-full text-gray-400 py-2">請先解鎖以查看金額</div>
      </div>
      <div id="settlementTransfers" class="mt-3 pt-3 border-t border-blue-200/60 dark:border-blue-800/50 text-xs empty:hidden"></div>
    </div>

    <!-- 記帳輸入表單區 -->
    <div id="recordFormBox" class="bg-white/80 dark:bg-gray-800/90 border border-gray-100 dark:border-gray-700 shadow-sm rounded-2xl p-4 space-y-4">
      
      <!-- 編輯模式提醒橫幅 -->
      <div id="editModeBanner" class="hidden flex items-center justify-between bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">
        <span>✏️ 正在編輯紀錄 ID: <span id="editingIdText" class="font-mono"></span></span>
        <button type="button" onclick="cancelEdit()" class="bg-black/20 hover:bg-black/30 px-2 py-0.5 rounded text-[11px] transition">取消</button>
      </div>

      <!-- AI 輔助與快速記帳範本 -->
      <div class="space-y-2">
        <div class="flex items-center justify-between bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-slate-800 dark:to-indigo-900/30 p-2.5 rounded-xl border border-blue-100/50 dark:border-indigo-800/50 text-xs">
          <span class="font-bold text-blue-900 dark:text-blue-200 flex items-center gap-1">✨ <span>智慧記帳</span></span>
          <div class="flex items-center gap-2">
            <button type="button" id="voiceInputBtn" class="flex items-center gap-1 bg-white/80 dark:bg-gray-700 shadow-sm border border-gray-200/50 dark:border-gray-600 px-2.5 py-1.5 rounded-lg text-blue-600 dark:text-blue-300 font-bold hover:scale-105 transition">🎤 語音</button>
            <label class="flex items-center gap-1 bg-white/80 dark:bg-gray-700 shadow-sm border border-gray-200/50 dark:border-gray-600 px-2.5 py-1.5 rounded-lg text-emerald-600 dark:text-emerald-400 font-bold cursor-pointer hover:scale-105 transition">📷 辨識收據<input type="file" id="ocrReceiptInput" accept="image/*" class="hidden"></label>
          </div>
        </div>
        
        <!-- 🌟 常用項目快速記帳範本列 -->
        <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
          <button type="button" onclick="applyTemplate('超商咖啡', '餐飲', 65, 'TWD')" class="flex-shrink-0 bg-gray-50 dark:bg-gray-700/60 border border-gray-200 dark:border-gray-600 px-2.5 py-1 rounded-xl hover:bg-blue-50 dark:hover:bg-gray-600 transition">☕ 咖啡 $65</button>
          <button type="button" onclick="applyTemplate('地鐵交通', '交通', 200, 'TWD')" class="flex-shrink-0 bg-gray-50 dark:bg-gray-700/60 border border-gray-200 dark:border-gray-600 px-2.5 py-1 rounded-xl hover:bg-blue-50 dark:hover:bg-gray-600 transition">🚆 交通 $200</button>
          <button type="button" onclick="applyTemplate('超商零食', '生活', 150, 'TWD')" class="flex-shrink-0 bg-gray-50 dark:bg-gray-700/60 border border-gray-200 dark:border-gray-600 px-2.5 py-1 rounded-xl hover:bg-blue-50 dark:hover:bg-gray-600 transition">🛒 超商 $150</button>
          <button type="button" onclick="applyTemplate('居酒屋晚餐', '餐飲', 3500, 'JPY')" class="flex-shrink-0 bg-gray-50 dark:bg-gray-700/60 border border-gray-200 dark:border-gray-600 px-2.5 py-1 rounded-xl hover:bg-blue-50 dark:hover:bg-gray-600 transition">🍺 居酒屋 ¥3500</button>
        </div>
      </div>

      <div id="aiStatusNotice" class="hidden text-center text-xs text-blue-600 bg-blue-50 dark:bg-blue-900/30 dark:text-blue-300 font-bold py-1.5 rounded-lg animate-pulse"></div>

      <!-- 欄位輸入區 -->
      <div class="grid grid-cols-4 gap-2.5">
        <select id="type" class="border border-gray-200 dark:border-gray-600 rounded-xl px-2 py-2 text-xs bg-gray-50/50 dark:bg-gray-700 dark:text-white font-medium focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
        <select id="category" class="border border-gray-200 dark:border-gray-600 rounded-xl px-2 py-2 text-xs bg-gray-50/50 dark:bg-gray-700 dark:text-white font-medium focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="餐飲">🍔 餐飲</option><option value="交通">🚆 交通</option><option value="住宿">🏨 住宿</option>
          <option value="購物">🛍️ 購物</option><option value="門票">🎟️ 門票</option><option value="娛樂">🎮 娛樂</option>
          <option value="生活">🛒 生活</option><option value="其他">📦 其他</option>
        </select>
        <input type="text" id="title" placeholder="項目名稱 (如: 居酒屋)" class="col-span-2 border border-gray-200 dark:border-gray-600 rounded-xl px-3 py-2 text-sm bg-white dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none font-medium shadow-inner">
      </div>

      <div class="grid grid-cols-5 gap-2.5">
        <select id="currency" class="col-span-2 border border-gray-200 dark:border-gray-600 rounded-xl px-2 py-2 text-xs bg-blue-50/50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 font-bold focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="TWD">TWD 台幣</option><option value="JPY">JPY 日圓</option>
          <option value="CNY">CNY 人民幣</option><option value="USD">USD 美元</option><option value="KRW">KRW 韓元</option>
        </select>
        <input type="number" id="originalAmount" placeholder="輸入金額" step="any" class="col-span-3 border border-gray-200 dark:border-gray-600 rounded-xl px-3 py-2 text-base font-bold bg-white dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none shadow-inner text-right">
      </div>
      <div class="flex items-center justify-end text-xs text-gray-400 pr-1">
        折合台幣 <span id="previewTwd" class="font-bold text-blue-600 dark:text-blue-400 text-sm ml-1.5">0</span>
      </div>

      <!-- 分帳設定 -->
      <div id="splitSection" class="p-3.5 bg-gray-50/80 dark:bg-gray-700/30 rounded-2xl border border-gray-200/60 dark:border-gray-600/50 space-y-3">
        <div class="flex items-center justify-between text-xs">
          <span class="font-bold text-gray-600 dark:text-gray-300">付款人 (代墊)：</span>
          <select id="payer" class="border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-1 bg-white dark:bg-gray-700 font-bold text-blue-700 dark:text-blue-300 shadow-sm outline-none"></select>
        </div>
        <div class="flex items-center justify-between border-t border-gray-200 dark:border-gray-700 pt-3 text-xs">
          <span class="font-bold text-gray-600 dark:text-gray-300">分攤模式：</span>
          <div class="flex bg-gray-200 dark:bg-gray-800 p-0.5 rounded-lg shadow-inner">
            <button type="button" id="modeEqualBtn" class="px-3 py-1 rounded-md bg-white dark:bg-gray-600 font-bold text-blue-600 shadow-sm transition">平分</button>
            <button type="button" id="modeCustomBtn" class="px-3 py-1 rounded-md text-gray-500 dark:text-gray-400 font-medium hover:text-gray-800 transition">自訂</button>
          </div>
        </div>

        <div id="splitModeEqualContainer">
          <div class="flex flex-wrap gap-2 text-xs pt-1" id="membersCheckboxes"></div>
        </div>
        
        <div id="splitModeCustomContainer" class="hidden space-y-2 pt-1">
          <div class="flex justify-between items-center text-[11px] font-medium text-gray-500">
            <div class="flex items-center gap-1.5">
              <span>分攤金額：</span>
              <select id="customSplitCurrency" class="bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded px-1.5 py-0.5 outline-none focus:ring-1 focus:ring-blue-500 text-gray-700 dark:text-gray-300 transition">
                <option value="auto">依原幣別輸入</option>
                <option value="TWD">依台幣輸入 (TWD)</option>
              </select>
            </div>
            <span id="customSumStatus" class="font-mono text-gray-400">0 / 0</span>
          </div>
          <div id="customMembersList" class="space-y-1.5 max-h-40 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- 照片附件 & 日期送出 -->
      <div class="flex items-center justify-between bg-gray-50/80 dark:bg-gray-700/30 p-2.5 rounded-xl border border-gray-200/60 dark:border-gray-700/50 text-xs">
        <label class="cursor-pointer flex items-center gap-1.5 text-gray-600 dark:text-gray-300 font-medium hover:text-blue-500 transition">
          <span class="text-base">📎</span> 附加照片
          <input type="file" id="receiptPhotoInput" accept="image/*" class="hidden">
        </label>
        <div id="receiptPreviewThumb" class="hidden w-8 h-8 rounded-lg border border-gray-300 shadow-sm bg-cover bg-center"></div>
      </div>

      <div class="flex gap-2.5 pt-1">
        <input type="date" id="date" class="w-[40%] border border-gray-200 dark:border-gray-600 rounded-xl px-2.5 text-xs font-mono font-medium bg-white dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none shadow-inner">
        <button type="button" id="saveRecordBtn" class="w-[60%] bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition active:scale-95 flex justify-center items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>

    <!-- QR Code 彈窗面板 -->

      <div class="font-bold text-emerald-800 dark:text-emerald-300 text-sm mb-2">📱 掃碼收款</div>

        <button type="button" onclick="setQuickQr('822 901560055429')" class="bg-emerald-100/80 hover:bg-emerald-200 dark:bg-emerald-800/40 dark:hover:bg-emerald-800/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-xl font-bold shadow-sm transition active:scale-95">🏦 中信(822)</button>
        <button type="button" onclick="setQuickQr('808 0495968118226')" class="bg-emerald-100/80 hover:bg-emerald-200 dark:bg-emerald-800/40 dark:hover:bg-emerald-800/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-xl font-bold shadow-sm transition active:scale-95">🏦 玉山(808)</button>
        <button type="button" onclick="setQuickQr('700 00610042077578')" class="bg-emerald-100/80 hover:bg-emerald-200 dark:bg-emerald-800/40 dark:hover:bg-emerald-800/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-xl font-bold shadow-sm transition active:scale-95">🏣 郵局(700)</button>
      </div>
      <div class="flex justify-center p-2.5 bg-white rounded-xl inline-block mx-auto shadow-sm" id="qrcodeCanvas"></div>
      <input type="text" id="qrCodeInputText" placeholder="銀行帳號或轉帳網址" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-1.5 text-xs bg-white dark:bg-gray-700 outline-none focus:ring-2 focus:ring-emerald-500 text-center font-mono">
      <button type="button" id="generateQrBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-bold shadow active:scale-95 transition w-full">更新 QR Code</button>

  <!-- 照片放大彈窗 -->
  <div id="imageModal" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity" onclick="closeImageModal()">
    <img id="modalImg" class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain border border-white/20" src="" alt="收據照片">

  <!-- 底部 Footer -->
  <footer class="max-w-2xl mx-auto w-full mt-6 py-4 text-center text-[11px] text-gray-400 dark:text-gray-500 flex flex-wrap items-center justify-center gap-2">
    <div>更新時間 <span id="lastUpdatedDisplay" class="font-mono">讀取中...</span></div>
    <span>|</span>
    <a href="https://v.douyin.com/XmUkpVat8Lg/" target="_blank" class="font-bold text-blue-500 hover:text-blue-600 transition flex items-center gap-0.5">奇奇828 <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyLdzLuX2UzEpgD2fc-P_2l8L0yjfjsUgLaOTdn7tJWcRdhIG6ZY4lxFp5WAY7pFXxW/exec";
    
    let currentSheet = localStorage.getItem("app_active_sheet") || "預設帳本";
    let members = JSON.parse(localStorage.getItem("split_members")) || ["我", "小明", "小華"];
    let exchangeRates = { TWD: 1, JPY: 0.21, CNY: 4.45, USD: 32.5, KRW: 0.024 };
    let cachedRecords = [];
    let currentSplitMode = "equal";
    let uploadedReceiptBase64 = "";
    let editingRecordId = null;

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function getTodayString() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function generateUUID() {
      return 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const isErr = type === 'error', isInfo = type === 'info';
      let bgClass = isErr ? "bg-red-50 text-red-700 border-red-200" : isInfo ? "bg-blue-50 text-blue-700 border-blue-200" : "bg-emerald-50 text-emerald-700 border-emerald-200";
      let darkBgClass = isErr ? "dark:bg-red-900/80 dark:text-red-200 dark:border-red-800" : isInfo ? "dark:bg-blue-900/80 dark:text-blue-200 dark:border-blue-800" : "dark:bg-emerald-900/80 dark:text-emerald-200 dark:border-emerald-800";
      toast.className = `toast-anim flex items-center justify-center p-3 text-sm font-bold rounded-2xl shadow-lg border ${bgClass} ${darkBgClass} glass`;
      toast.innerHTML = message;
      container.appendChild(toast);
      setTimeout(() => { if(container.contains(toast)) container.removeChild(toast); }, 3500);
    }

    function updateTimestampDisplay() {
      const el = document.getElementById("lastUpdatedDisplay");
      try {
        const modifiedTime = new Date(document.lastModified);
        if (isNaN(modifiedTime.getTime())) return el.textContent = "未取得";
        const pad = (n) => String(n).padStart(2, '0');
        el.textContent = `${modifiedTime.getFullYear()}/${pad(modifiedTime.getMonth() + 1)}/${pad(modifiedTime.getDate())} ${pad(modifiedTime.getHours())}:${pad(modifiedTime.getMinutes())}`;
      } catch (e) { el.textContent = "無法讀取"; }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const swCode = `self.addEventListener("install", (e) => self.skipWaiting()); self.addEventListener("activate", (e) => self.clients.claim()); self.addEventListener("fetch", (e) => { if(e.request.url.includes("script.google")) return; e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`;
        navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: "text/javascript" }))).catch(()=>{});
      });
    }

    function applyFontSize(size) {
      size = Math.min(Math.max(parseInt(size, 10) || 16, 12), 24);
      document.documentElement.style.fontSize = `${size}px`;
      document.getElementById("fontSlider").value = size;
      document.getElementById("fontSizeDisplay").textContent = `${size}px`;
      localStorage.setItem("app_custom_font_size", size);
    }
    document.getElementById("fontSlider").addEventListener("input", (e) => applyFontSize(e.target.value));
    document.getElementById("fontDecBtn").addEventListener("click", () => applyFontSize(parseInt(document.getElementById("fontSlider").value) - 1));
    document.getElementById("fontIncBtn").addEventListener("click", () => applyFontSize(parseInt(document.getElementById("fontSlider").value) + 1));
    document.getElementById("fontResetBtn").addEventListener("click", () => applyFontSize(16));
    document.getElementById("toggleFontPanelBtn").addEventListener("click", () => document.getElementById("fontConfigPanel").classList.toggle("hidden"));

    function initTheme() {
      const isDark = localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) document.documentElement.classList.add("dark"); else document.documentElement.classList.remove("dark");
    }
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      themeToggleBtn.textContent = isDark ? "☀️" : "🌙";
    });

    function getPassword() { return document.getElementById("accessPassword").value.trim() || localStorage.getItem("app_pwd") || ""; }

    // 🌟 多帳本即時切換與防護
    document.getElementById("sheetSelector").addEventListener("change", async (e) => {
      const newSheet = e.target.value;
      if (newSheet === currentSheet) return;
      if (editingRecordId && !confirm("目前正在編輯紀錄，切換帳本將會取消編輯，是否繼續？")) {
        e.target.value = currentSheet; return;
      }
      currentSheet = newSheet; localStorage.setItem("app_active_sheet", currentSheet);
      if (typeof cancelEdit === "function") cancelEdit();
      await loadRecords();
    });

    document.getElementById("addSheetBtn").addEventListener("click", () => {
      const name = prompt("新增帳本名稱（例：2026日本行）：");
      if (name && name.trim()) {
        const cleanName = name.trim();
        const opt = document.createElement("option"); opt.value = cleanName; opt.textContent = cleanName;
        document.getElementById("sheetSelector").appendChild(opt);
        document.getElementById("sheetSelector").value = cleanName;
        currentSheet = cleanName; localStorage.setItem("app_active_sheet", currentSheet); loadRecords();
      }
    });

    async function fetchSheetList() {
      const pwd = getPassword(); if (!pwd) return;
      try {
        const res = await fetch(`${API_URL}?password=${encodeURIComponent(pwd)}&action=get_sheets`);
        const data = await res.json();
        if (data && data.sheets) {
          sheetSelector.innerHTML = data.sheets.map(s => `<option value="${escapeHtml(s)}" ${s === currentSheet ? 'selected' : ''}>${escapeHtml(s)}</option>`).join("");
        }
      } catch (e) {}
    }

    function calculateTwd() {
      const amount = parseFloat(document.getElementById("originalAmount").value) || 0;
      const rate = exchangeRates[document.getElementById("currency").value] || 1;
      return { rate, twd: Math.round(amount * rate) };
    }

    document.getElementById("modeEqualBtn").addEventListener("click", () => setSplitMode("equal"));
    document.getElementById("modeCustomBtn").addEventListener("click", () => setSplitMode("custom"));

    function setSplitMode(mode) {
      currentSplitMode = mode;
      const eBtn = document.getElementById("modeEqualBtn"), cBtn = document.getElementById("modeCustomBtn");
      const eBox = document.getElementById("splitModeEqualContainer"), cBox = document.getElementById("splitModeCustomContainer");
      if (mode === "equal") {
        eBtn.className = "px-3 py-1 rounded-md bg-white dark:bg-gray-600 font-bold text-blue-600 shadow-sm transition";
        cBtn.className = "px-3 py-1 rounded-md text-gray-500 dark:text-gray-400 font-medium hover:text-gray-800 transition";
        eBox.classList.remove("hidden"); cBox.classList.add("hidden");
      } else {
        cBtn.className = "px-3 py-1 rounded-md bg-white dark:bg-gray-600 font-bold text-blue-600 shadow-sm transition";
        eBtn.className = "px-3 py-1 rounded-md text-gray-500 dark:text-gray-400 font-medium hover:text-gray-800 transition";
        eBox.classList.add("hidden"); cBox.classList.remove("hidden"); checkCustomSplitTotal();
      }
    }

    function updateTwdPreview() {
      const { twd } = calculateTwd();
      document.getElementById("previewTwd").textContent = twd.toLocaleString();
      checkCustomSplitTotal(); return twd;
    }

    function checkCustomSplitTotal() {
      const splitCurrency = document.getElementById("customSplitCurrency").value;
      const { twd: totalTwd } = calculateTwd();
      const origAmt = parseFloat(document.getElementById("originalAmount").value) || 0;
      const targetTotal = splitCurrency === "TWD" ? totalTwd : origAmt;
      let sum = 0;
      document.querySelectorAll(".custom-split-input").forEach(i => sum += parseFloat(i.value) || 0);
      const diff = targetTotal - sum;
      const el = document.getElementById("customSumStatus");
      if (Math.abs(diff) < 0.01 && targetTotal > 0) {
        el.innerHTML = `<span class="text-emerald-500 font-bold">✓ 吻合</span>`;
      } else {
        const displaySum = splitCurrency === "TWD" ? Math.round(sum) : parseFloat(sum.toFixed(2));
        const displayDiff = splitCurrency === "TWD" ? Math.round(diff) : parseFloat(diff.toFixed(2));
        el.innerHTML = `<span class="text-red-500 font-medium">${displaySum} / ${targetTotal} (差 ${displayDiff})</span>`;
      }
    }

    document.getElementById("customSplitCurrency").addEventListener("change", () => {
      document.querySelectorAll(".custom-split-input").forEach(i => i.value = "");
      checkCustomSplitTotal();
    });

    window.autoFillDifference = function(memberName) {
      const splitCurrency = document.getElementById("customSplitCurrency").value;
      const { twd: totalTwd } = calculateTwd();
      const origAmt = parseFloat(document.getElementById("originalAmount").value) || 0;
      const targetTotal = splitCurrency === "TWD" ? totalTwd : origAmt;
      let sumOther = 0; let targetInput = null;
      document.querySelectorAll(".custom-split-input").forEach(i => {
        if (i.dataset.member === memberName) targetInput = i; else sumOther += parseFloat(i.value) || 0;
      });
      if (targetInput) { 
        let diff = Math.max(0, targetTotal - sumOther);
        targetInput.value = splitCurrency === "TWD" ? Math.round(diff) : parseFloat(diff.toFixed(2)); 
        checkCustomSplitTotal(); 
      }
    };

    function renderMemberControls() {
      document.getElementById("payer").innerHTML = members.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
      document.getElementById("membersCheckboxes").innerHTML = members.map(m => `<label class="flex items-center gap-1.5 cursor-pointer bg-white dark:bg-gray-700 px-2.5 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 shadow-sm active:scale-95 transition"><input type="checkbox" value="${escapeHtml(m)}" checked class="member-cb text-blue-500 focus:ring-blue-500 h-4 w-4 rounded"> <span>${escapeHtml(m)}</span></label>`).join("");
      document.getElementById("customMembersList").innerHTML = members.map(m => `<div class="flex items-center gap-2 bg-white dark:bg-gray-700/80 p-2 rounded-xl border border-gray-100 dark:border-gray-600 shadow-sm"><span class="w-12 font-bold text-gray-700 dark:text-gray-200 truncate">${escapeHtml(m)}</span><div class="relative flex-1"><span class="absolute left-2 top-1.5 text-gray-400 font-mono">$</span><input type="number" step="any" min="0" data-member="${escapeHtml(m)}" class="custom-split-input w-full pl-6 pr-2 py-1 border border-gray-200 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-right font-mono focus:ring-2 focus:ring-blue-500 outline-none"></div><button type="button" onclick="autoFillDifference('${escapeHtml(m)}')" class="bg-blue-50 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-bold px-2 py-1 rounded-lg hover:bg-blue-100 active:scale-95 transition">補滿</button></div>`).join("");
      document.querySelectorAll(".custom-split-input").forEach(i => i.addEventListener("input", checkCustomSplitTotal));
      document.getElementById("memberTagList").innerHTML = members.map((m, idx) => `<span class="inline-flex items-center gap-1 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 px-2.5 py-1 rounded-lg shadow-sm font-medium text-gray-700 dark:text-gray-200">${escapeHtml(m)}<button type="button" onclick="removeMember(${idx})" class="text-red-400 hover:text-red-600 text-lg ml-0.5 leading-none">×</button></span>`).join("");
      localStorage.setItem("split_members", JSON.stringify(members));
      if (cachedRecords.length > 0) renderSettlement(cachedRecords);
    }

    document.getElementById("addMemberBtn").addEventListener("click", () => {
      const val = document.getElementById("newMemberName").value.trim();
      if (val && !members.includes(val)) { members.push(val); document.getElementById("newMemberName").value = ""; renderMemberControls(); }
    });
    window.removeMember = function(idx) { if (members.length > 1) { members.splice(idx, 1); renderMemberControls(); } else alert("至少需保留一位！"); };

    document.getElementById("toggleMemberBtn").addEventListener("click", () => document.getElementById("memberConfigPanel").classList.toggle("hidden"));
    document.getElementById("toggleDataBtn").addEventListener("click", () => document.getElementById("dataConfigPanel").classList.toggle("hidden"));
    document.getElementById("type").addEventListener("change", (e) => document.getElementById("splitSection").style.display = e.target.value === "expense" ? "block" : "none");
    document.getElementById("currency").addEventListener("change", updateTwdPreview);
    document.getElementById("originalAmount").addEventListener("input", updateTwdPreview);

    // 🌟 常用項目快速記帳範本
    window.applyTemplate = function(title, category, amount, currency) {
      document.getElementById("title").value = title;
      document.getElementById("category").value = category;
      document.getElementById("currency").value = currency;
      document.getElementById("originalAmount").value = amount;
      updateTwdPreview();
      showToast(`⚡ 已套用範本：${title}`, "info");
    };

    async function fetchExchangeRates() {
      try {
        const res = await fetch("https://open.er-api.com/v6/latest/TWD"); const data = await res.json();
        if (data && data.rates) {
          exchangeRates.JPY = 1/(data.rates.JPY||4.7); exchangeRates.CNY = 1/(data.rates.CNY||0.22);
          exchangeRates.USD = 1/(data.rates.USD||0.031); exchangeRates.KRW = 1/(data.rates.KRW||41.5);
          document.getElementById("rateUpdateTime").textContent = "已同步";
        }
      } catch(e) {}
      document.getElementById("rateChipsContainer").innerHTML = ["USD","JPY","CNY","KRW"].map(c => `<div class="flex-shrink-0 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 px-3 py-1.5 rounded-xl shadow-sm"><span class="font-bold text-gray-800 dark:text-gray-100">${c}</span> <span class="font-mono text-blue-600 dark:text-blue-400 font-bold ml-1">≈ ${(exchangeRates[c]<1?exchangeRates[c].toFixed(4):exchangeRates[c].toFixed(2))}</span></div>`).join("");
      updateTwdPreview();
    }

    document.getElementById("receiptPhotoInput").addEventListener("change", e => {
      const f = e.target.files[0]; if(!f) return; const reader = new FileReader();
      reader.onload = evt => {
        const img = new Image(); img.onload = () => {
          const cvs = document.createElement("canvas"); let w=img.width, h=img.height;
          if(w>600||h>600){ if(w>h){h=(600/w)*h;w=600;}else{w=(600/h)*w;h=600;} }
          cvs.width=w; cvs.height=h; cvs.getContext("2d").drawImage(img,0,0,w,h);
          uploadedReceiptBase64 = cvs.toDataURL("image/jpeg", 0.5);
          document.getElementById("receiptPreviewThumb").style.backgroundImage = `url(${uploadedReceiptBase64})`;
          document.getElementById("receiptPreviewThumb").classList.remove("hidden");
        }; img.src = evt.target.result;
      }; reader.readAsDataURL(f);
    });

    const voiceBtn = document.getElementById("voiceInputBtn"), aiStatus = document.getElementById("aiStatusNotice");
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'zh-TW';
      voiceBtn.addEventListener("click", () => { aiStatus.textContent = "🎙️ 請說話..."; aiStatus.classList.remove("hidden"); rec.start(); });
      rec.onresult = e => {
        const txt = e.results[0][0].transcript; aiStatus.textContent = `解析中: ${txt}`;
        if(txt.includes("日")) document.getElementById("currency").value = "JPY"; else if(txt.includes("美")) document.getElementById("currency").value = "USD"; else document.getElementById("currency").value = "TWD";
        const nums = txt.match(/\d+/g); if(nums) document.getElementById("originalAmount").value = nums[nums.length-1];
        document.getElementById("title").value = txt.replace(/\d+|元|塊|台幣|日幣|美金/g, '').trim() || "語音記帳";
        updateTwdPreview(); setTimeout(() => aiStatus.classList.add("hidden"), 2000);
      };
    }

    function parseShares(item) {
      const shares = {}; const twd = Number(item.twdAmount)||0; const list = item.splitMembers||[];
      if(!list.length) return shares;
      if(list.some(s => String(s).includes(":"))) {
        list.forEach(s => { const p=String(s).split(":"); if(p[0]) shares[p[0].trim()] = parseFloat(p[1])||0; });
      } else {
        const v = list.map(s=>String(s).trim()).filter(s=>s!=="");
        if(v.length && twd>0) { const p = twd/v.length; v.forEach(m => shares[m] = p); }
      }
      return shares;
    }

    window.setQuickQr = function(accText) {
      document.getElementById("qrCodeInputText").value = accText;
      generateQrCode(accText);
    };

    window.showQrCodeModal = function(txt) {
      document.getElementById("qrCodePanel").classList.remove("hidden"); 
      document.getElementById("qrCodeInputText").value = txt||"";
      generateQrCode(txt||"null");
      document.getElementById("qrCodePanel").scrollIntoView({behavior:'smooth'});
    };
    
    function generateQrCode(text) {
      const canvas = document.getElementById("qrcodeCanvas");
      canvas.innerHTML=""; 
      new QRCode(canvas, { text: text, width: 140, height: 140, colorDark: "#064e3b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    }

    document.getElementById("generateQrBtn").addEventListener("click", () => generateQrCode(document.getElementById("qrCodeInputText").value.trim()));
    window.openImageModal = src => { document.getElementById("modalImg").src = src; document.getElementById("imageModal").classList.remove("hidden"); };
    window.closeImageModal = () => document.getElementById("imageModal").classList.add("hidden");

    function renderSettlement(records) {
      const bals = {}; members.forEach(m => bals[m]=0);
      records.forEach(r => { if(r.type==="expense"){ if(r.payer && bals[r.payer]===undefined)bals[r.payer]=0; Object.keys(parseShares(r)).forEach(m=>{if(bals[m]===undefined)bals[m]=0;}); }});
      records.forEach(r => { if(r.type==="expense"){ const t=Number(r.twdAmount)||0; if(r.payer&&t>0)bals[r.payer]+=t; Object.entries(parseShares(r)).forEach(([m,a])=>bals[m]-=a); }});
      
      const g = document.getElementById("settlementGrid"); g.innerHTML="";
      Object.keys(bals).forEach(m => {
        const val = Math.round(bals[m]); const isP = val>0; const isZ = val===0;
        g.innerHTML += `<div class="bg-white/80 dark:bg-gray-800 p-2.5 rounded-xl shadow-sm border ${isZ?'border-gray-200 dark:border-gray-700':isP?'border-emerald-200 dark:border-emerald-800':'border-red-200 dark:border-red-800'}"><div class="font-bold text-gray-700 dark:text-gray-300 truncate">${escapeHtml(m)}</div><div class="font-mono font-bold mt-1 text-sm ${isZ?'text-gray-400':isP?'text-emerald-600 dark:text-emerald-400':'text-red-500 dark:text-red-400'}">${isZ?'$0':(isP?`+$${val}`:`-$${Math.abs(val)}`)}</div></div>`;
      });

      const d=[], c=[]; Object.keys(bals).forEach(m=>{ const v=Math.round(bals[m]); if(v<-0.5)d.push({n:m,a:-v}); else if(v>0.5)c.push({n:m,a:v}); });
      d.sort((x,y)=>y.a-x.a); c.sort((x,y)=>y.a-x.a);
      const tInst=[]; let i=0, j=0;
      while(i<d.length && j<c.length) {
        const amt = Math.min(d[i].a, c[j].a);
        if(amt>0) {
          const txt = `${d[i].n} 轉給 ${c[j].n} $${Math.round(amt)}`;
          tInst.push(`<div class="flex justify-between items-center bg-white/60 dark:bg-gray-800/60 px-3 py-2 rounded-xl shadow-sm border border-blue-100 dark:border-gray-700"><span><b class="text-gray-800 dark:text-gray-200">${escapeHtml(d[i].n)}</b> <span class="text-gray-400">➔</span> <b class="text-gray-800 dark:text-gray-200">${escapeHtml(c[j].n)}</b></span><div class="flex items-center gap-2"><span class="font-mono font-bold text-blue-600 dark:text-blue-400">$${Math.round(amt)}</span><button onclick="showQrCodeModal('${escapeHtml(txt)}')" class="bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 px-2 py-1 rounded text-[10px] font-bold active:scale-90">QR</button></div></div>`);
        }
        d[i].a-=amt; c[j].a-=amt; if(d[i].a<0.5)i++; if(c[j].a<0.5)j++;
      }
      const tEl = document.getElementById("settlementTransfers");
      tEl.innerHTML = tInst.length ? `<div class="font-bold text-blue-900 dark:text-blue-300 mb-2">💡 最佳平帳轉帳路徑：</div><div class="space-y-1.5">${tInst.join("")}</div>` : `<div class="text-gray-400 text-center font-medium">🎉 帳務已完全打平</div>`;
    }

    window.startEditRecord = function(id) {
      const item = cachedRecords.find(r => r.id === id);
      if (!item) return;
      
      editingRecordId = item.id;
      document.getElementById("editingIdText").textContent = item.id.slice(0, 6) + "...";
      document.getElementById("editModeBanner").classList.remove("hidden");
      document.getElementById("saveBtnText").textContent = "儲存修改";

      document.getElementById("type").value = item.type || "expense";
      document.getElementById("category").value = item.category || "其他";
      document.getElementById("title").value = item.title || "";
      document.getElementById("currency").value = item.currency || "TWD";
      document.getElementById("originalAmount").value = item.originalAmount || "";
      document.getElementById("date").value = item.date || getTodayString();
      
      if (item.type === "expense") {
        document.getElementById("splitSection").style.display = "block";
        document.getElementById("payer").value = item.payer || members[0];
        const rawList = item.splitMembers || [];
        const isCustom = rawList.some(s => String(s).includes(":"));
        if (isCustom) {
          setSplitMode("custom");
          document.querySelectorAll(".custom-split-input").forEach(i => i.value = "");
          rawList.forEach(str => {
            const parts = String(str).split(":");
            const name = parts[0].trim();
            const amt = parseFloat(parts[1]) || 0;
            const input = document.querySelector(`.custom-split-input[data-member="${name}"]`);
            if (input) input.value = amt;
          });
        } else {
          setSplitMode("equal");
          document.querySelectorAll(".member-cb").forEach(cb => { cb.checked = rawList.includes(cb.value); });
        }
      }

      updateTwdPreview();
      document.getElementById("recordFormBox").scrollIntoView({ behavior: 'smooth' });
      showToast("✏️ 已載入紀錄至表單進行編輯", "info");
    };

    window.cancelEdit = function() {
      editingRecordId = null;
      document.getElementById("editModeBanner").classList.add("hidden");
      document.getElementById("saveBtnText").textContent = "儲存紀錄";
      document.getElementById("title").value = "";
      document.getElementById("originalAmount").value = "";
      document.querySelectorAll(".custom-split-input").forEach(i => i.value = "");
      updateTwdPreview();
      showToast("已取消編輯", "info");
    };

    function renderRecordsList() {
      document.getElementById("recordCountDisplay").textContent = cachedRecords.length;
      const listEl = document.getElementById("recordList"); listEl.innerHTML = "";
      if(cachedRecords.length===0){ listEl.innerHTML = `<div class="text-gray-400 text-center py-8">尚無資料</div>`; return; }
      
      cachedRecords.forEach(item => {
        const isExp = item.type === "expense"; const shares = parseShares(item);
        const st = Object.entries(shares).map(([n,a])=>`${n}($${Math.round(a)})`).join(", ");
        const r = document.createElement("div");
        r.className = `p-3.5 bg-white/80 dark:bg-gray-800/80 rounded-2xl shadow-sm border ${isExp?'border-gray-100 dark:border-gray-700':'border-emerald-100 dark:border-emerald-900/50'} text-xs flex justify-between items-start gap-2`;
        r.innerHTML = `<div class="flex-1 space-y-1.5"><div class="flex items-center gap-2"><span class="px-2 py-0.5 rounded-lg text-[10px] font-bold ${isExp?'bg-blue-100 text-blue-700 dark:bg-blue-900/50':'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50'}">${escapeHtml(item.category||(isExp?'支出':'收入'))}</span><span class="font-bold text-sm text-gray-900 dark:text-gray-100">${escapeHtml(item.title)}</span>${item.receiptImage?`<button onclick="openImageModal('${item.receiptImage}')" class="text-[10px] bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 rounded px-1.5 py-0.5 border border-gray-200 dark:border-gray-600">📷照</button>`:''}</div><div class="text-gray-500 dark:text-gray-400 font-mono">${escapeHtml(item.date)} · ${isExp?`<b>${escapeHtml(item.payer)}</b> 付`:'個人'}</div>${isExp&&st?`<div class="text-gray-400 dark:text-gray-500 truncate text-[11px]">${escapeHtml(st)}</div>`:''}</div><div class="text-right flex flex-col items-end gap-1.5"><div class="font-mono font-bold text-base ${isExp?'text-gray-900 dark:text-white':'text-emerald-600 dark:text-emerald-400'}">${item.currency!=='TWD'?`<span class="text-[10px] text-gray-400 font-normal block -mb-1">${escapeHtml(item.currency)}${item.originalAmount}</span>`:''}$${(item.twdAmount||0).toLocaleString()}</div><div class="flex items-center gap-1.5"><button onclick="startEditRecord('${escapeHtml(item.id)}')" class="text-[10px] font-bold text-blue-500 hover:text-blue-700 bg-blue-50 dark:bg-blue-900/20 px-2 py-1 rounded-lg active:scale-95">編輯</button><button onclick="deleteRecord('${escapeHtml(item.id)}')" class="text-[10px] font-bold text-red-400 hover:text-red-600 bg-red-50 dark:bg-red-900/20 px-2 py-1 rounded-lg active:scale-95">刪除</button></div></div>`;
        listEl.appendChild(r);
      });
    }

    async function loadRecords() {
      const pwd = getPassword();
      if(!pwd) { document.getElementById("recordList").innerHTML=`<div class="text-amber-500 text-center py-6 font-bold">🔒 請解鎖以載入資料</div>`; return; }
      showToast("🔄 同步資料中...", "info");
      try {
        const res = await fetch(`${API_URL}?password=${encodeURIComponent(pwd)}&sheetName=${encodeURIComponent(currentSheet)}`, { redirect: "follow" });
        const textResponse = await res.text();
        let data;
        try { data = JSON.parse(textResponse); } catch (parseError) { throw new Error("Google 權限阻擋或網址錯誤"); }
        if(data.error === "AUTH_FAILED") { showToast("❌ 密碼錯誤", "error"); return; }
        localStorage.setItem("app_pwd", pwd);
        cachedRecords = Array.isArray(data) ? data : [];
        renderRecordsList(); renderSettlement(cachedRecords);
        if(!document.getElementById("sheetSelector").options.length || document.getElementById("sheetSelector").options[0].value === "預設帳本") fetchSheetList();
        showToast("✅ 同步完成");
      } catch(e) { showToast(`❌ 連線失敗: ${e.message}`, "error"); }
    }

    // 🌟 儲存 / 修改紀錄邏輯（支援後端覆蓋更新）
    document.getElementById("saveRecordBtn").addEventListener("click", async () => {
      const pwd = getPassword(); if(!pwd){ showToast("請先輸入密碼解鎖", "error"); document.getElementById("accessPassword").focus(); return; }
      const title = document.getElementById("title").value.trim(); const origAmt = parseFloat(document.getElementById("originalAmount").value);
      if(!title){ showToast("請填寫名稱", "error"); document.getElementById("title").focus(); return; }
      if(isNaN(origAmt)||origAmt<=0){ showToast("請輸入有效金額", "error"); document.getElementById("originalAmount").focus(); return; }

      const { rate, twd } = calculateTwd(); let splitData = []; const type = document.getElementById("type").value;
      if(type==="expense"){
        if(currentSplitMode==="equal"){
          splitData = Array.from(document.querySelectorAll(".member-cb:checked")).map(c=>c.value);
          if(!splitData.length) return showToast("至少需勾選一位分攤成員", "error");
        } else {
          const splitCurrency = document.getElementById("customSplitCurrency").value;
          let sum = 0; 
          document.querySelectorAll(".custom-split-input").forEach(i=>{ 
            const val = parseFloat(i.value)||0; 
            if(val>0){ 
              const twdVal = splitCurrency === "TWD" ? Math.round(val) : Math.round(val * rate);
              splitData.push(`${i.dataset.member}:${twdVal}`); 
              sum += val; 
            }
          });
          if(!splitData.length) return showToast("至少需輸入一位成員金額", "error");
          const targetTotal = splitCurrency === "TWD" ? twd : origAmt;
          if(Math.abs(sum - targetTotal) > 0.01) return showToast(`差額不符，請調整！`, "error");
        }
      }

      const isEditing = Boolean(editingRecordId);
      const targetId = isEditing ? editingRecordId : generateUUID();
      const payloadRec = {
        id: targetId, action: isEditing ? "update" : "append", type: type, category: document.getElementById("category").value, title: title,
        originalAmount: origAmt, currency: document.getElementById("currency").value, rate: rate, twdAmount: twd,
        payer: type==="expense"?document.getElementById("payer").value:"", splitMembers: splitData,
        receiptImage: uploadedReceiptBase64 || (isEditing ? (cachedRecords.find(r=>r.id===targetId)?.receiptImage || "") : ""), 
        date: document.getElementById("date").value||getTodayString()
      };

      if (isEditing) {
        const idx = cachedRecords.findIndex(r => r.id === targetId);
        if (idx !== -1) cachedRecords[idx] = payloadRec;
      } else {
        cachedRecords.unshift(payloadRec);
      }

      renderRecordsList(); renderSettlement(cachedRecords);
      cancelEdit(); updateTwdPreview();
      
      showToast(isEditing ? "⏳ 更新雲端中..." : "⏳ 雲端寫入中...", "info");
      
      try {
        const res = await fetch(API_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({...payloadRec, password:pwd, sheetName:currentSheet}) });
        const result = await res.json();
        if(result.status==="success" || result.status==="updated") {
          showToast(isEditing ? "✅ 修改已同步至雲端" : "✅ 已安全儲存至雲端");
        } else throw new Error(result.message);
      } catch(e) {
        showToast("❌ 雲端同步失敗", "error"); console.error(e);
        loadRecords();
      }
    });

    window.deleteRecord = async function(id) {
      if(!getPassword() || !confirm("確定刪除此紀錄？")) return;
      const backup = [...cachedRecords];
      cachedRecords = cachedRecords.filter(r=>r.id!==id); renderRecordsList(); renderSettlement(cachedRecords);
      showToast("⏳ 刪除中...", "info");
      try {
        const res = await fetch(API_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({action:"delete",id:id,password:getPassword(),sheetName:currentSheet})});
        if((await res.json()).status!=="deleted") throw new Error();
        showToast("✅ 已從雲端刪除");
      } catch(e) { cachedRecords=backup; renderRecordsList(); renderSettlement(cachedRecords); showToast("❌ 刪除失敗", "error"); }
    };

    // 匯出與匯入功能
    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      if (cachedRecords.length === 0) return alert("目前沒有可匯出的資料或尚未解鎖！");
      const headers = ["日期", "類型", "類別", "項目", "原始金額", "幣別", "匯率", "折合台幣", "付款人", "分攤成員/金額"];
      const rows = cachedRecords.map(r => [
        `"${r.date}"`, `"${r.type === 'expense' ? '支出' : '收入'}"`, `"${r.category || '其他'}"`, `"${(r.title || '').replace(/"/g, '""')}"`,
        r.originalAmount, `"${r.currency}"`, r.rate, r.twdAmount, `"${r.payer || ''}"`, `"${(r.splitMembers || []).join(';')}"`
      ]);
      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      downloadBlob(csvContent, `記帳明細_${currentSheet}_${getFormattedDate()}.csv`, "text/csv;charset=utf-8;");
    });

    document.getElementById("exportTxtBtn").addEventListener("click", () => {
      if (cachedRecords.length === 0) return alert("目前沒有可匯出的資料或尚未解鎖！");
      let txtContent = `=== 記帳備份【${currentSheet}】(${getFormattedDate()}) ===\n\n`;
      cachedRecords.forEach((r, i) => {
        txtContent += `【#${i + 1}】${r.date} | [${r.category || '其他'}] ${r.type === 'expense' ? '支出' : '收入'} - ${r.title}\n`;
        txtContent += `  金額: ${r.currency} ${r.originalAmount} (折合 NT$ ${r.twdAmount})\n`;
        if (r.type === 'expense') {
          const shares = parseShares(r);
          const shareText = Object.entries(shares).map(([n, a]) => `${n}($${Math.round(a)})`).join(", ");
          txtContent += `  付款人: ${r.payer || '無'} | 分攤者: ${shareText || '全體'}\n`;
        }
        txtContent += `----------------------------------------\n`;
      });
      downloadBlob(txtContent, `記帳明細_${currentSheet}_${getFormattedDate()}.txt`, "text/plain;charset=utf-8;");
    });

    function downloadBlob(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function getFormattedDate() { return new Date().toISOString().split("T")[0]; }

    document.getElementById("importBtn").addEventListener("click", async () => {
      const pwd = getPassword();
      if (!pwd) return alert("請先輸入密碼解鎖後再進行匯入！");
      const fileInput = document.getElementById("importFileInput");
      if (!fileInput.files.length) return alert("請先選擇要匯入的 CSV 或 TXT 檔案！");

      const file = fileInput.files[0];
      const text = await file.text();
      let itemsToImport = [];

      try {
        if (file.name.endsWith(".csv")) {
          const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
          if (lines.length <= 1) return alert("CSV 檔案內無有效資料！");
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",").map(c => c.replace(/^"|"$/g, "").trim());
            if (cols.length >= 8) {
              itemsToImport.push({
                date: cols[0], type: cols[1] === "收入" ? "income" : "expense", category: cols[2] || "其他", title: cols[3] || "未命名",
                originalAmount: parseFloat(cols[4]) || 0, currency: cols[5] || "TWD", rate: parseFloat(cols[6]) || 1, twdAmount: parseFloat(cols[7]) || 0,
                payer: cols[8] || "", splitMembers: cols[9] ? cols[9].split(";") : []
              });
            }
          }
        } else {
          const blocks = text.split("----------------------------------------");
          blocks.forEach(b => {
            const titleMatch = b.match(/】(.+?)\s*\|\s*\[?(.*?)\]?\s*(支出|收入)\s*-\s*(.+)/);
            const amountMatch = b.match(/金額:\s*([A-Z]+)\s*([\d.]+)\s*\(折合 NT\$\s*([\d.]+)\)/);
            const payerMatch = b.match(/付款人:\s*(.*?)\s*\|\s*分攤者:\s*(.*)/);
            if (titleMatch && amountMatch) {
              itemsToImport.push({
                date: titleMatch[1].trim(), category: titleMatch[2].trim() || "其他", type: titleMatch[3].trim() === "收入" ? "income" : "expense",
                title: titleMatch[4].trim(), currency: amountMatch[1].trim(), originalAmount: parseFloat(amountMatch[2]) || 0,
                twdAmount: parseFloat(amountMatch[3]) || 0, rate: (parseFloat(amountMatch[3]) / (parseFloat(amountMatch[2]) || 1)) || 1,
                payer: payerMatch ? payerMatch[1].trim() : "", splitMembers: payerMatch && payerMatch[2] ? payerMatch[2].split(",").map(s => s.trim()) : []
              });
            }
          });
        }

        if (itemsToImport.length === 0) return alert("無法解析檔案內容，請確認檔案格式是否相容！");
        if (!confirm(`已成功解析 ${itemsToImport.length} 筆紀錄，確定要全部匯入到【${currentSheet}】嗎？`)) return;

        showToast("⏳ 匯入中...", "info");
        const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "batch_import", password: pwd, sheetName: currentSheet, items: itemsToImport }) });
        const result = await res.json();
        if (result.status === "success") { showToast(`✅ 成功匯入 ${result.count} 筆資料`); fileInput.value = ""; await loadRecords(); }
        else { showToast("❌ 匯入失敗", "error"); }
      } catch (err) { showToast("❌ 檔案解析錯誤", "error"); }
    });

    document.getElementById("authBtn").addEventListener("click", loadRecords);
    document.getElementById("accessPassword").addEventListener("keydown", e => { if (e.key === "Enter") loadRecords(); });
    document.getElementById("clearAuthBtn").addEventListener("click", () => { localStorage.removeItem("app_pwd"); document.getElementById("accessPassword").value = ""; cachedRecords = []; loadRecords(); });
    document.getElementById("refreshBtn").addEventListener("click", loadRecords);
    
    initTheme(); applyFontSize(localStorage.getItem("app_custom_font_size")||16);
    document.getElementById("date").value = getTodayString(); updateTimestampDisplay();
    if(localStorage.getItem("app_pwd")) document.getElementById("accessPassword").value = localStorage.getItem("app_pwd");
    renderMemberControls(); fetchExchangeRates().then(() => loadRecords());
  </script>
</body>
</html>
