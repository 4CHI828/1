<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDaily｜個人生活工作站</title>
  <style>
    /* CSS 主題變數宣告 */
    :root {
      --top-bg: #1e293b;
      --bottom-bg: #0f172a;
      --border-color: #334155;
      --text-color: #94a3b8;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
    }

    [data-theme="emerald"] {
      --top-bg: #064e3b;
      --bottom-bg: #022c22;
      --border-color: #047857;
      --text-color: #a7f3d0;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #34d399;
    }

    [data-theme="cyber"] {
      --top-bg: #2e1065;
      --bottom-bg: #1e1b4b;
      --border-color: #581c87;
      --text-color: #e9d5ff;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #c084fc;
    }

    [data-theme="sunset"] {
      --top-bg: #431407;
      --bottom-bg: #1c1917;
      --border-color: #7c2d12;
      --text-color: #fed7aa;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #fb923c;
    }

    [data-theme="light"] {
      --top-bg: #ffffff;
      --bottom-bg: #f8fafc;
      --border-color: #e2e8f0;
      --text-color: #64748b;
      --text-active: #0f172a;
      --hover-bg: rgba(0, 0, 0, 0.05);
      --accent: #2563eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 5% / 95% Grid 框架（含 minmax 保護） */
    .container {
      display: grid;
      grid-template-rows: minmax(44px, 5%) 1fr;
      width: 100%;
      height: 100%;
    }

    /* 上方 5% 導覽區塊 */
    .top-panel {
      background-color: var(--top-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      transition: background-color 0.4s ease, border-color 0.4s ease;
      user-select: none;
      z-index: 10;
    }

    /* 左側：品牌 Logo / 標題 + 導覽連結 */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 100%;
    }

    /* 品牌標題區域 */
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-active);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background-color: var(--border-color);
      margin: 0 4px;
    }

    /* 連結群組 */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
    }

    .nav-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-item:hover {
      background-color: var(--hover-bg);
      color: var(--text-active);
    }

    /* 當前選中狀態 */
    .nav-item.active {
      color: var(--accent);
      background-color: var(--hover-bg);
      font-weight: 600;
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* 色彩切換器（純色票點擊） */
    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .color-dot:hover {
      transform: scale(1.25);
    }

    .color-dot.active {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* 下方 95% 內容區塊 */
    .bottom-panel {
      background-color: var(--bottom-bg);
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 內嵌網頁框架 */
    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 上方 5% -->
    <header class="top-panel">
      <div class="nav-left">
        <!-- 品牌標題 -->
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>MyDaily</span>
        </div>

        <!-- 分隔線 -->
        <div class="brand-divider"></div>

        <!-- 導覽連結 -->
        <nav class="nav-links">
          <a href="smart_link_manager.html" target="content-frame" class="nav-item active" onclick="setActiveLink(this)">
            <!-- 智能連結圖示 -->
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span>智能連結</span>
          </a>

          <a href="pay.html" target="content-frame" class="nav-item" onclick="setActiveLink(this)">
            <!-- 記帳圖示 -->
            <svg class="nav-icon" viewBox="0 0 24 24">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
            <span>記帳</span>
          </a>
        </nav>
      </div>

      <!-- 右側色彩切換色票 -->
      <div class="theme-switcher">
        <button class="color-dot active" style="background: #38bdf8;" onclick="setTheme('default', this)" title="曜石黑"></button>
        <button class="color-dot" style="background: #34d399;" onclick="setTheme('emerald', this)" title="翡翠綠"></button>
        <button class="color-dot" style="background: #c084fc;" onclick="setTheme('cyber', this)" title="賽博紫"></button>
        <button class="color-dot" style="background: #fb923c;" onclick="setTheme('sunset', this)" title="日落橘"></button>
        <button class="color-dot" style="background: #64748b;" onclick="setTheme('light', this)" title="極簡淺"></button>
      </div>
    </header>

    <!-- 下方 95% -->
    <main class="bottom-panel">
      <iframe 
        name="content-frame" 
        id="content-frame" 
        class="content-frame" 
        src="smart_link_manager.html"
        allowfullscreen>
      </iframe>
    </main>
  </div>

  <script>
    // 點擊導覽項目切換高亮
    function setActiveLink(element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }

    // 切換色彩主題
    function setTheme(theme, btn) {
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }

      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
