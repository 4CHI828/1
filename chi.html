<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇奇｜個人生活工作站</title>
  <style>
    /* 五款主題色票變數設定 */
    :root,
    [data-theme="obsidian"] {
      --top-bg: #1e293b;
      --bottom-bg: #0f172a;
      --border-color: #334155;
      --text-muted: #94a3b8;
      --text-main: #f1f5f9;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --drawer-bg: rgba(30, 41, 59, 0.96);
      --card-bg: rgba(15, 23, 42, 0.7);
    }

    [data-theme="emerald"] {
      --top-bg: #064e3b;
      --bottom-bg: #022c22;
      --border-color: #047857;
      --text-muted: #a7f3d0;
      --text-main: #ecfdf5;
      --hover-bg: rgba(255, 255, 255, 0.1);
      --accent: #34d399;
      --accent-glow: rgba(52, 211, 153, 0.25);
      --drawer-bg: rgba(6, 78, 59, 0.96);
      --card-bg: rgba(2, 44, 34, 0.7);
    }

    [data-theme="cyber"] {
      --top-bg: #2e1065;
      --bottom-bg: #1a0b36;
      --border-color: #581c87;
      --text-muted: #e9d5ff;
      --text-main: #faf5ff;
      --hover-bg: rgba(255, 255, 255, 0.1);
      --accent: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.25);
      --drawer-bg: rgba(46, 16, 101, 0.96);
      --card-bg: rgba(26, 11, 54, 0.7);
    }

    [data-theme="sunset"] {
      --top-bg: #431407;
      --bottom-bg: #1c1917;
      --border-color: #7c2d12;
      --text-muted: #fed7aa;
      --text-main: #fff7ed;
      --hover-bg: rgba(255, 255, 255, 0.1);
      --accent: #fb923c;
      --accent-glow: rgba(251, 146, 60, 0.25);
      --drawer-bg: rgba(67, 20, 7, 0.96);
      --card-bg: rgba(28, 25, 23, 0.7);
    }

    [data-theme="light"] {
      --top-bg: #ffffff;
      --bottom-bg: #f8fafc;
      --border-color: #e2e8f0;
      --text-muted: #64748b;
      --text-main: #0f172a;
      --hover-bg: rgba(0, 0, 0, 0.05);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.18);
      --drawer-bg: rgba(255, 255, 255, 0.96);
      --card-bg: rgba(241, 245, 249, 0.9);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bottom-bg);
      color: var(--text-main);
      transition: background-color 0.3s ease;
    }

    /* 嚴格 5% / 95% 上下分割框架 */
    .app-layout {
      display: grid;
      grid-template-rows: minmax(44px, 5vh) 1fr;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      position: relative;
      transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 專注全螢幕模式：收合頂部 5%，讓下方 100% 滿版 */
    .app-layout.focus-mode {
      grid-template-rows: 0px 1fr;
    }

    .app-layout.focus-mode .top-bar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-100%);
      border-bottom: none;
    }

    .top-bar {
      background-color: var(--top-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
      z-index: 50;
      position: relative;
      transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease, opacity 0.2s ease;
      overflow-x: auto;
      overflow-y: hidden;
      user-select: none;
    }

    .top-bar::-webkit-scrollbar {
      display: none;
    }

    /* 頂部下緣平滑載入進度條 */
    .loading-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #f43f5e);
      z-index: 60;
      opacity: 0;
      transition: width 0.35s ease, opacity 0.3s ease;
      box-shadow: 0 0 8px var(--accent-glow);
      pointer-events: none;
    }

    .loading-bar.active {
      width: 78%;
      opacity: 1;
    }

    .loading-bar.done {
      width: 100%;
      opacity: 0;
    }

    /* 左側品牌與導覽頁籤區 */
    .nav-left-section {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      height: 100%;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .brand-box:hover {
      background-color: var(--hover-bg);
    }

    .brand-icon {
      width: 19px;
      height: 19px;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: var(--text-main);
      white-space: nowrap;
    }

    .nav-separator {
      width: 1px;
      height: 16px;
      background-color: var(--border-color);
      flex-shrink: 0;
    }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 100%;
    }

    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
      background: transparent;
    }

    .nav-tab:hover {
      background-color: var(--hover-bg);
      color: var(--text-main);
    }

    .nav-tab.active {
      color: var(--accent);
      background-color: var(--hover-bg);
      border-color: rgba(255, 255, 255, 0.08);
      font-weight: 600;
      box-shadow: inset 0 0 10px var(--accent-glow);
    }

    .tab-icon {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      opacity: 0.55;
      font-size: 13px;
      margin-left: 2px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .tab-close:hover {
      opacity: 1;
      background-color: rgba(239, 68, 68, 0.22);
      color: #ef4444;
    }

    .btn-add-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px dashed var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-add-tab:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--hover-bg);
      transform: scale(1.06);
    }

    .nav-right-section {
      display: flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
      height: 100%;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background-color: var(--hover-bg);
      color: var(--text-main);
    }

    .action-btn.active {
      color: var(--accent);
      background-color: var(--hover-bg);
    }

    .action-icon {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* 即時時間與星期 */
    .live-clock {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .live-clock-time {
      font-weight: 600;
      color: var(--text-main);
    }

    /* 5 款純色圓點主題切換器 */
    .theme-palette {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .color-dot:hover {
      transform: scale(1.28);
    }

    .color-dot.active {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .workspace-area {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--bottom-bg);
      overflow: hidden;
    }

    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }

    /* 右上角半透明微型浮動膠囊按鈕 (專注模式恢復頂部列) */
    .focus-exit-pill {
      position: fixed;
      top: 12px;
      right: 16px;
      transform: translateY(-80px);
      background: var(--drawer-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, background-color 0.2s ease;
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
    }

    .focus-exit-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .app-layout.focus-mode .focus-exit-pill {
      transform: translateY(0);
      opacity: 0.88;
      pointer-events: auto;
    }

    .app-layout.focus-mode .focus-exit-pill:hover {
      opacity: 1;
    }

    .scratchpad-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 330px;
      max-width: 90vw;
      height: 100%;
      background: var(--drawer-bg);
      border-left: 1px solid var(--border-color);
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      z-index: 45;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .scratchpad-drawer.open {
      transform: translateX(0);
    }

    .scratchpad-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .scratchpad-title {
      font-size: 0.86rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scratchpad-status {
      font-size: 0.72rem;
      color: var(--accent);
    }

    .scratchpad-textarea {
      flex: 1;
      width: 100%;
      padding: 14px 16px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .scratchpad-footer {
      padding: 9px 14px;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 彈出對話框 (新增頁籤) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--top-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .modal-input-group {
      margin-bottom: 12px;
    }

    .modal-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 5px;
    }

    .modal-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
      font-size: 0.85rem;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-secondary, .btn-primary {
      padding: 6px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: var(--hover-bg);
      color: var(--text-muted);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body data-theme="obsidian">

  <div class="app-layout" id="appLayout">
    <!-- 頂部 5% 導覽列 -->
    <header class="top-bar" id="topBar">
      <!-- 左側：品牌區 + 導覽頁籤 -->
      <div class="nav-left-section">
        <div class="brand-box" onclick="reloadCurrentTab()" title="奇奇｜個人生活工作站 (點擊重新載入目前分頁)">

        <!-- 動態新增自訂頁籤按鈕 -->
        <button class="btn-add-tab" onclick="openAddTabModal()" title="新增自訂頁籤">+</button>
      </div>

      <!-- 右側：工具區 + 即時時間 + 純色主題切換器 -->
      <div class="nav-right-section">
        <div class="action-group">
          <!-- 🔄 重新整理下方 iframe -->
          <button class="action-btn" onclick="reloadCurrentTab()" title="重新整理目前畫面">
            <svg class="action-icon" viewBox="0 0 24 24">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"></path>
            </svg>
          </button>

          <!-- ↗ 在新分頁開啟目前 iframe 網址 -->
          <button class="action-btn" onclick="openInNewWindow()" title="在新分頁開啟目前網頁">
            <svg class="action-icon" viewBox="0 0 24 24">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>

          <!-- ⛶ 專注全螢幕模式切換 -->
          <button class="action-btn" id="focusBtn" onclick="toggleFocusMode()" title="專注全螢幕模式 (快速鍵 F / Esc 退出)">
            <svg class="action-icon" viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>

          <!-- 📝 隨手備忘錄按鈕 -->
          <button class="action-btn" id="scratchpadToggle" onclick="toggleScratchpad()" title="隨手備忘錄">
            <svg class="action-icon" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </button>
        </div>

        <div class="nav-separator"></div>

        <!-- ⏰ 即時時間與星期顯示 -->
        <div class="live-clock">
          <span class="live-clock-time" id="liveTime">00:00</span>
          <span id="liveDay">週日</span>
        </div>

        <div class="nav-separator"></div>

        <!-- 🎨 5 款純色圓點主題切換器 -->
        <div class="theme-palette">
          <button class="color-dot active" data-theme-btn="obsidian" style="background: #38bdf8;" onclick="changeTheme('obsidian')"></button>
          <button class="color-dot" data-theme-btn="emerald" style="background: #34d399;" onclick="changeTheme('emerald')"></button>
          <button class="color-dot" data-theme-btn="cyber" style="background: #c084fc;" onclick="changeTheme('cyber')"></button>
          <button class="color-dot" data-theme-btn="sunset" style="background: #fb923c;" onclick="changeTheme('sunset')"></button>
          <button class="color-dot" data-theme-btn="light" style="background: #64748b;" onclick="changeTheme('light')"></button>
        </div>
      </div>

      <!-- 頂部下緣平滑載入進度條 -->
      <div class="loading-bar" id="loadingBar"></div>
    </header>

    <!-- 下方 95% 內容區 -->
    <main class="workspace-area">
      <iframe 
        name="content-frame" 
        id="content-frame" 
        class="app-frame" 
        src="smart_link_manager.html"
        allowfullscreen>
      </iframe>

      <!-- 右側滑出半透明隨手備忘錄抽屜 -->
      <aside class="scratchpad-drawer" id="scratchpadDrawer">
        <div class="scratchpad-header">
          <div class="scratchpad-title">
            <svg style="width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;" viewBox="0 0 24 24">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>隨手備忘錄</span>
          </div>
          <span class="scratchpad-status" id="scratchpadStatus">已自動儲存</span>
        </div>
        <textarea 
          class="scratchpad-textarea" 
          id="scratchpadInput" 
          placeholder="在此輸入臨時筆記、連結或待辦事項，內容將即時自動儲存於瀏覽器..."></textarea>
        <div class="scratchpad-footer">
          <span>LocalStorage 即時同步</span>
          <div class="drawer-btn-group">
            <button class="btn-secondary" style="padding:3px 9px; font-size:0.73rem;" onclick="copyScratchpad()">一鍵複製</button>
            <button class="btn-secondary" style="padding:3px 9px; font-size:0.73rem;" onclick="clearScratchpad()">清空</button>
          </div>
        </div>
      </aside>

      <!-- 右上角半透明微型浮動膠囊按鈕 (專注模式時顯示) -->
      <button class="focus-exit-pill" onclick="toggleFocusMode()" title="退出全螢幕 (Esc)">
        <svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <span>退出全螢幕</span>
      </button>
    </main>
  </div>

  <!-- 新增自訂頁籤對話框 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 class="modal-title">新增自訂頁籤</h3>
      <div class="modal-input-group">
        <label class="modal-label">名稱</label>
        <input type="text" id="tabNameInput" class="modal-input" placeholder="例如：行事曆、筆記" maxlength="16">
      </div>
      <div class="modal-input-group">
        <label class="modal-label">網址 / 相對路徑</label>
        <input type="text" id="tabUrlInput" class="modal-input" placeholder="例如：calendar.html 或 https://...">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAddTabModal()">取消</button>
        <button class="btn-primary" onclick="confirmAddTab()">儲存新增</button>
      </div>
    </div>
  </div>

  <script>
    // LocalStorage 儲存鍵值
    const STORAGE_KEY_THEME = 'chichi_theme';
    const STORAGE_KEY_LAST_TAB = 'chichi_last_tab';
    const STORAGE_KEY_CUSTOM_TABS = 'chichi_custom_tabs';
    const STORAGE_KEY_NOTES = 'chichi_scratchpad_notes';

    const iframeEl = document.getElementById('content-frame');
    const loadingBar = document.getElementById('loadingBar');
    let currentUrl = 'smart_link_manager.html';

    // 頂部進度條動畫控制
    function startLoadingBar() {
      loadingBar.className = 'loading-bar active';
    }

    iframeEl.addEventListener('load', () => {
      loadingBar.className = 'loading-bar done';
      setTimeout(() => {
        loadingBar.className = 'loading-bar';
      }, 350);
    });

    // 點擊或切換頁籤
    function handleTabClick(e, tabElement) {
      if (e) e.preventDefault();
      const targetUrl = tabElement.getAttribute('data-url');
      if (!targetUrl) return;

      document.querySelectorAll('.nav-tab').forEach(item => item.classList.remove('active'));
      tabElement.classList.add('active');

      startLoadingBar();
      iframeEl.src = targetUrl;
      currentUrl = targetUrl;
      localStorage.setItem(STORAGE_KEY_LAST_TAB, targetUrl);
    }

    // 重新整理目前下方 iframe
    function reloadCurrentTab() {
      startLoadingBar();
      try {
        iframeEl.src = currentUrl || iframeEl.getAttribute('src');
      } catch (err) {
        iframeEl.src = currentUrl;
      }
    }

    // 在新分頁開啟目前 iframe 網址
    function openInNewWindow() {
      const target = currentUrl || iframeEl.getAttribute('src') || 'smart_link_manager.html';
      window.open(target, '_blank');
    }

    // 專注全螢幕模式切換
    function toggleFocusMode() {
      const layout = document.getElementById('appLayout');
      layout.classList.toggle('focus-mode');
    }

    function loadCustomTabs() {
      try {
        const savedTabs = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM_TABS) || '[]');
        savedTabs.forEach(tab => createCustomTabDOM(tab.name, tab.url));
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY_CUSTOM_TABS);
      }
    }

    function createCustomTabDOM(name, url) {
      const container = document.getElementById('tabsContainer');
      const link = document.createElement('a');
      link.href = url;
      link.target = 'content-frame';
      link.className = 'nav-tab';
      link.setAttribute('data-url', url);
      link.setAttribute('data-custom', 'true');
      link.onclick = (e) => handleTabClick(e, link);

      link.innerHTML = `
        <svg class="tab-icon" viewBox="0 0 24 24">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>${escapeHtml(name)}</span>
        <span class="tab-close" title="刪除此自訂頁籤">&times;</span>
      `;

      const closeBtn = link.querySelector('.tab-close');
      closeBtn.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        deleteCustomTab(url, link);
      });

      container.appendChild(link);
    }

    function openAddTabModal() {
      document.getElementById('modalOverlay').classList.add('active');
      setTimeout(() => document.getElementById('tabNameInput').focus(), 50);
    }

    function closeAddTabModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.getElementById('tabNameInput').value = '';
      document.getElementById('tabUrlInput').value = '';
    }

    function confirmAddTab() {
      const name = document.getElementById('tabNameInput').value.trim();
      const url = document.getElementById('tabUrlInput').value.trim();
      if (!name || !url) return;

      const savedTabs = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM_TABS) || '[]');
      savedTabs.push({ name, url });
      localStorage.setItem(STORAGE_KEY_CUSTOM_TABS, JSON.stringify(savedTabs));

      createCustomTabDOM(name, url);
      closeAddTabModal();

      const allCustom = document.querySelectorAll('.nav-tab[data-custom="true"]');
      const newestTab = allCustom[allCustom.length - 1];
      if (newestTab) handleTabClick(null, newestTab);
    }

    function deleteCustomTab(url, tabDom) {
      let savedTabs = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM_TABS) || '[]');
      savedTabs = savedTabs.filter(t => t.url !== url);
      localStorage.setItem(STORAGE_KEY_CUSTOM_TABS, JSON.stringify(savedTabs));

      const wasActive = tabDom.classList.contains('active');
      tabDom.remove();

      if (wasActive) {
        const firstTab = document.querySelector('.nav-tab');
        if (firstTab) handleTabClick(null, firstTab);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function initLiveClock() {
      const timeEl = document.getElementById('liveTime');
      const dayEl = document.getElementById('liveDay');
      const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

      function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeEl.textContent = `${hours}:${minutes}`;
        dayEl.textContent = weekDays[now.getDay()];
      }

      updateClock();
      setInterval(updateClock, 1000);
    }

    // 隨手備忘錄控制
    const scratchpadDrawer = document.getElementById('scratchpadDrawer');
    const scratchpadInput = document.getElementById('scratchpadInput');
    const scratchpadStatus = document.getElementById('scratchpadStatus');

    function toggleScratchpad() {
      const isOpen = scratchpadDrawer.classList.toggle('open');
      document.getElementById('scratchpadToggle').classList.toggle('active', isOpen);
      if (isOpen) scratchpadInput.focus();
    }

    function initScratchpad() {
      scratchpadInput.value = localStorage.getItem(STORAGE_KEY_NOTES) || '';
      let timer;
      scratchpadInput.addEventListener('input', () => {
        scratchpadStatus.textContent = '儲存中...';
        clearTimeout(timer);
        timer = setTimeout(() => {
          localStorage.setItem(STORAGE_KEY_NOTES, scratchpadInput.value);
          scratchpadStatus.textContent = '已自動儲存';
        }, 250);
      });
    }

    function copyScratchpad() {
      if (!scratchpadInput.value) {
        scratchpadStatus.textContent = '無內容可複製';
        return;
      }
      scratchpadInput.select();
      document.execCommand('copy');
      scratchpadStatus.textContent = '已複製到剪貼簿！';
      setTimeout(() => {
        scratchpadStatus.textContent = '已自動儲存';
      }, 1800);
    }

    function clearScratchpad() {
      scratchpadInput.value = '';
      localStorage.removeItem(STORAGE_KEY_NOTES);
      scratchpadStatus.textContent = '已清空備忘錄';
      setTimeout(() => {
        scratchpadStatus.textContent = '已自動儲存';
      }, 1800);
    }

    // 主題切換與記憶
    function changeTheme(themeName) {
      document.body.setAttribute('data-theme', themeName);
      localStorage.setItem(STORAGE_KEY_THEME, themeName);
      document.querySelectorAll('.color-dot').forEach(dot => {
        dot.classList.toggle('active', dot.getAttribute('data-theme-btn') === themeName);
      });
    }

    function loadSavedTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'obsidian';
      changeTheme(savedTheme);
    }

    // 全域鍵盤快速鍵 (Alt+1~5, F 專注模式, Esc 退出)
    window.addEventListener('keydown', (e) => {
      const isInputFocused = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);

      if (e.key === 'Escape') {
        const layout = document.getElementById('appLayout');
        if (layout.classList.contains('focus-mode')) layout.classList.remove('focus-mode');
        if (scratchpadDrawer.classList.contains('open')) toggleScratchpad();
        closeAddTabModal();
      }

      if ((e.key === 'f' || e.key === 'F') && !isInputFocused && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        toggleFocusMode();
      }

      if (e.altKey && ['1', '2', '3', '4', '5'].includes(e.key)) {
        e.preventDefault();
        const index = parseInt(e.key, 10) - 1;
        const tabs = document.querySelectorAll('.nav-tab');
        if (tabs[index]) handleTabClick(null, tabs[index]);
      }
    });

    // 支援於對話框按 Enter 直接新增頁籤
    document.getElementById('tabUrlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmAddTab();
    });

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      initLiveClock();
      initScratchpad();
      loadCustomTabs();
      loadSavedTheme();

      const savedUrl = localStorage.getItem(STORAGE_KEY_LAST_TAB) || 'smart_link_manager.html';
      const targetTab = Array.from(document.querySelectorAll('.nav-tab')).find(
        tab => tab.getAttribute('data-url') === savedUrl
      );

      if (targetTab) {
        handleTabClick(null, targetTab);
      } else {
        const defaultTab = document.querySelector('.nav-tab');
        if (defaultTab) handleTabClick(null, defaultTab);
      }
    });
  </script>
</body>
</html>
