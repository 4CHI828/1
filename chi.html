<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5:95 框架導覽</title>
  <style>
    /* CSS 主題變數宣告 */
    :root {
      --top-bg: #1e293b;
      --bottom-bg: #0f172a;
      --border-color: #334155;
      --text-color: #94a3b8;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
    }

    [data-theme="emerald"] {
      --top-bg: #064e3b;
      --bottom-bg: #022c22;
      --border-color: #047857;
      --text-color: #a7f3d0;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #34d399;
    }

    [data-theme="cyber"] {
      --top-bg: #2e1065;
      --bottom-bg: #1e1b4b;
      --border-color: #581c87;
      --text-color: #e9d5ff;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #c084fc;
    }

    [data-theme="sunset"] {
      --top-bg: #431407;
      --bottom-bg: #1c1917;
      --border-color: #7c2d12;
      --text-color: #fed7aa;
      --text-active: #ffffff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --accent: #fb923c;
    }

    [data-theme="light"] {
      --top-bg: #ffffff;
      --bottom-bg: #f8fafc;
      --border-color: #e2e8f0;
      --text-color: #64748b;
      --text-active: #0f172a;
      --hover-bg: rgba(0, 0, 0, 0.05);
      --accent: #2563eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 5% / 95% Grid 框架（加入 minmax 避免在手機端 5% 太扁） */
    .container {
      display: grid;
      grid-template-rows: minmax(42px, 5%) 1fr;
      width: 100%;
      height: 100%;
    }

    /* 上方 5% 導覽區塊 */
    .top-panel {
      background-color: var(--top-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      transition: background-color 0.4s ease, border-color 0.4s ease;
      user-select: none;
      z-index: 10;
    }

    /* 連結群組 */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 100%;
    }

    .nav-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-item:hover {
      background-color: var(--hover-bg);
      color: var(--text-active);
    }

    /* 當前選中狀態 */
    .nav-item.active {
      color: var(--accent);
      background-color: var(--hover-bg);
      font-weight: 600;
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* 色彩切換器（純色票點擊） */
    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .color-dot:hover {
      transform: scale(1.25);
    }

    .color-dot.active {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* 下方 95% 內容區塊 */
    .bottom-panel {
      background-color: var(--bottom-bg);
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 內嵌網頁框架 */
    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff; /* 確保載入的網頁有預設白底 */
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 上方 5% -->
    <header class="top-panel">
      <!-- 導覽連結：target 指向下方 iframe 的 name -->
      <nav class="nav-links">
        <a href="https://4chi828.github.io/1/smart_link_manager.html" target="content-frame" class="nav-item active" onclick="setActiveLink(this)">
          <!-- 智能連結圖示 -->
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>智能連結</span>
        </a>

        <a href="https://4chi828.github.io/1/pay.html" target="content-frame" class="nav-item" onclick="setActiveLink(this)">
          <!-- 記帳圖示 -->
          <svg class="nav-icon" viewBox="0 0 24 24">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
          <span>記帳</span>
        </a>
      </nav>

      <!-- 色彩切換色票 -->
      <div class="theme-switcher">
        <button class="color-dot active" style="background: #38bdf8;" onclick="setTheme('default', this)"></button>
        <button class="color-dot" style="background: #34d399;" onclick="setTheme('emerald', this)"></button>
        <button class="color-dot" style="background: #c084fc;" onclick="setTheme('cyber', this)"></button>
        <button class="color-dot" style="background: #fb923c;" onclick="setTheme('sunset', this)"></button>
        <button class="color-dot" style="background: #64748b;" onclick="setTheme('light', this)"></button>
      </div>
    </header>

    <!-- 下方 95%：放入 iframe -->
    <main class="bottom-panel">
      <iframe 
        name="content-frame" 
        id="content-frame" 
        class="content-frame" 
        src="https://4chi828.github.io/1/smart_link_manager.html"
        allowfullscreen>
      </iframe>
    </main>
  </div>

  <script>
    // 點擊導覽項目時切換 active 高亮
    function setActiveLink(element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }

    // 主題切換函式
    function setTheme(theme, btn) {
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }

      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
